name: PR Checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  playwright:
    name: Playwright ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright shard
        run: npm test -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}-${{ github.run_attempt }}
          path: blob-report
          if-no-files-found: error
          retention-days: 1

  merge-reports:
    name: Playwright report
    if: ${{ !cancelled() }}
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required PR checks
    if: ${{ always() }}
    needs: [quality, playwright, merge-reports]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          REPORT_RESULT: ${{ needs.merge-reports.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$PLAYWRIGHT_RESULT" != "success" ] || [ "$REPORT_RESULT" != "success" ]; then
            echo "Required jobs did not all pass: quality=$QUALITY_RESULT playwright=$PLAYWRIGHT_RESULT report=$REPORT_RESULT"
            exit 1
          fi
