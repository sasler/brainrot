      {name:'Brass Foyer',par:2,subtitle:'The first tooth in the machine.',desc:'Teach the old house to remember you. A brass plate holds the door while an echo walks the line.',spawn:P(112,620),exit:P(1135,620),artifact:P(1034,138),walls:[R(260,82,38,430),R(560,180,38,430),R(850,82,38,435)],gates:[{x:850,y:515,w:38,h:150,req:['plate-foyer']}],interactives:[{id:'plate-foyer',kind:'plate',label:'FOYER PLATE',x:170,y:330}],guards:[],cameras:[]},

    function tone(freq,duration=.12,type='sine',volume=.16,delay=0){

    function startMusic(){

    function clonePoint(p){return{x:p.x,y:p.y}}

    function resume(){setMode(returnMode);announce('The mechanism resumes.')}
    function updateCampaign(dt){movePlayer(dt);updateGuards(dt);loopTime+=dt;if(loopTime>=LOOP){commitLoop('natural')}updateParticles(dt);updateDom()}
    function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;if(mode==='campaign')updateCampaign(dt);else if(mode==='vault'){updateVault(dt);updateParticles(dt);updateDom()}else updateParticles(dt);renderCanvas(now/1000);requestAnimationFrame(frame)}
    function resize(){const scale=Math.min(window.innerWidth/W,window.innerHeight/H);stage.style.width=Math.floor(W*scale)+'px';stage.style.height=Math.floor(H*scale)+'px'}
    window.addEventListener('resize',resize);resize();
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();ensureAudio();if(e.code==='KeyM'){setMuted(!muted);return}if(e.code==='Escape'||e.code==='KeyP'){if(mode==='campaign'||mode==='vault'||mode==='paused')togglePause();return}if(mode==='title'&&e.code==='Enter'){startCampaign();return}if(mode==='campaign'||mode==='vault'){if(e.code==='KeyR'&&mode==='campaign'){commitLoop('manual');return}if((e.code==='KeyE'||e.code==='Space')&&!e.repeat){interact();return}keys.add(e.code)}});
    window.addEventListener('keyup',e=>keys.delete(e.code));
    window.addEventListener('blur',()=>{keys.clear();if(mode==='campaign'||mode==='vault')togglePause()});
    document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();if(mode==='campaign'||mode==='vault')togglePause()}});
    canvas.addEventListener('pointerdown',()=>ensureAudio());
    updateDom();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
