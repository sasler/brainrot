      ctx.strokeStyle = "rgba(212,164,71,.55)"; ctx.stroke();
      drawText("WASD / ARROWS", 310, 558, 13, COLORS.brass, "left", 900);
      drawText("MOVE", 310, 584, 18, COLORS.ivory, "left", 800);
      drawText("E / SPACE", 505, 558, 13, COLORS.brass, "left", 900);
      drawText("INTERACT", 505, 584, 18, COLORS.ivory, "left", 800);
      drawText("R", 690, 558, 13, COLORS.brass, "left", 900);
      drawText("COMMIT & REWIND", 690, 584, 18, COLORS.ivory, "left", 800);
      drawText("P / ESC · M", 875, 558, 13, COLORS.brass, "left", 900);
      drawText("PAUSE · MUTE", 875, 584, 18, COLORS.ivory, "left", 800);
      drawText("SESSION-ONLY BESTS · NO SAVED STORAGE", 640, 658, 11, "#7f827b", "center", 700);
    }

    function drawInstructions(now) {
      drawMenuBackdrop(now);
      drawText("THE CAPER'S THREE LAWS", 640, 78, 38, COLORS.ivory, "center", 900, "Georgia, serif");
      drawText("EVERY ROOM RESETS. YOUR MEMORY DOES NOT.", 640, 116, 13, COLORS.brass, "center", 900);
      const cards = [
        { x: 115, title: "I · STEAL TIME", color: COLORS.brass, body: "Each loop lasts exactly 12 seconds. Press R early or let the clock expire to commit your live path and actions." },
        { x: 455, title: "II · CONDUCT ECHOES", color: COLORS.mint, body: "Up to four echoes replay deterministically. They hold plates, turn levers, sound lures, and distract guards — but only you can steal or exit." },
        { x: 795, title: "III · BREAK SIGHT", color: COLORS.danger, body: "Live detection starts a 3-second alarm. Stay unseen for 0.75 seconds to cancel it. Failure discards only the current trace; older echoes remain." }
      ];
      for (const card of cards) {
        decoPath(card.x, 164, 310, 300, 16);
        ctx.fillStyle = "rgba(8,12,17,.9)"; ctx.fill();
        ctx.strokeStyle = card.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = card.color;
        ctx.beginPath(); ctx.arc(card.x + 155, 235, 45, 0, TAU); ctx.stroke();
        for (let i = 0; i < 12; i++) {
          const a = i * TAU / 12;
          ctx.beginPath(); ctx.moveTo(card.x + 155 + Math.cos(a) * 35, 235 + Math.sin(a) * 35); ctx.lineTo(card.x + 155 + Math.cos(a) * 43, 235 + Math.sin(a) * 43); ctx.stroke();
        }
        drawText(card.title, card.x + 155, 322, 18, card.color, "center", 900);
        wrapText(card.body, card.x + 155, 355, 248, 24, 16, COLORS.ivory, "center", 600, 5);
      }
      drawText("MEDALS", 270, 508, 12, COLORS.brass, "center", 900);
      drawText("BRONZE  COMPLETE · SILVER  ≤ PAR+1 & ≤1 ALARM · GOLD  ≤ PAR & 0 ALARMS", 270, 538, 15, COLORS.ivory, "center", 700);
      drawText("FOCUS LOSS PAUSES AUTOMATICALLY · REDUCED MOTION IS HONORED", 270, 568, 11, "#92938a", "center", 700);
      drawButton(790, 500, 330, 56, "BEGIN AT THE FOYER", () => startCampaign(0), "CAMPAIGN");
      drawButton(790, 570, 330, 48, "BACK TO TITLE", () => { state.screen = "title"; state.mode = "menu"; syncDomState(true); });
    }

    function drawMedalSeal(x, y, radius, medal, label = "") {
      const color = medal === "gold" ? "#edc45e" : medal === "silver" ? "#bac6c9" : medal === "bronze" ? "#a96c41" : "#394246";
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "rgba(8,12,17,.88)";
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, radius - 9, 0, TAU); ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = -Math.PI / 2 + i * TAU / 8;
        const r = i % 2 ? radius * .34 : radius * .58;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
      if (label) drawText(label, x, y + radius + 18, 11, color, "center", 900);
    }

    function dimScene() {
      ctx.fillStyle = "rgba(3,6,8,.72)";
      ctx.fillRect(0, 0, W, H);
    }

    function drawPause() {
      dimScene();
      decoPath(390, 145, 500, 450, 18);
      ctx.fillStyle = "rgba(9,14,18,.96)"; ctx.fill();
      ctx.strokeStyle = COLORS.brass; ctx.lineWidth = 2; ctx.stroke();
      drawText("TIME SUSPENDED", 640, 195, 34, COLORS.ivory, "center", 900, "Georgia, serif");
      drawText(state.pauseReason, 640, 230, 12, COLORS.brass, "center", 900);
      drawButton(470, 266, 340, 58, "RESUME", () => resumeGame(), "P / ESC");
      drawButton(470, 336, 340, 58, state.mode === "infinite" ? "RESTART VAULT RUN" : "RESTART ROOM", () => restartCurrent(), "CLEARS CURRENT ECHOES");
      drawButton(470, 406, 340, 52, Sound.muted ? "UNMUTE AUDIO" : "MUTE AUDIO", () => toggleMute(), "M");
      drawButton(470, 470, 340, 52, "RETURN TO TITLE", () => quitToTitle(), "SESSION BESTS STAY");
      drawText("WASD / ARROWS · E / SPACE · R REWIND", 640, 557, 11, "#8c9089", "center", 700);
    }

    function drawLevelResult() {
      dimScene();
      decoPath(270, 112, 740, 510, 20);
      ctx.fillStyle = "rgba(8,12,17,.97)"; ctx.fill();
      ctx.strokeStyle = COLORS.brass; ctx.lineWidth = 2; ctx.stroke();
      drawText("ROOM CLEARED", 640, 153, 13, COLORS.brass, "center", 900);
      drawText(state.result.name, 640, 190, 31, COLORS.ivory, "center", 900, "Georgia, serif");
      drawMedalSeal(410, 318, 83, state.result.medal, state.result.medal.toUpperCase());
      const medalColor = state.result.medal === "gold" ? "#edc45e" : state.result.medal === "silver" ? "#bac6c9" : "#a96c41";
      drawText(state.result.medal.toUpperCase(), 410, 420, 19, medalColor, "center", 900);
      drawText("LOOPS", 575, 270, 11, COLORS.brass, "center", 900);
      drawText(String(state.result.loops), 575, 310, 34, COLORS.ivory, "center", 900);
      drawText(`PAR ${state.result.par}`, 575, 344, 12, "#98988e", "center", 800);
      drawText("ALARMS", 735, 270, 11, COLORS.brass, "center", 900);
      drawText(String(state.result.alarms), 735, 310, 34, state.result.alarms ? COLORS.danger : COLORS.mint, "center", 900);
      drawText(state.result.alarms ? "SILENCE BROKEN" : "PERFECTLY CLEAN", 735, 344, 12, state.result.alarms ? COLORS.danger : COLORS.mint, "center", 800);
      drawText(state.result.artifact, 655, 390, 13, COLORS.ivory, "center", 800);
      const bestLoops = state.session.bestLoops[state.levelIndex];
      drawText(`SESSION BEST · ${state.session.medals[state.levelIndex].toUpperCase()} · ${bestLoops} LOOP${bestLoops === 1 ? "" : "S"}`, 655, 421, 11, "#8f928a", "center", 700);
      drawButton(518, 466, 330, 58, state.levelIndex === LEVELS.length - 1 ? "OPEN THE MERIDIAN" : "NEXT ROOM", () => continueCampaign(), state.levelIndex === LEVELS.length - 1 ? "CAMPAIGN FINALE" : LEVELS[state.levelIndex + 1].name);
      drawButton(350, 542, 275, 48, "RETRY ROOM", () => startLevel(state.levelIndex), "CHASE A BETTER MEDAL");
      drawButton(655, 542, 275, 48, "TITLE", () => quitToTitle(), "PROGRESS STAYS THIS SESSION");
    }

    function drawFinale(now) {
      drawMenuBackdrop(now);
      ctx.save();
      ctx.fillStyle = "rgba(4,7,9,.85)";
      ctx.beginPath();
      ctx.arc(640, 315, 170, Math.PI, TAU);
      ctx.lineTo(810, 540); ctx.lineTo(470, 540); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = COLORS.brass; ctx.lineWidth = 4; ctx.stroke();
      ctx.restore();
      drawText("THE MERIDIAN OPENS", 640, 77, 36, COLORS.ivory, "center", 900, "Georgia, serif");
      drawText("FIVE ROOMS. ONE PERFECTLY IMPOSSIBLE NIGHT.", 640, 116, 13, COLORS.brass, "center", 900);
      const positions = [[440, 235], [540, 182], [640, 165], [740, 182], [840, 235]];
      state.session.medals.forEach((medal, i) => drawMedalSeal(positions[i][0], positions[i][1], 38, medal, `ROOM ${i + 1}`));
      drawArtifact(640, 347, "THE MERIDIAN CROWN");
      drawText("INFINITE VAULT UNLOCKED", 640, 420, 21, COLORS.mint, "center", 900);
      wrapText("The master vault is awake. Ninety seconds, rotating targets, escalating security, and a clean multiplier that shatters on every alarm.", 640, 450, 570, 22, 15, "#c7c1ac", "center", 600, 3);
      drawButton(420, 532, 440, 62, "ENTER INFINITE VAULT", () => startInfinite(), "90-SECOND SCORE ATTACK");
      drawButton(485, 611, 310, 48, "RETURN TO TITLE", () => quitToTitle(), "VAULT REMAINS UNLOCKED");
    }

    function drawVaultResult(now) {
      drawMenuBackdrop(now);
      drawText("THE MASTER CLOCK STOPS", 640, 77, 36, COLORS.ivory, "center", 900, "Georgia, serif");
      drawText("INFINITE VAULT LEDGER", 640, 116, 13, COLORS.brass, "center", 900);
      decoPath(300, 150, 680, 370, 18);
      ctx.fillStyle = "rgba(8,12,17,.92)"; ctx.fill();
      ctx.strokeStyle = COLORS.brass; ctx.lineWidth = 2; ctx.stroke();
      drawText("FINAL SCORE", 640, 195, 12, COLORS.brass, "center", 900);
      drawText(formatScore(state.vaultResult.score), 640, 247, 52, COLORS.ivory, "center", 900, "Georgia, serif");
      drawText(`SESSION BEST ${formatScore(state.vaultResult.best)}`, 640, 289, 14, state.vaultResult.score >= state.vaultResult.best ? COLORS.mint : "#a3a195", "center", 900);
      const columns = [430, 640, 850];
      const labels = ["EXTRACTIONS", "ALARMS", "PEAK MULTIPLIER"];
      const values = [state.vaultResult.extractions, state.vaultResult.alarms, `${state.vaultResult.peak.toFixed(2)}×`];
      for (let i = 0; i < 3; i++) {
        drawText(labels[i], columns[i], 353, 11, COLORS.brass, "center", 900);
        drawText(String(values[i]), columns[i], 395, 30, i === 1 && state.vaultResult.alarms ? COLORS.danger : COLORS.ivory, "center", 900);
      }
      drawText("1000 + 50 × LOOP SECONDS · +500 CLEAN · CLEAN MULTIPLIER TO 3×", 640, 462, 12, "#999b93", "center", 800);
      drawButton(415, 548, 450, 60, "RUN THE VAULT AGAIN", () => startInfinite(), "RESET SCORE · KEEP SESSION BEST");
      drawButton(485, 625, 310, 46, "RETURN TO TITLE", () => quitToTitle());
    }

    function render(now) {
      UI.buttons.length = 0;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      if (state.screen === "title") drawTitle(now);
      else if (state.screen === "instructions") drawInstructions(now);
      else if (state.screen === "campaign-finale") drawFinale(now);
      else if (state.screen === "vault-result") drawVaultResult(now);
      else if (state.def && state.world) {
        drawGameScene(now);
        if (state.screen === "paused") drawPause();
        else if (state.screen === "level-result") drawLevelResult();
      } else {
        drawMenuBackdrop(now);
      }
      canvas.style.cursor = UI.buttons.some(button => !button.disabled && isHovering(button)) ? "pointer" : "default";
    }

    function toggleMute() {
      Sound.init();
      Sound.setMuted(!Sound.muted);
      Sound.event("click");
    }

    function pauseGame(reason = "PAUSED") {
      if (state.screen !== "playing") return;
      state.screen = "paused";
      state.pauseReason = reason;
      clearKeys();
      accumulator = 0;
      syncDomState(true);
    }

    function resumeGame() {
      if (state.screen !== "paused") return;
      state.screen = "playing";
      state.pauseReason = "PAUSED";
      clearKeys();
      accumulator = 0;
      lastTime = performance.now();
      canvas.focus();
      if (Sound.context && Sound.context.state === "suspended") Sound.context.resume().catch(() => {});
      syncDomState(true);
    }

    const blockedKeys = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"]);

    window.addEventListener("keydown", event => {
      if (blockedKeys.has(event.code)) event.preventDefault();
      Sound.init();

      if (event.code === "KeyM" && !event.repeat) {
        toggleMute();
        return;
      }

      if (state.screen === "title") {
        if ((event.code === "Enter" || event.code === "Space") && !event.repeat) {
          const index = state.session.medals.every(Boolean) ? 0 : state.session.unlockedLevel;
          startCampaign(index);
        } else if (event.code === "KeyI" && state.session.vaultUnlocked && !event.repeat) startInfinite();
        return;
      }

      if (state.screen === "instructions") {
        if (event.code === "Escape") {
          state.screen = "title";
          state.mode = "menu";
          syncDomState(true);
        } else if ((event.code === "Enter" || event.code === "Space") && !event.repeat) startCampaign(0);
        return;
      }

      if (state.screen === "playing") {
        if ((event.code === "Escape" || event.code === "KeyP") && !event.repeat) {
          pauseGame("TIME SUSPENDED BY THE THIEF");
          return;
        }
        if (event.code === "KeyR" && !event.repeat) {
          state.pendingRewind = true;
          return;
        }
        if ((event.code === "KeyE" || event.code === "Space") && !event.repeat) {
          state.pendingInteract = true;
          return;
        }
        state.keys[event.code] = true;
        return;
      }

      if (state.screen === "paused") {
        if ((event.code === "Escape" || event.code === "KeyP" || event.code === "Enter") && !event.repeat) resumeGame();
        return;
      }

      if (state.screen === "level-result") {
        if ((event.code === "Enter" || event.code === "Space") && !event.repeat) continueCampaign();
        else if (event.code === "KeyR" && !event.repeat) startLevel(state.levelIndex);
        else if (event.code === "Escape" && !event.repeat) quitToTitle();
        return;
      }

      if (state.screen === "campaign-finale") {
        if ((event.code === "Enter" || event.code === "Space") && !event.repeat) startInfinite();
        else if (event.code === "Escape" && !event.repeat) quitToTitle();
        return;
      }

      if (state.screen === "vault-result") {
        if ((event.code === "Enter" || event.code === "Space") && !event.repeat) startInfinite();
        else if (event.code === "Escape" && !event.repeat) quitToTitle();
      }
    }, { passive: false });

    window.addEventListener("keyup", event => {
      state.keys[event.code] = false;
      if (blockedKeys.has(event.code)) event.preventDefault();
    }, { passive: false });

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * W / rect.width,
        y: (event.clientY - rect.top) * H / rect.height
      };
    }

    canvas.addEventListener("pointermove", event => {
      const point = pointerPosition(event);
      mouse.x = point.x;
      mouse.y = point.y;
    });

    canvas.addEventListener("pointerdown", event => {
      const point = pointerPosition(event);
      mouse.x = point.x;
      mouse.y = point.y;
      mouse.down = true;
      Sound.init();
      canvas.focus();
      event.preventDefault();
    });

    canvas.addEventListener("pointerup", event => {
      const point = pointerPosition(event);
      mouse.x = point.x;
      mouse.y = point.y;
      mouse.down = false;
      for (let i = UI.buttons.length - 1; i >= 0; i--) {
        const button = UI.buttons[i];
        if (!button.disabled && isHovering(button)) {
          Sound.event("click");
          button.action();
          break;
        }
      }
      event.preventDefault();
    });

    canvas.addEventListener("pointerleave", () => {
      mouse.x = -100;
      mouse.y = -100;
      mouse.down = false;
    });

    window.addEventListener("blur", () => {
      if (state.screen === "playing") pauseGame("FOCUS LOST · TIMER HELD SAFELY");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state.screen === "playing") pauseGame("WINDOW HIDDEN · TIMER HELD SAFELY");
    });

    function frame(now) {
      const delta = Math.min(.1, Math.max(0, (now - lastTime) / 1000));
      lastTime = now;
      if (state.screen === "playing") {
        accumulator += delta;
        while (accumulator >= STEP && state.screen === "playing") {
          fixedStep();
          accumulator -= STEP;
        }
      } else {
        accumulator = 0;
        Sound.menuBeat(now);
      }
      render(now);
      requestAnimationFrame(frame);
    }

    syncDomState(true);
    requestAnimationFrame(frame);

  })();
  </script>
</body>
</html>
