<style>

<main id="stage" aria-label="Clockwork Caper game">

<script>
(() => {
  'use strict';
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d'), screen=document.getElementById('screen'), readout=document.getElementById('readout');
  const W=960,H=540, TAU=Math.PI*2, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const keys=new Set(), pressed=new Set(); let dpr=1, cw=0,ch=0, scale=1, ox=0,oy=0, last=performance.now(), audio=null, muted=false, musicAt=0;
  const sessionBests={vault:0, medals:0};
  const campaign=[
    {name:'Brass Foyer', subtitle:'The first hand holds the door', par:2, spawn:[92,270], exit:[880,270], walls:[[0,0,960,28],[0,512,960,28],[0,0,28,540],[932,0,28,540],[454,28,30,174],[454,338,30,174],[210,120,128,25],[210,395,128,25]], doors:[['foyerDoor',454,202,30,136,['plateA']]], plates:[['plateA',270,270]], artifacts:[[805,270]], guards:[]},
    {name:'Watch Gallery', subtitle:'A song for the sentinel', par:2, spawn:[90,445], exit:[870,90], walls:[[0,0,960,28],[0,512,960,28],[0,0,28,540],[932,0,28,540],[385,28,27,175],[385,337,27,175],[650,132,222,28],[650,132,28,154]], doors:[['watchDoor',385,203,27,134,['plateB']]], plates:[['plateB',188,110]], artifacts:[[804,90]], noises:[[235,405]], guards:[[[716,348],[811,348],[811,440],[686,440], [686,348]]]},
    {name:'Counterweight Hall', subtitle:'Two hands, one impossible gate', par:3, spawn:[82,270], exit:[882,270], walls:[[0,0,960,28],[0,512,960,28],[0,0,28,540],[932,0,28,540],[330,28,28,172],[330,340,28,172],[610,28,28,132],[610,380,28,132],[700,190,185,28],[700,322,185,28]], doors:[['weightDoor',330,200,28,140,['plateC','plateD']],['timedDoor',610,160,28,220,['gateC']]], plates:[['plateC',164,122],['plateD',164,415]], levers:[['gateC',480,270,4.0]], artifacts:[[806,270]], guards:[[[740,92],[866,92],[866,166],[740,166]]]},
    {name:'Prism Archive', subtitle:'Read the light, turn the truth', par:4, spawn:[92,445], exit:[870,442], walls:[[0,0,960,28],[0,512,960,28],[0,0,28,540],[932,0,28,540],[286,28,26,210],[286,346,26,166],[570,28,26,144],[570,300,26,212],[695,215,170,25]], doors:[['prismDoor',286,238,26,108,['leverP']],['archiveDoor',570,172,26,128,['plateP']]], plates:[['plateP',450,102]], levers:[['leverP',170,286,5.0]], artifacts:[[822,115],[830,440]], cameras:[[715,104,0]], beams:[[735,360,0.9]], guards:[[[708,460],[866,460],[866,397],[690,397]]]},
    {name:'Meridian Vault', subtitle:'Four shadows make a key', par:5, spawn:[84,270], exit:[882,270], walls:[[0,0,960,28],[0,512,960,28],[0,0,28,540],[932,0,28,540],[250,28,28,160],[250,350,28,162],[470,28,28,160],[470,350,28,162],[690,28,28,160],[690,350,28,162],[775,205,112,25],[775,310,112,25]], doors:[['meridianA',250,188,28,162,['plate1']],['meridianB',470,188,28,162,['plate2']],['meridianC',690,188,28,162,['plate3','leverM']]], plates:[['plate1',132,112],['plate2',353,426],['plate3',577,112]], levers:[['leverM',575,426,6]], artifacts:[[815,270]], cameras:[[603,270,Math.PI]], beams:[[392,270,0]], guards:[[[804,112],[880,112],[880,180],[770,180]],[[803,424],[880,424],[880,360],[770,360]]]},
  ];
  const state={screen:'title',mode:'campaign',level:0,run:0,loop:1,echoes:[],trace:[],recordAt:0,player:null,world:null,alarm:0,unseen:0,levelAlarms:0,levelLoops:1,paused:false,vaultTime:90,score:0,mult:1,extractions:0,clean:true,flash:0,shake:0,message:'',ending:''};
  const clone=o=>JSON.parse(JSON.stringify(o));
  function makeWorld(def){
    const w=clone(def); w.artifacts=w.artifacts.map((p,i)=>({x:p[0],y:p[1],taken:false,id:i}));
    w.plates=w.plates.map(p=>({id:p[0],x:p[1],y:p[2],active:false}));
    w.levers=(w.levers||[]).map(l=>({id:l[0],x:l[1],y:l[2],duration:l[3],until:0}));
    w.noises=(w.noises||[]).map(n=>({x:n[0],y:n[1],until:0}));
    w.doors=w.doors.map(d=>({id:d[0],x:d[1],y:d[2],w:d[3],h:d[4],req:d[5],open:false}));
    w.cameras=(w.cameras||[]).map(c=>({x:c[0],y:c[1],a:c[2]})); w.beams=(w.beams||[]).map(b=>({x:b[0],y:b[1],a:b[2]}));
    w.guards=(w.guards||[]).map((path,i)=>({path, x:path[0][0],y:path[0][1],i:1,lure:null,phase:i*.7})); return w;
  }
  function makeVault(){
    const w=makeWorld({name:'Infinite Vault',subtitle:'The vault learns your rhythm',spawn:[88,270],exit:[884,270],walls:[[0,0,960,28],[0,512,960,28],[0,0,28,540],[932,0,28,540],[350,28,28,155],[350,357,28,155],[605,28,28,155],[605,357,28,155],[760,190,126,24],[760,326,126,24]],doors:[['vA',350,183,28,174,['plateV']],['vB',605,183,28,174,['leverV']]],plates:[['plateV',183,110]],levers:[['leverV',482,426,3.8]],artifacts:[[806,270]],noises:[[184,426]],guards:[[[720,94],[875,94],[875,166],[718,166]],[[724,447],[875,447],[875,372],[718,372]]],cameras:[[500,96,1.4]],beams:[[500,270,0]]}); w.vaultSpots=[[806,270],[800,105],[800,435],[505,270],[280,270],[505,106],[505,434]]; w.artifacts[0].x=806; w.artifacts[0].y=270; return w; }
  function setScreen(kind, html){ state.screen=kind; screen.innerHTML=html||''; updateReadout(); }
  function updateReadout(){ const al=Math.max(0,state.alarm).toFixed(1); readout.dataset.screen=state.screen; readout.dataset.mode=state.mode; readout.dataset.level=String(state.level+1); readout.dataset.echo=String(state.echoes.length); readout.dataset.alarm=al; readout.textContent=`SCREEN:${state.screen} · MODE:${state.mode} · LEVEL:${state.mode==='vault'?'∞':state.level+1} · ECHO:${state.echoes.length} · ALARM:${al}`; }
  function menu(){ setScreen('title',`<div class="panel"><p class="eyebrow">A terra-made time heist</p><h1>CLOCKWORK<br>CAPER</h1><div class="rule"></div><p class="copy">Steal through twelve-second time loops. Leave a perfect echo behind, then use its remembered body to hold the impossible open.</p><div class="controls"><span><b>WASD / ARROWS</b>move</span><span><b>E / SPACE</b>interact</span><span><b>R</b>rewind loop</span><span><b>ESC / P</b>pause</span><span><b>M</b>mute</span><span><b>FOCUS</b>auto-pause</span></div><div class="buttons"><button data-start="campaign">Begin campaign</button><button class="secondary" data-start="vault">Infinite Vault</button></div><p class="fine">Live thieves collect artifacts and exit. Echoes can only replay, press, pull, distract, and mislead.</p></div>`); bindButtons(); }
  function bindButtons(){ screen.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.start))); screen.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.next==='restart')start(state.mode);else if(b.dataset.next==='menu')menu();else {state.level++; start('campaign');}})); }
  function start(mode){ ensureAudio(); state.mode=mode; state.level=mode==='campaign'?Math.min(state.level,campaign.length-1):0; state.score=0; state.mult=1; state.extractions=0; state.vaultTime=90; state.clean=true; state.ending=''; setupRun(); setScreen('playing',''); tone('start'); }
  function setupRun(){ const def=state.mode==='vault'?null:campaign[state.level]; state.world=state.mode==='vault'?makeVault():makeWorld(def); state.run=0; state.loop=1; state.levelLoops=1; state.levelAlarms=0; state.echoes=[]; state.trace=[]; state.recordAt=0; state.alarm=0; state.unseen=0; state.player={x:state.world.spawn[0],y:state.world.spawn[1],a:0}; state.flash=0; }
  function newLoop(commit, reason){
    if(commit && state.trace.length>1){ state.echoes.push({trace:state.trace.map(q=>({...q})),actionIndex:0,x:state.world.spawn[0],y:state.world.spawn[1],a:0}); if(state.echoes.length>4)state.echoes.shift(); tone('rewind'); }
    else if(reason==='alarm') tone('fail');
    state.run=0; state.loop++; state.levelLoops++; state.trace=[]; state.recordAt=0; state.alarm=0; state.unseen=0;
    const prior=state.echoes; const def=state.mode==='vault'?null:campaign[state.level]; const fresh=state.mode==='vault'?makeVault():makeWorld(def);
    if(state.mode==='vault'){ fresh.vaultSpots=state.world.vaultSpots; const old=state.world.artifacts[0]; fresh.artifacts[0].x=old.x; fresh.artifacts[0].y=old.y; applyVaultSecurity(fresh); }
    state.world=fresh; state.echoes=prior; state.player={x:fresh.spawn[0],y:fresh.spawn[1],a:0}; state.flash=.35; state.message=reason==='alarm'?'TRACE BURNED':'ECHO COMMITTED';
  }
  function togglePause(){ if(state.screen!=='playing'&&state.screen!=='paused')return; if(state.screen==='paused'){state.paused=false;setScreen('playing','');tone('start');}else{state.paused=true;setScreen('paused',`<div class="panel"><p class="eyebrow">Clock stopped</p><h2>PAUSED</h2><p class="copy">The vault is waiting outside the second hand.</p><div class="buttons"><button data-start="${state.mode}">Resume</button><button class="secondary" data-next="restart">Restart</button><button class="secondary" data-next="menu">Menu</button></div></div>`);screen.querySelector('[data-start]').addEventListener('click',()=>{state.paused=false;setScreen('playing','');});screen.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>b.dataset.next==='menu'?menu():start(state.mode)));} }
  function record(){ if(state.run-state.recordAt<.07)return; state.recordAt=state.run; state.trace.push({t:state.run,x:state.player.x,y:state.player.y,a:state.player.a,type:'move'}); }
  function positionAt(trace,t){ if(!trace.length)return null; let a=trace[0],b=trace[trace.length-1]; for(let i=1;i<trace.length;i++){if(trace[i].t>=t){b=trace[i];a=trace[i-1];break;}} const f=b.t===a.t?1:Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t))); return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,a:a.a+(b.a-a.a)*f}; }
  function updateEchoes(){ for(const e of state.echoes){const p=positionAt(e.trace,state.run);if(p)Object.assign(e,p); while(e.actionIndex<e.trace.length&&e.trace[e.actionIndex].t<=state.run){const q=e.trace[e.actionIndex++];if(q.type==='act')interactAt(e,q.x,q.y,true);}} }
  function rectHit(x,y,r,box){ const [bx,by,bw,bh]=box; return x+r>bx&&x-r<bx+bw&&y+r>by&&y-r<by+bh; }
  function blocked(x,y,r=11){ const w=state.world; if(x-r<28||x+r>932||y-r<28||y+r>512)return true; for(const b of w.walls)if(rectHit(x,y,r,b))return true; for(const d of w.doors)if(!d.open&&rectHit(x,y,r,[d.x,d.y,d.w,d.h]))return true; return false; }
  function movePlayer(dt){ let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0); if(!dx&&!dy)return; const l=Math.hypot(dx,dy); dx=dx/l*154*dt;dy=dy/l*154*dt; state.player.a=Math.atan2(dy,dx); if(!blocked(state.player.x+dx,state.player.y))state.player.x+=dx; if(!blocked(state.player.x,state.player.y+dy))state.player.y+=dy; if(Math.random()<.07)tone('step',.035); }
  function triggerActive(id){ const w=state.world, p=w.plates.find(x=>x.id===id); if(p)return p.active; const l=w.levers.find(x=>x.id===id); if(l)return l.until>state.run; return false; }
  function updateTriggers(){ const w=state.world, bodies=[state.player,...state.echoes]; for(const p of w.plates)p.active=bodies.some(b=>Math.hypot(b.x-p.x,b.y-p.y)<20); for(const d of w.doors){const open=d.req.every(triggerActive);if(open!==d.open){d.open=open;tone(open?'door':'shut');} } }
  function interactAt(body,x,y,echo){ const w=state.world; let did=false; for(const l of w.levers)if(Math.hypot(x-l.x,y-l.y)<34){l.until=Math.max(l.until,state.run)+l.duration;did=true;tone('lever');} for(const n of w.noises)if(Math.hypot(x-n.x,y-n.y)<38){n.until=state.run+2.8; for(const g of w.guards)g.lure={x:n.x,y:n.y,until:state.run+3};did=true;tone('noise');} if(did&&!echo){state.trace.push({t:state.run,x,y,a:body.a,type:'act'});state.message='MECHANISM ENGAGED';} return did; }
  function interact(){interactAt(state.player,state.player.x,state.player.y,false);}
  function lineClear(x1,y1,x2,y2){ for(let i=1;i<11;i++){const t=i/11,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t; for(const b of state.world.walls)if(x>b[0]&&x<b[0]+b[2]&&y>b[1]&&y<b[1]+b[3])return false; for(const d of state.world.doors)if(!d.open&&x>d.x&&x<d.x+d.w&&y>d.y&&y<d.y+d.h)return false;} return true; }
  function canSee(source, target, a, range=180, cone=.75){const dx=target.x-source.x,dy=target.y-source.y,dist=Math.hypot(dx,dy);if(dist>range)return false;const da=Math.atan2(Math.sin(Math.atan2(dy,dx)-a),Math.cos(Math.atan2(dy,dx)-a));return Math.abs(da)<cone&&lineClear(source.x,source.y,target.x,target.y);}
  function onBeam(b,target){const a=b.a+state.run*.82,dx=target.x-b.x,dy=target.y-b.y;const along=dx*Math.cos(a)+dy*Math.sin(a),off=Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));return along>24&&along<260&&off<10&&lineClear(b.x,b.y,target.x,target.y);}
  function updateGuards(dt){ for(const g of state.world.guards){let target; if(g.lure&&g.lure.until>state.run)target=g.lure;else{g.lure=null;target={x:g.path[g.i][0],y:g.path[g.i][1]};}const dx=target.x-g.x,dy=target.y-g.y,d=Math.hypot(dx,dy);if(d<5){if(!g.lure)g.i=(g.i+1)%g.path.length;}else{g.x+=dx/d*42*dt;g.y+=dy/d*42*dt;}} }
  function security(dt){ const w=state.world; let seen=false; const all=[state.player,...state.echoes]; for(const g of w.guards){for(const b of all){if(canSee(g,b,Math.atan2((g.path[g.i][1]-g.y),(g.path[g.i][0]-g.x)),180,.68)){if(b===state.player)seen=true;else g.lure={x:b.x,y:b.y,until:state.run+1.5};}}} for(const c of w.cameras){const a=c.a+state.run*.46;for(const b of all){if(canSee(c,b,a,220,.43)){if(b===state.player)seen=true;}}} for(const beam of w.beams){for(const b of all){if(onBeam(beam,b)&&b===state.player)seen=true;}}
    if(seen){if(state.alarm<=0){state.alarm=3;state.clean=false;tone('alarm');state.message='LIVE TRACE EXPOSED';}state.unseen=0;} else if(state.alarm>0){state.unseen+=dt;if(state.unseen>=.75){state.alarm=0;state.message='LINE OF SIGHT BROKEN';tone('safe');}}
    if(state.alarm>0){state.alarm-=dt;state.shake=.14;if(state.alarm<=0&&state.unseen<.75){state.levelAlarms++; if(state.mode==='vault')state.mult=1; newLoop(false,'alarm');}}
  }
  function collect(){const w=state.world;for(const a of w.artifacts){if(!a.taken&&Math.hypot(state.player.x-a.x,state.player.y-a.y)<21){a.taken=true;tone('collect');state.flash=.35; if(state.mode==='vault'){state.extractions++;const clean=state.clean?500:0, pts=Math.round((1000+50*Math.max(0,12-state.run)+clean)*state.mult);state.score+=pts;state.mult=Math.min(3,state.mult+.25);state.vaultTime=Math.min(90,state.vaultTime+6);state.clean=true;const spot=w.vaultSpots[state.extractions%w.vaultSpots.length];a.x=spot[0];a.y=spot[1];a.taken=false;securityEscalate();state.message=`EXTRACTION +${pts}`;} else state.message='ARTIFACT SECURED';}}}
  function addVaultStage(w,stage){w.guards.push({path:[[750,270],[875,270],[875,120],[750,120]],x:750,y:270,i:1,lure:null,phase:stage});if(stage>1)w.cameras.push({x:700,y:270,a:0});}
  function applyVaultSecurity(w=state.world){for(let stage=1;stage<=Math.floor(state.extractions/2);stage++)addVaultStage(w,stage);}
  function securityEscalate(){if(state.extractions%2)return; addVaultStage(state.world,state.extractions/2);tone('escalate');}
  function allTaken(){return state.world.artifacts.every(a=>a.taken);}
  function finishLevel(){const def=campaign[state.level], gold=state.levelAlarms===0&&state.levelLoops<=def.par, silver=state.levelAlarms<=1&&state.levelLoops<=def.par+1, rank=gold?'gold':silver?'silver':'bronze'; sessionBests.medals+=rank==='gold'?3:rank==='silver'?2:1; state.ending=rank; tone('win'); setScreen('result',`<div class="panel"><p class="eyebrow">Room cleared</p><h2>${def.name}</h2><p class="statline">${state.levelLoops} loop${state.levelLoops===1?'':'s'} · ${state.levelAlarms} alarm${state.levelAlarms===1?'':'s'}</p><div class="medals"><span class="medal on">● BRONZE<br><small>complete</small></span><span class="medal ${silver?'on':''}">● SILVER<br><small>par + 1</small></span><span class="medal ${gold?'on':''}">● GOLD<br><small>clean par</small></span></div><p class="copy">${rank==='gold'?'A flawless mechanism. The vault remembers your silence.':rank==='silver'?'A clean enough theft. The next gear is already turning.':'The prize is yours. Precision can come on the next pass.'}</p><div class="buttons"><button data-next="${state.level===campaign.length-1?'final':'next'}">${state.level===campaign.length-1?'Open Meridian':'Next room'}</button><button class="secondary" data-next="restart">Retry room</button></div></div>`); screen.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.next==='restart'){start('campaign');}else if(b.dataset.next==='final')finale();else{state.level++;start('campaign');}}));}
  function finale(){tone('finale');setScreen('finale',`<div class="panel"><p class="eyebrow">The thirteenth tick</p><h1>THE VAULT<br>IS YOURS</h1><div class="rule"></div><p class="copy">Five rooms have learned your shape. Every echo takes a bow, then keeps the lights low while you disappear into morning.</p><p class="statline">Session distinction: ${sessionBests.medals} gear marks</p><div class="buttons"><button data-start="vault">Enter Infinite Vault</button><button class="secondary" data-next="menu">Main menu</button></div></div>`); screen.querySelector('[data-start]').addEventListener('click',()=>start('vault'));screen.querySelector('[data-next]').addEventListener('click',menu);}
  function vaultOver(){sessionBests.vault=Math.max(sessionBests.vault,state.score);tone('fail');setScreen('vaultover',`<div class="panel"><p class="eyebrow">Infinite Vault secured</p><h2>TIME EXPIRED</h2><p class="statline">${state.extractions} extractions · ${Math.round(state.score).toLocaleString()} score</p><p class="copy">Best this session: ${Math.round(sessionBests.vault).toLocaleString()}. The vault has tightened its springs, but your echoes will be ready.</p><div class="buttons"><button data-next="restart">Run again</button><button class="secondary" data-next="menu">Main menu</button></div></div>`);screen.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>b.dataset.next==='menu'?menu():start('vault')));}
  function update(dt){if(state.screen!=='playing')return; state.run+=dt; if(state.mode==='vault'){state.vaultTime-=dt;if(state.vaultTime<=0){vaultOver();return;}} movePlayer(dt);record();updateEchoes();updateTriggers();updateGuards(dt);security(dt);collect(); if(state.screen!=='playing')return; if(state.mode==='campaign'&&allTaken()&&Math.hypot(state.player.x-state.world.exit[0],state.player.y-state.world.exit[1])<27){finishLevel();return;} if(state.run>=12)newLoop(true,'natural'); state.flash=Math.max(0,state.flash-dt);state.shake=Math.max(0,state.shake-dt);updateReadout();}
  function decoPath(x,y,r,fill){ctx.beginPath();for(let i=0;i<8;i++){const a=i*TAU/8-Math.PI/2,rr=i%2?r*.58:r;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();if(fill)ctx.fill();else ctx.stroke();}
  function drawWorld(){const w=state.world;if(!w)return; ctx.fillStyle='#0a1518';ctx.fillRect(0,0,W,H);for(let y=30;y<H;y+=40)for(let x=30;x<W;x+=40){ctx.strokeStyle='rgba(131,164,152,.08)';ctx.lineWidth=1;ctx.strokeRect(x+3,y+3,34,34);ctx.fillStyle='rgba(213,166,72,.07)';ctx.fillRect(x+19,y+19,2,2);}ctx.strokeStyle='rgba(213,166,72,.35)';ctx.lineWidth=3;ctx.strokeRect(18,18,924,504);
    for(const b of w.walls){ctx.fillStyle='#17272b';ctx.fillRect(...b);ctx.strokeStyle='#ba873b';ctx.lineWidth=2;ctx.strokeRect(b[0]+1,b[1]+1,b[2]-2,b[3]-2);ctx.strokeStyle='rgba(7,9,10,.8)';ctx.beginPath();ctx.moveTo(b[0]+4,b[1]+4);ctx.lineTo(b[0]+b[2]-4,b[1]+b[3]-4);ctx.moveTo(b[0]+b[2]-4,b[1]+4);ctx.lineTo(b[0]+4,b[1]+b[3]-4);ctx.stroke();}
    for(const d of w.doors){if(d.open){ctx.fillStyle='rgba(88,209,190,.13)';ctx.fillRect(d.x,d.y,d.w,d.h);ctx.strokeStyle='#63c9bd';ctx.setLineDash([4,4]);ctx.strokeRect(d.x,d.y,d.w,d.h);ctx.setLineDash([]);}else{ctx.fillStyle='#9a6a29';ctx.fillRect(d.x,d.y,d.w,d.h);ctx.strokeStyle='#f0cf6d';ctx.lineWidth=2;ctx.strokeRect(d.x+2,d.y+2,d.w-4,d.h-4);for(let q=6;q<(d.w>d.h?d.w:d.h);q+=8){ctx.fillStyle='#321e12';if(d.w<d.h)ctx.fillRect(d.x+3,d.y+q,d.w-6,3);else ctx.fillRect(d.x+q,d.y+3,3,d.h-6);}}}
    for(const p of w.plates){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=p.active?'#9ce4d7':'#263c3b';decoPath(0,0,17,true);ctx.strokeStyle=p.active?'#f5d77b':'#bd8b3f';ctx.lineWidth=2;decoPath(0,0,17,false);ctx.restore();}
    for(const l of w.levers){const on=l.until>state.run;ctx.save();ctx.translate(l.x,l.y);ctx.strokeStyle='#e7bb55';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(on?12:-10,-12);ctx.stroke();ctx.fillStyle=on?'#8dd9cd':'#b14a45';ctx.beginPath();ctx.arc(on?12:-10,-12,5,0,TAU);ctx.fill();ctx.restore();}
    for(const n of w.noises){const on=n.until>state.run;ctx.strokeStyle=on?'#ffcf6c':'#6c8e88';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(n.x,n.y,9+i*6+(on?Math.sin(state.run*12)*2:0),-.8,.8);ctx.stroke();}ctx.fillStyle='#d6a346';ctx.fillRect(n.x-3,n.y-8,6,16);}
    for(const a of w.artifacts)if(!a.taken){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(state.run*.8);ctx.fillStyle='#83e5d3';ctx.shadowColor='#7be4d2';ctx.shadowBlur=14;decoPath(0,0,13,true);ctx.fillStyle='#f8df85';decoPath(0,0,6,true);ctx.restore();}
    const eye=(x,y,a,len,wide,color)=>{ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,len,-wide,wide);ctx.closePath();ctx.globalAlpha=.12;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.stroke();ctx.restore();};
    for(const c of w.cameras){const a=c.a+state.run*.46;eye(c.x,c.y,a,220,.43,'#c95750');ctx.fillStyle='#d9aa4c';ctx.fillRect(c.x-7,c.y-7,14,14);ctx.fillStyle='#d95350';ctx.beginPath();ctx.arc(c.x,c.y,3,0,TAU);ctx.fill();}
    for(const b of w.beams){const a=b.a+state.run*.82;ctx.strokeStyle='rgba(231,105,91,.72)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*260,b.y+Math.sin(a)*260);ctx.stroke();ctx.fillStyle='#f7d173';ctx.beginPath();ctx.arc(b.x,b.y,8,0,TAU);ctx.fill();}
    for(const g of w.guards){const a=Math.atan2(g.path[g.i][1]-g.y,g.path[g.i][0]-g.x);eye(g.x,g.y,a,180,.68,'#d15d54');ctx.save();ctx.translate(g.x,g.y);ctx.fillStyle='#223e48';ctx.beginPath();ctx.arc(0,0,12,0,TAU);ctx.fill();ctx.fillStyle='#d9c274';ctx.fillRect(-4,-10,8,5);ctx.fillStyle='#c4524d';ctx.fillRect(-12,3,24,5);ctx.restore();}
    for(const e of state.echoes){ctx.save();ctx.globalAlpha=.43;ctx.translate(e.x,e.y);ctx.fillStyle='#73d8d1';ctx.shadowColor='#74e7de';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();ctx.strokeStyle='#eff8dc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(e.a)*9,Math.sin(e.a)*9);ctx.stroke();ctx.restore();}
    ctx.save();ctx.translate(state.player.x,state.player.y);ctx.fillStyle='#f5d878';ctx.shadowColor='#f1ca69';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#173b40';ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.fill();ctx.strokeStyle='#fff3c8';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(state.player.a)*10,Math.sin(state.player.a)*10);ctx.stroke();ctx.restore();
    const exit=allTaken()&&state.mode==='campaign';ctx.strokeStyle=exit?'#a7eddd':'#55716d';ctx.lineWidth=3;ctx.strokeRect(w.exit[0]-14,w.exit[1]-19,28,38);ctx.fillStyle=exit?'rgba(131,234,211,.22)':'rgba(60,90,86,.14)';ctx.fillRect(w.exit[0]-14,w.exit[1]-19,28,38);
  }
  function drawHUD(){const def=state.mode==='vault'?{name:'INFINITE VAULT',subtitle:'rotating acquisition protocol'}:campaign[state.level];ctx.fillStyle='rgba(3,9,10,.78)';ctx.fillRect(42,42,370,56);ctx.strokeStyle='rgba(213,166,72,.7)';ctx.strokeRect(42,42,370,56);ctx.fillStyle='#f0d78c';ctx.font='20px Georgia';ctx.fillText(def.name.toUpperCase(),58,66);ctx.fillStyle='#93bcb3';ctx.font='11px ui-monospace,monospace';ctx.fillText(def.subtitle.toUpperCase(),59,84);ctx.fillStyle='rgba(3,9,10,.78)';ctx.fillRect(690,42,228,56);ctx.strokeStyle='rgba(213,166,72,.7)';ctx.strokeRect(690,42,228,56);ctx.fillStyle='#e8d19a';ctx.font='12px ui-monospace,monospace';if(state.mode==='vault'){ctx.fillText(`VAULT ${Math.max(0,state.vaultTime).toFixed(1)}s`,706,65);ctx.fillText(`SCORE ${Math.round(state.score)} ×${state.mult.toFixed(2)}`,706,84);}else{ctx.fillText(`LOOP ${state.levelLoops}  /  PAR ${def.par}`,706,65);ctx.fillText(`ECHOES ${state.echoes.length}/4   ALARMS ${state.levelAlarms}`,706,84);}ctx.fillStyle='rgba(3,9,10,.78)';ctx.fillRect(368,472,224,36);ctx.strokeStyle=state.alarm>0?'#d95850':'#5e9e97';ctx.strokeRect(368,472,224,36);ctx.fillStyle=state.alarm>0?'#ffaaa0':'#b6d8ce';ctx.font='12px ui-monospace,monospace';ctx.fillText(state.alarm>0?`ALARM ${Math.max(0,state.alarm).toFixed(1)} — BREAK SIGHT`:`LOOP ${Math.max(0,12-state.run).toFixed(1)}s   [R] REWIND`,381,495);if(state.message){ctx.globalAlpha=Math.min(1,state.flash*4+.25);ctx.fillStyle='#f3d778';ctx.font='bold 14px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(state.message,480,125);ctx.textAlign='left';ctx.globalAlpha=1;}}
  function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#030608';ctx.fillRect(0,0,canvas.width,canvas.height);scale=Math.min(cw/W,ch/H);ox=(cw-W*scale)/2;oy=(ch-H*scale)/2;const shake=state.shake&&!reduced?(Math.random()-.5)*8:0;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*(ox+shake),dpr*oy);if(state.screen==='title'||state.screen==='finale'){drawTitleBackdrop();}else{drawWorld();if(state.screen==='playing'||state.screen==='paused')drawHUD();} }
  function drawTitleBackdrop(){ctx.fillStyle='#071419';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(213,166,72,.17)';ctx.lineWidth=3;for(let r=60;r<430;r+=54){ctx.beginPath();ctx.arc(480,270,r,0,TAU);ctx.stroke();}ctx.save();ctx.translate(480,270);ctx.strokeStyle='#b1843c';ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,0,128,0,TAU);ctx.stroke();ctx.fillStyle='#d5a648';for(let i=0;i<12;i++){ctx.rotate(TAU/12);ctx.fillRect(116,-5,25,10);}ctx.restore();}
  function resize(){dpr=Math.min(2,devicePixelRatio||1);cw=innerWidth;ch=innerHeight;canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);}
  function tone(kind, volume=.08){if(muted||!audio)return;const now=audio.currentTime;const specs={start:[220,.1,'sine'],step:[120,.025,'triangle'],rewind:[300,.22,'sine'],door:[170,.12,'square'],shut:[90,.08,'square'],lever:[470,.12,'triangle'],noise:[640,.2,'sawtooth'],collect:[740,.24,'sine'],alarm:[135,.28,'sawtooth'],safe:[360,.12,'sine'],fail:[72,.35,'sawtooth'],win:[520,.24,'sine'],escalate:[180,.22,'square'],finale:[330,.35,'sine']};const s=specs[kind]||[220,.08,'sine'];const o=audio.createOscillator(),g=audio.createGain();o.type=s[2];o.frequency.setValueAtTime(s[0],now);if(kind==='rewind'||kind==='fail')o.frequency.exponentialRampToValueAtTime(Math.max(45,s[0]*.35),now+s[1]);if(kind==='collect'||kind==='win')o.frequency.exponentialRampToValueAtTime(s[0]*1.6,now+s[1]);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+s[1]);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+s[1]+.03);}
  function ensureAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();}if(audio.state==='suspended')audio.resume();}
  function music(now){if(!audio||muted||state.screen!=='playing'||now<musicAt)return;musicAt=now+.47;const base=state.alarm>0?82:state.mode==='vault'?110:98;const notes=[0,7,3,10,5,12,7,3];const n=notes[Math.floor(now/.47)%notes.length];toneMusic(base*Math.pow(2,n/12));}
  function toneMusic(freq){const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.025,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.38);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.4);}
  function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);render();music(now/1000);pressed.clear();requestAnimationFrame(frame);}
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','escape'].includes(k))e.preventDefault();if(!keys.has(k))pressed.add(k);keys.add(k);if(k==='m'&&pressed.has(k)){muted=!muted;tone('lever');}if((k==='p'||k==='escape')&&pressed.has(k))togglePause();if(state.screen==='playing'&&pressed.has(k)){if(k==='r')newLoop(true,'manual');if(k==='e'||k===' ')interact();}if(state.screen==='title'&&(k==='enter'||k===' '))start('campaign');});
  addEventListener('keyup',e=>keys.delete(e.key.toLowerCase())); addEventListener('blur',()=>{keys.clear();if(state.screen==='playing')togglePause();}); document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.screen==='playing')togglePause();});
  canvas.addEventListener('click',()=>{if(state.screen==='title')start('campaign');}); resize();addEventListener('resize',resize);menu();requestAnimationFrame(frame);
})();
</script>
