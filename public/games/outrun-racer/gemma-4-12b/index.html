<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON HORIZON RACER</title>
    <style>
        :root {
            --neon-cyan: #0ff;
            --neon-magenta: #f0f;
            --bg-dark: #05050a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border: 4px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            background: radial-gradient(circle at bottom, #1a1a3a 0%, #05050a 70%);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 10, 0.8);
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            letter-spacing: 10px;
            animation: pulse 2s infinite alternate;
        }

        .btn {
            padding: 15px 40px;
            border: 3px solid var(--neon-magenta);
            color: var(--neon-magenta);
            font-size: 1.5rem;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px var(--neon-magenta);
            pointer-events: auto;
        }

        .btn:hover {
            background: var(--neon-magenta);
            color: white;
            box-shadow: 0 0 30px var(--neon-magenta);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.05); opacity: 0.8; }
        }
    </style>
</head>
<body class="black">

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="hud" class="hidden">
            <div id="scoreDisplay">SCORE: 0</div>
            <div id="speedDisplay">SPD: 0 KM/H</div>
        </div>

        <div id="startScreen" class="overlay">
            <h1>NEON HORIZON</h1>
            <p style="margin-bottom: 30px;">USE ARROWS OR TAP LEFT/RIGHT</p>
            <button id="startButton" class="btn">START ENGINE</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: var(--neon-magenta); text-shadow: 0 0 15px var(--neon-magenta);">CRASHED</h1>
            <p id="finalScore" style="margin-bottom: 20px;"></p>
            <button id="restartButton" class="btn">REBOOT</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 450;

const game = {
    state: 'START',
    score: 0,
    speed: 0,
    maxSpeed: 120,
    playerX: 0, // -1 to 1 range
    distance: 0,
    obstacles: [],
    roadSegments: [],

    init() {
        // Generate road tiles for rendering
        for(let i = 0; i < 250; i++) {
            this.roadSegments.push({
                z: i * 10,
                color: (Math.floor(i / 4) % 2 === 0) ? '#0ff' : '#f0f'
            });
        }
    },

    spawnObstacles() {
        this.obstacles = [];
        for(let i = 0; i < 60; i++) {
            this.obstacles.push({
                z: 1500 + (i * 350), // Spaced out in world units
                x: Math.random() * 2 - 1,
            });
        }
    },

    start() {
        this.state = 'PLAYING';
        this.score = 0;
        this.speed = 0;
        this.distance = 0;
        this.playerX = 0;
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.init();
        this.spawnObstacles();
    },

    restart() {
        location.reload();
    },

    triggerCrash() {
        this.state = 'GAMEOVER';
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = `FINAL SCORE: ${Math.floor(this.score)}`;
    },

    update(dt) {
        if (this.state !== 'PLAYING') return;

        // Physics update based on delta time
        // Acceleration feels natural and independent of framerate
        this.speed = Math.min(this.maxSpeed, this.speed + 18 * dt);
        this.distance += this.speed * dt;
        this.score += (this.speed / 20) * dt;

        // Handle Obstacle Logic in World Space
        this.obstacles.forEach(obs => {
            let dz = obs.z - this.distance;
            
            // If obstacle falls behind the camera, recycle it into the distance ahead
            if (dz < 0) {
                obs.z = this.distance + 2500 + Math.random() * 1000;
                obs.x = Math.random() * 2 - 1;
            }

            // Collision Detection: only if very close and on the same lane
            if (dz > 0 && dz < 60) {
                const lateralDist = Math.abs(this.playerX - obs.x);
                if (lateralDist < 0.35) {
                    this.triggerCrash();
                }
            }
        });

        // Update UI
        document.getElementById('scoreDisplay').innerText = `SCORE: ${Math.floor(this.score)}`;
        document.getElementById('speedDisplay').innerText = `SPD: ${Math.floor(this.speed)} KM/H`;
    },

    draw() {
        if (this.state !== 'PLAYING') return;

        // Clear & Draw Background
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const horizonY = canvas.height * 0.6;

        // Render Road Segments (3D Perspective)
        for (let i = 0; i < 80; i++) {
            let z = ((this.distance % 3000) + (i * 15));
            let scale = 120 / (z || 1);
            const color = this.roadSegments[Math.floor(i/2)].color;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 400 * scale, horizonY + (1-scale)*100);
            ctx.lineTo(canvas.width/2 + 400 * scale, horizonY + (1-scale)*100);
            ctx.fill();
        }

        // Render Obstacles based on world distance (dz)
        this.obstacles.forEach(obs => {
            let dz = obs.z - this.distance;
            if (dz > 0 && dz < 1500) {
                let scale = 200 / (dz + 100); // Smooth scaling for distance
                let xPos = (canvas.width/2) + (obs.x - this.playerX * 0.1) * 20; // Adjust position based on lane shift

                ctx.fillStyle = '#f0f';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#f0f';
                // Render as a glowing block in the appropriate perspective plane
                ctx.fillRect(xPos - (20 * scale), horizonY + (1-scale)*100 - (30 * scale), 40*scale, 20*scale);
            }
        });

        // Draw Player Vehicle
        const px = (canvas.width / 2) + (this.playerX * 150);
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#0ff';
        ctx.fillStyle = '#0ff';
        ctx.fillRect(px - 30, canvas.height - 80, 60, 25);

        // Retro Scanline Effect (Overlays everything)
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        for (let i = 0; i < canvas.height; i += 4) {
            ctx.fillRect(0, i, canvas.width, 1);
        }
    }
};

// Input Logic: Handle both Keyboard and Mouse/Touch
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') game.playerX -= 0.15;
    if (e.key === 'ArrowRight') game.playerX += 0.15;
    game.playerX = Math.max(-1, Math.min(1, game.playerX));
});

// Touch/Mouse Area Input: Divide screen into left/right halves
const handleInput = (e) => {
    let x = e.clientX || e.touches[0].clientX;
    const rect = canvas.getBoundingClientRect();
    const clickX = x - rect.left;
    
    if (clickX < rect.width / 2) {
        game.playerX -= 0.15; // Move Left
    } else {
        game.playerX += 0.15; // Move Right
    }
    game.playerX = Math.max(-1, Math.min(1, game.playerX));
};

window.addEventListener('touchstart', (e) => {
    // Check if touch is on a button first to prevent clicking through UI
    if (e.target.tagName !== 'BUTTON') {
        handleInput(e);
    }
}, { passive: false });

// Game Loop with Delta Time
let lastTime = performance.now();
function mainLoop() {
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.033); // Cap dt to ~30fps if tab lags
    lastTime = now;

    game.update(dt);
    game.draw();
    requestAnimationFrame(mainLoop);
}

// Button Wiring
document.getElementById('startButton').addEventListener('click', () => game.start());
document.getElementById('restartButton').addEventListener('click', () => game.restart());

// Start the loop
requestAnimationFrame(mainLoop);
</script>
</body>
</html>
