<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Template — BrainRot Games</title>
  <style>
    /*
     * Neutral structural defaults only.
     * Replace these tokens and the typography with an art direction specific to the game.
     */
    :root {
      color-scheme: light dark;
      --game-bg: Canvas;
      --game-fg: CanvasText;
      --game-muted: GrayText;
      --game-accent: LinkText;
      --game-control-bg: ButtonFace;
      --game-control-fg: ButtonText;
      --game-border: ButtonBorder;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--game-bg);
      color: var(--game-fg);
      font-family: system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      image-rendering: auto;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: inherit;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }

    .score {
      color: var(--game-accent);
    }

    .game-state {
      color: var(--game-muted);
    }

    #start-screen,
    #game-over-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--game-bg);
      z-index: 20;
    }

    #start-screen h1,
    #game-over-screen h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: normal;
      margin-bottom: 1rem;
    }

    #start-screen p,
    #game-over-screen p {
      color: var(--game-muted);
      margin-bottom: 2rem;
    }

    .btn {
      background: var(--game-control-bg);
      border: 1px solid var(--game-border);
      color: var(--game-control-fg);
      padding: 12px 32px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: outline-color 0.15s;
    }

    .btn:hover,
    .btn:focus-visible {
      outline: 2px solid var(--game-accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- UI Overlay -->
  <div id="ui-overlay">
    <span class="score">SCORE: <span id="score">0</span></span>
    <span class="game-state" id="game-state">READY</span>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <h1>GAME NAME</h1>
    <p>Press SPACE or click to start</p>
    <button class="btn" onclick="startGame()">START</button>
  </div>

  <!-- Game Over Screen (hidden by default) -->
  <div id="game-over-screen" style="display:none;">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <button class="btn" onclick="startGame()">PLAY AGAIN</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="game"></canvas>

  <script>
    // ═══ SETUP ═══
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const renderTheme = {
      background: '',
      foreground: '',
      font: '',
    };
    let animationId = null;
    let score = 0;
    let gameRunning = false;

    function refreshRenderTheme() {
      const bodyStyle = getComputedStyle(document.body);
      renderTheme.background = bodyStyle.backgroundColor;
      renderTheme.foreground = bodyStyle.color;
      renderTheme.font = bodyStyle.font;
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      refreshRenderTheme();
    }
    window.addEventListener('resize', resizeCanvas);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshRenderTheme);
    resizeCanvas();

    // ═══ GAME STATE ═══
    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      score = 0;
      gameRunning = true;
      updateScore(0);
      document.getElementById('game-state').textContent = 'PLAYING';
      // Initialize your game state here
      gameLoop();
    }

    function gameOver() {
      gameRunning = false;
      if (animationId) cancelAnimationFrame(animationId);
      document.getElementById('game-state').textContent = 'GAME OVER';
      document.getElementById('final-score').textContent = score;
      document.getElementById('game-over-screen').style.display = 'flex';
    }

    function updateScore(newScore) {
      score = newScore;
      document.getElementById('score').textContent = score;
    }

    // ═══ INPUT ═══
    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ' && !gameRunning) {
        startGame();
      }
    });
    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // ═══ GAME LOOP ═══
    let lastTime = 0;
    function gameLoop(timestamp = 0) {
      if (!gameRunning) return;
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;

      update(deltaTime);
      render();

      animationId = requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      // Update game logic here
    }

    function render() {
      ctx.fillStyle = renderTheme.background;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Replace this neutral placeholder with the game's own visual language.
      ctx.fillStyle = renderTheme.foreground;
      ctx.font = renderTheme.font;
      ctx.textAlign = 'center';
      ctx.fillText('Define your game rendering and art direction here', canvas.width / 2, canvas.height / 2);
    }
  </script>
</body>
</html>
