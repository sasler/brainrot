<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Maze Overdrive</title>
<style>
:root {
  color-scheme: dark;
  --cyan: #42f5ff;
  --blue: #3366ff;
  --pink: #ff3bd4;
  --yellow: #ffe84a;
  --lime: #8dff5a;
  --ink: #02030b;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #010207;
  color: white;
  font-family: "Trebuchet MS", Arial, sans-serif;
  touch-action: none;
  user-select: none;
}
body {
  display: grid;
  place-items: center;
}
#shell {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 42%, #101547 0%, #040612 45%, #010207 74%);
}
#shell::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    linear-gradient(rgba(77, 227, 255, .18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77, 227, 255, .18) 1px, transparent 1px);
  background-size: 34px 34px;
  transform: perspective(420px) rotateX(58deg) scale(1.8) translateY(26%);
  transform-origin: center bottom;
  mask-image: linear-gradient(transparent, #000 55%);
}
#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#hud {
  position: absolute;
  z-index: 3;
  top: max(7px, env(safe-area-inset-top));
  left: 50%;
  width: min(94vw, 720px);
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  gap: 8px;
  pointer-events: none;
  text-shadow: 0 0 10px currentColor;
}
.hudBlock {
  min-width: 0;
}
.hudBlock.right {
  text-align: right;
}
.label {
  color: #78a5c7;
  font-size: clamp(8px, 1.5vh, 12px);
  letter-spacing: .2em;
  text-transform: uppercase;
}
.value {
  color: white;
  font: 900 clamp(15px, 2.5vh, 24px)/1 monospace;
  letter-spacing: .05em;
}
#modeBadge {
  min-width: 92px;
  padding: 5px 9px;
  border: 1px solid rgba(66, 245, 255, .42);
  border-radius: 99px;
  color: var(--cyan);
  background: rgba(3, 12, 28, .68);
  box-shadow: inset 0 0 18px rgba(66, 245, 255, .12), 0 0 14px rgba(66, 245, 255, .15);
  font: 800 clamp(8px, 1.4vh, 11px)/1 monospace;
  letter-spacing: .14em;
  text-align: center;
  text-transform: uppercase;
}
#bottomHud {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: max(7px, env(safe-area-inset-bottom));
  width: min(94vw, 720px);
  transform: translateX(-50%);
  display: flex;
  justify-content: space-between;
  align-items: end;
  pointer-events: none;
}
#lives {
  display: flex;
  gap: 5px;
}
.life {
  width: clamp(11px, 2.5vh, 18px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: conic-gradient(from 35deg, transparent 0 16%, var(--yellow) 16% 100%);
  filter: drop-shadow(0 0 5px var(--yellow));
}
#levelText {
  color: #b4c8e6;
  font: 800 clamp(8px, 1.5vh, 12px)/1 monospace;
  letter-spacing: .14em;
  text-transform: uppercase;
}
#tipChip {
  position: absolute;
  z-index: 4;
  left: 50%;
  bottom: max(34px, calc(env(safe-area-inset-bottom) + 30px));
  transform: translate(-50%, 0);
  max-width: 90vw;
  padding: 6px 11px;
  border: 1px solid rgba(141, 255, 90, .26);
  border-radius: 99px;
  color: #d6ffc5;
  background: rgba(2, 10, 18, .78);
  box-shadow: 0 0 20px rgba(141, 255, 90, .11);
  font: 700 clamp(8px, 1.4vh, 11px)/1.25 monospace;
  letter-spacing: .06em;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s, transform .25s;
}
#tipChip.show {
  opacity: 1;
  transform: translate(-50%, -4px);
}
#audioToggle {
  position: absolute;
  z-index: 8;
  right: max(8px, env(safe-area-inset-right));
  bottom: max(7px, env(safe-area-inset-bottom));
  width: 32px;
  height: 32px;
  border: 1px solid rgba(66, 245, 255, .35);
  border-radius: 50%;
  color: var(--cyan);
  background: rgba(2, 8, 19, .82);
  box-shadow: 0 0 16px rgba(66, 245, 255, .16);
  cursor: pointer;
  font-size: 14px;
}
#audioToggle:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}
#audioToggle[aria-pressed="true"] {
  color: #ff557c;
  border-color: rgba(255, 85, 124, .5);
}
#overlay {
  position: absolute;
  z-index: 7;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 18px;
  background: radial-gradient(circle, rgba(8, 13, 39, .58), rgba(1, 2, 7, .9));
  backdrop-filter: blur(3px);
  transition: opacity .35s, visibility .35s;
}
#overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.panel {
  position: relative;
  width: min(92vw, 520px);
  padding: clamp(18px, 4vh, 36px);
  overflow: hidden;
  border: 1px solid rgba(66, 245, 255, .38);
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(7, 13, 35, .93), rgba(3, 5, 17, .94));
  box-shadow:
    inset 0 0 38px rgba(51, 102, 255, .12),
    0 0 55px rgba(51, 102, 255, .18),
    0 0 110px rgba(255, 59, 212, .08);
  text-align: center;
}
.panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: -60%;
  width: 45%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(66, 245, 255, .1), transparent);
  transform: skewX(-15deg);
  animation: sweep 4s infinite;
}
@keyframes sweep {
  0% { left: -60%; }
  60%, 100% { left: 130%; }
}
#eyebrow {
  color: var(--cyan);
  font: 800 clamp(9px, 1.8vh, 13px)/1 monospace;
  letter-spacing: .26em;
  text-transform: uppercase;
}
#title {
  margin: 10px 0 4px;
  color: white;
  font: 1000 clamp(32px, 8vw, 72px)/.82 Impact, sans-serif;
  letter-spacing: -.035em;
  text-transform: uppercase;
  text-shadow:
    0 0 5px white,
    0 0 16px var(--cyan),
    4px 4px 0 var(--pink);
  transform: skew(-4deg);
}
#subtitle {
  margin: 12px auto 16px;
  max-width: 390px;
  color: #a8bad5;
  font-size: clamp(10px, 2vh, 14px);
  line-height: 1.45;
}
#statLine {
  min-height: 18px;
  margin: 9px 0 13px;
  color: var(--yellow);
  font: 800 clamp(10px, 1.8vh, 13px)/1 monospace;
  letter-spacing: .12em;
  text-transform: uppercase;
}
#primaryButton {
  position: relative;
  min-width: 180px;
  padding: 12px 22px;
  border: 1px solid var(--cyan);
  border-radius: 99px;
  color: #021019;
  background: linear-gradient(90deg, var(--cyan), #9bfffd);
  box-shadow: 0 0 24px rgba(66, 245, 255, .45);
  cursor: pointer;
  font: 1000 13px/1 monospace;
  letter-spacing: .15em;
  text-transform: uppercase;
  transition: transform .15s, box-shadow .15s;
}
#primaryButton:hover,
#primaryButton:focus-visible {
  transform: scale(1.04);
  box-shadow: 0 0 34px rgba(66, 245, 255, .7);
  outline: none;
}
#controls {
  margin-top: 15px;
  color: #7890b0;
  font: 700 clamp(8px, 1.5vh, 11px)/1.55 monospace;
  letter-spacing: .05em;
}
.accent {
  color: var(--pink);
}
@media (max-height: 560px) {
  .panel {
    padding: 14px;
  }
  #subtitle {
    margin: 7px auto 9px;
  }
  #controls {
    margin-top: 8px;
  }
}
@media (max-width: 360px) {
  #hud {
    width: 96vw;
  }
  #modeBadge {
    min-width: 76px;
    padding-inline: 6px;
  }
  #audioToggle {
    width: 28px;
    height: 28px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .panel::before {
    animation: none;
  }
}
</style>
</head>
<body>
<main id="shell">
  <canvas id="canvas" aria-label="Neon Maze Overdrive game canvas"></canvas>
  <header id="hud">
    <div class="hudBlock">
      <div class="label">Score</div>
      <div class="value" id="scoreText">000000</div>
    </div>
    <div id="modeBadge">Ready</div>
    <div class="hudBlock right">
      <div class="label">High</div>
      <div class="value" id="highText">000000</div>
    </div>
  </header>
  <footer id="bottomHud">
    <div id="lives"></div>
    <div id="levelText">Level 01</div>
  </footer>
  <div id="tipChip">Swipe anywhere to steer</div>
  <button id="audioToggle" aria-label="Toggle audio">♪</button>
  <section id="overlay">
    <div class="panel">
      <div id="eyebrow">Arcade system online</div>
      <h1 id="title">Neon Maze<br><span class="accent">Overdrive</span></h1>
      <p id="subtitle">Burn through the grid. Chain hunted ghosts. Push the reactor into overdrive.</p>
      <div id="statLine">High score 000000</div>
      <button id="primaryButton">Engage</button>
      <div id="controls">ARROWS / WASD / SWIPE TO STEER<br>P PAUSE · R RESTART · M AUDIO</div>
    </div>
  </section>
</main>
<script>
"use strict";

// ---------------------------------------------------------------------------
// DOM and canvas
// ---------------------------------------------------------------------------

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const primaryButton = document.getElementById("primaryButton");
const titleEl = document.getElementById("title");
const eyebrowEl = document.getElementById("eyebrow");
const subtitleEl = document.getElementById("subtitle");
const statLine = document.getElementById("statLine");
const scoreText = document.getElementById("scoreText");
const highText = document.getElementById("highText");
const modeBadge = document.getElementById("modeBadge");
const livesEl = document.getElementById("lives");
const levelText = document.getElementById("levelText");
const tipChip = document.getElementById("tipChip");
const audioToggle = document.getElementById("audioToggle");

let width = 0;
let height = 0;
let dpr = 1;
let boardScale = 1;
let boardX = 0;
let boardY = 0;
let shakeX = 0;
let shakeY = 0;

const COLS = 28;
const ROWS = 31;
const TILE = 20;
const BOARD_W = COLS * TILE;
const BOARD_H = ROWS * TILE;

// # wall, . pellet, o power, space lane, - ghost gate.
const MAP_TEMPLATE = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "     #.##### ## #####.#     ",
  "     #.##          ##.#     ",
  "     #.## ###--### ##.#     ",
  "######.## #      # ##.######",
  "      .   #      #   .      ",
  "######.## #      # ##.######",
  "     #.## ######## ##.#     ",
  "     #.##          ##.#     ",
  "     #.## ######## ##.#     ",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##.......  .......##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################"
];

// ---------------------------------------------------------------------------
// Shared helpers
// ---------------------------------------------------------------------------

const TAU = Math.PI * 2;

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function lerp(a, b, amount) {
  return a + (b - a) * amount;
}

function easeOut(value) {
  return 1 - Math.pow(1 - value, 3);
}

function random(min, max) {
  return min + Math.random() * (max - min);
}

function choose(items) {
  return items[(Math.random() * items.length) | 0];
}

function distanceSq(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return dx * dx + dy * dy;
}

function formatScore(value) {
  return String(Math.max(0, value | 0)).padStart(6, "0");
}

function tileCenter(tile) {
  return tile * TILE + TILE / 2;
}

function toTile(value) {
  return Math.floor(value / TILE);
}

function cellAt(col, row) {
  if (row < 0 || row >= ROWS) {
    return "#";
  }
  if (col < 0 || col >= COLS) {
    return " ";
  }
  return maze[row][col];
}

function isWall(col, row) {
  return cellAt(col, row) === "#";
}

function isGate(col, row) {
  return cellAt(col, row) === "-";
}

function canEnter(col, row, actor) {
  if (isWall(col, row)) {
    return false;
  }
  if (isGate(col, row)) {
    return actor && (actor.eyes || actor.house);
  }
  return true;
}

function atCenter(actor, tolerance = 2.4) {
  const cx = tileCenter(toTile(actor.x));
  const cy = tileCenter(toTile(actor.y));
  return Math.abs(actor.x - cx) <= tolerance && Math.abs(actor.y - cy) <= tolerance;
}

function snapCenter(actor) {
  actor.x = tileCenter(toTile(actor.x));
  actor.y = tileCenter(toTile(actor.y));
}

function directionAngle(direction) {
  if (direction.x > 0) return 0;
  if (direction.y > 0) return Math.PI / 2;
  if (direction.x < 0) return Math.PI;
  return -Math.PI / 2;
}

function opposite(a, b) {
  return a.x === -b.x && a.y === -b.y;
}

const DIR = {
  left: { x: -1, y: 0, name: "left" },
  right: { x: 1, y: 0, name: "right" },
  up: { x: 0, y: -1, name: "up" },
  down: { x: 0, y: 1, name: "down" },
  none: { x: 0, y: 0, name: "none" }
};

const DIRECTIONS = [DIR.up, DIR.left, DIR.down, DIR.right];

// ---------------------------------------------------------------------------
// Audio engine
// ---------------------------------------------------------------------------

class AudioEngine {
  constructor() {
    this.context = null;
    this.master = null;
    this.music = null;
    this.enabled = true;
    this.step = 0;
    this.nextBeat = 0;
  }

  ensure() {
    if (!this.enabled) {
      return;
    }
    if (!this.context) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        return;
      }
      this.context = new AudioContext();
      this.master = this.context.createGain();
      this.master.gain.value = .23;
      this.master.connect(this.context.destination);
    }
    if (this.context.state === "suspended") {
      this.context.resume();
    }
  }

  tone(frequency, duration, options = {}) {
    if (!this.enabled) {
      return;
    }
    this.ensure();
    if (!this.context) {
      return;
    }
    const now = this.context.currentTime + (options.delay || 0);
    const oscillator = this.context.createOscillator();
    const gain = this.context.createGain();
    oscillator.type = options.type || "square";
    oscillator.frequency.setValueAtTime(frequency, now);
    if (options.slide) {
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(25, options.slide), now + duration);
    }
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(options.volume || .09, now + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
    oscillator.connect(gain);
    gain.connect(this.master);
    oscillator.start(now);
    oscillator.stop(now + duration + .03);
  }

  noise(duration = .12, volume = .08) {
    if (!this.enabled) {
      return;
    }
    this.ensure();
    if (!this.context) {
      return;
    }
    const length = Math.floor(this.context.sampleRate * duration);
    const buffer = this.context.createBuffer(1, length, this.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i += 1) {
      data[i] = Math.random() * 2 - 1;
    }
    const source = this.context.createBufferSource();
    const filter = this.context.createBiquadFilter();
    const gain = this.context.createGain();
    filter.type = "bandpass";
    filter.frequency.value = 620;
    gain.gain.setValueAtTime(volume, this.context.currentTime);
    gain.gain.exponentialRampToValueAtTime(.0001, this.context.currentTime + duration);
    source.buffer = buffer;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    source.start();
  }

  pellet() {
    this.tone(260 + (game.pelletBeat % 2) * 80, .045, { volume: .035, type: "square", slide: 210 });
  }

  power() {
    [130, 196, 260, 390].forEach((frequency, index) => {
      this.tone(frequency, .28, { delay: index * .055, volume: .07, type: "sawtooth", slide: frequency * 1.8 });
    });
  }

  ghost(chain) {
    const root = 360 * Math.pow(1.18, chain);
    [root, root * 1.25, root * 1.5].forEach((frequency, index) => {
      this.tone(frequency, .16, { delay: index * .035, volume: .09, type: "square", slide: frequency * 1.4 });
    });
  }

  fruit() {
    [523, 659, 784, 1047].forEach((frequency, index) => {
      this.tone(frequency, .2, { delay: index * .055, volume: .07, type: "triangle" });
    });
  }

  death() {
    this.noise(.5, .13);
    [620, 520, 400, 300, 180, 90].forEach((frequency, index) => {
      this.tone(frequency, .24, { delay: index * .09, volume: .08, type: "sawtooth", slide: frequency * .72 });
    });
  }

  clear() {
    [262, 330, 392, 523, 659, 784].forEach((frequency, index) => {
      this.tone(frequency, .32, { delay: index * .09, volume: .075, type: "triangle", slide: frequency * 1.02 });
    });
  }

  start() {
    [130, 196, 262, 392, 523].forEach((frequency, index) => {
      this.tone(frequency, .3, { delay: index * .08, volume: .07, type: "square", slide: frequency * 1.08 });
    });
  }

  tickMusic() {
    if (!this.enabled || game.state !== "playing") {
      return;
    }
    this.ensure();
    if (!this.context) {
      return;
    }
    if (this.context.currentTime < this.nextBeat) {
      return;
    }
    const over = game.overdrive > 0;
    const tempo = over ? .105 : .17;
    const bass = over
      ? [110, 165, 220, 147, 196, 294, 220, 330]
      : [82, 82, 123, 82, 98, 98, 147, 110];
    const note = bass[this.step % bass.length];
    this.tone(note, tempo * .75, {
      volume: over ? .045 : .028,
      type: over ? "sawtooth" : "triangle",
      slide: note * .96
    });
    if (this.step % 4 === 2) {
      this.tone(note * 2, .045, { volume: .018, type: "square" });
    }
    this.step += 1;
    this.nextBeat = this.context.currentTime + tempo;
  }

  toggle() {
    this.enabled = !this.enabled;
    audioToggle.textContent = this.enabled ? "♪" : "×";
    audioToggle.style.color = this.enabled ? "#42f5ff" : "#ff557c";
    audioToggle.setAttribute("aria-pressed", String(!this.enabled));
    if (this.enabled) {
      this.ensure();
      this.tone(440, .1, { type: "triangle", volume: .06 });
    }
  }
}

const audio = new AudioEngine();

// ---------------------------------------------------------------------------
// Effects
// ---------------------------------------------------------------------------

class Particle {
  constructor(x, y, options = {}) {
    this.x = x;
    this.y = y;
    this.vx = options.vx ?? random(-70, 70);
    this.vy = options.vy ?? random(-70, 70);
    this.life = options.life ?? random(.25, .7);
    this.maxLife = this.life;
    this.size = options.size ?? random(1.3, 3.5);
    this.color = options.color || "#42f5ff";
    this.drag = options.drag ?? .94;
    this.gravity = options.gravity ?? 0;
    this.glow = options.glow ?? 10;
    this.shape = options.shape || "dot";
  }

  update(dt) {
    this.life -= dt;
    this.vx *= Math.pow(this.drag, dt * 60);
    this.vy *= Math.pow(this.drag, dt * 60);
    this.vy += this.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }

  draw() {
    if (this.life <= 0) {
      return;
    }
    const alpha = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.glow;
    if (this.shape === "spark") {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.atan2(this.vy, this.vx));
      ctx.fillRect(-this.size * 2, -this.size / 2, this.size * 4, this.size);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * (.4 + alpha * .6), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

class FloatingText {
  constructor(x, y, text, color = "#ffffff", size = 14) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.size = size;
    this.life = 1;
    this.maxLife = 1;
  }

  update(dt) {
    this.life -= dt;
    this.y -= dt * 25;
  }

  draw() {
    const alpha = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.font = `900 ${this.size}px monospace`;
    ctx.textAlign = "center";
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

const particles = [];
const floatingTexts = [];
const shockwaves = [];

function burst(x, y, color, count = 14, speed = 95) {
  for (let i = 0; i < count; i += 1) {
    const angle = random(0, TAU);
    const velocity = random(speed * .35, speed);
    particles.push(new Particle(x, y, {
      vx: Math.cos(angle) * velocity,
      vy: Math.sin(angle) * velocity,
      color,
      life: random(.25, .75),
      shape: i % 3 === 0 ? "spark" : "dot"
    }));
  }
}

function trail(actor, color, amount = 1) {
  for (let i = 0; i < amount; i += 1) {
    particles.push(new Particle(
      actor.x + random(-3, 3),
      actor.y + random(-3, 3),
      {
        vx: -actor.dir.x * random(12, 35) + random(-8, 8),
        vy: -actor.dir.y * random(12, 35) + random(-8, 8),
        color,
        size: random(.8, 2),
        life: random(.12, .32),
        glow: 7
      }
    ));
  }
}

function addShockwave(x, y, color, max = 60) {
  shockwaves.push({ x, y, color, life: .65, maxLife: .65, radius: 2, max });
}

function addShake(amount) {
  game.shake = Math.max(game.shake, amount);
}

function showTip(message, duration = 1800) {
  tipChip.textContent = message;
  tipChip.classList.add("show");
  clearTimeout(showTip.timer);
  showTip.timer = setTimeout(() => tipChip.classList.remove("show"), duration);
}

// ---------------------------------------------------------------------------
// Actor definitions
// ---------------------------------------------------------------------------

function makePlayer() {
  return {
    x: tileCenter(13),
    y: tileCenter(23),
    dir: DIR.left,
    wanted: DIR.left,
    speed: 102,
    radius: 8.2,
    mouth: 0,
    dead: false,
    deathTime: 0
  };
}

function makeGhost(name, color, col, row, personality, release) {
  return {
    name,
    color,
    x: tileCenter(col),
    y: tileCenter(row),
    dir: DIR.left,
    speed: 88,
    radius: 8.6,
    personality,
    release,
    house: release > 0,
    frightened: false,
    eyes: false,
    reversePending: false,
    phase: random(0, TAU),
    target: { x: 0, y: 0 },
    lastTile: { x: -1, y: -1 }
  };
}

function makeGhosts() {
  return [
    makeGhost("BLITZ", "#ff375f", 13, 11, "hunter", 0),
    makeGhost("GLITCH", "#ff54d9", 14, 14, "ambush", 2.2),
    makeGhost("VECTOR", "#45e8ff", 12, 14, "vector", 5.2),
    makeGhost("RUST", "#ff9b42", 15, 14, "shy", 8.3)
  ];
}

let player = makePlayer();
let ghosts = makeGhosts();
let maze = [];

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------

const game = {
  state: "title",
  score: 0,
  high: 0,
  level: 1,
  lives: 3,
  pellets: 0,
  totalPellets: 0,
  pelletBeat: 0,
  frightened: 0,
  ghostChain: 0,
  overdrive: 0,
  overdriveMeter: 0,
  mode: "scatter",
  modeTimer: 7,
  modeIndex: 0,
  readyTimer: 0,
  clearTimer: 0,
  respawnTimer: 0,
  fruit: null,
  fruitShown: [false, false],
  fruitTimer: 0,
  shake: 0,
  flash: 0,
  elapsed: 0,
  lastTime: 0
};

const HIGH_SCORE_KEY = "neon-maze-overdrive-high-score";

function loadHighScore() {
  try {
    const stored = Number.parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10);
    return Number.isFinite(stored) && stored >= 0 ? stored : 0;
  } catch {
    return 0;
  }
}

function saveHighScore() {
  try {
    const safeHighScore = Number.isFinite(game.high) ? Math.max(0, Math.floor(game.high)) : 0;
    localStorage.setItem(HIGH_SCORE_KEY, String(safeHighScore));
  } catch {
    // Sandboxed or privacy-restricted storage should never interrupt gameplay.
  }
}

const MODE_SEQUENCE = [
  ["scatter", 7],
  ["chase", 20],
  ["scatter", 7],
  ["chase", 20],
  ["scatter", 5],
  ["chase", 25],
  ["scatter", 5],
  ["chase", 9999]
];

function resetMaze() {
  maze = MAP_TEMPLATE.map(row => row.split(""));
  game.pellets = 0;
  for (let row = 0; row < ROWS; row += 1) {
    for (let col = 0; col < COLS; col += 1) {
      if (maze[row][col] === "." || maze[row][col] === "o") {
        game.pellets += 1;
      }
    }
  }
  game.totalPellets = game.pellets;
}

function resetActors() {
  player = makePlayer();
  ghosts = makeGhosts();
  game.frightened = 0;
  game.ghostChain = 0;
  game.overdrive = 0;
  game.overdriveMeter = 0;
  game.mode = "scatter";
  game.modeIndex = 0;
  game.modeTimer = MODE_SEQUENCE[0][1];
}

function beginGame() {
  audio.ensure();
  audio.start();
  game.score = 0;
  game.level = 1;
  game.lives = 3;
  game.state = "ready";
  game.readyTimer = 1.7;
  game.fruit = null;
  game.fruitShown = [false, false];
  particles.length = 0;
  floatingTexts.length = 0;
  shockwaves.length = 0;
  resetMaze();
  resetActors();
  overlay.classList.add("hidden");
  updateHud();
  showTip("Swipe anywhere to steer · tap with two fingers to pause", 2600);
}

function restartGame() {
  beginGame();
}

function nextLevel() {
  game.level += 1;
  game.state = "ready";
  game.readyTimer = 1.8;
  game.fruit = null;
  game.fruitShown = [false, false];
  resetMaze();
  resetActors();
  updateHud();
}

function loseLife() {
  if (game.state !== "playing") {
    return;
  }
  game.state = "dying";
  player.dead = true;
  player.deathTime = 1.45;
  game.lives -= 1;
  game.frightened = 0;
  game.overdrive = 0;
  addShake(16);
  burst(player.x, player.y, "#ffe84a", 34, 150);
  addShockwave(player.x, player.y, "#ff3bd4", 100);
  audio.death();
  updateHud();
}

function finishDeath() {
  if (game.lives <= 0) {
    endGame();
    return;
  }
  game.state = "ready";
  game.readyTimer = 1.5;
  resetActors();
  updateHud();
}

function endGame() {
  game.state = "gameover";
  game.high = Math.max(game.high, game.score);
  saveHighScore();
  updateHud();
  eyebrowEl.textContent = "Run terminated";
  titleEl.innerHTML = "Grid<br><span class=\"accent\">Overload</span>";
  subtitleEl.textContent = "The maze keeps the echoes. Your high score keeps the proof.";
  statLine.textContent = `Score ${formatScore(game.score)} · High ${formatScore(game.high)}`;
  primaryButton.textContent = "Re-engage";
  overlay.classList.remove("hidden");
}

function clearLevel() {
  if (game.state !== "playing") {
    return;
  }
  game.state = "clear";
  game.clearTimer = 2.4;
  game.score += 1000 * game.level;
  game.flash = 1;
  addShake(8);
  audio.clear();
  for (let i = 0; i < 80; i += 1) {
    particles.push(new Particle(
      random(0, BOARD_W),
      random(0, BOARD_H),
      {
        color: choose(["#42f5ff", "#ff3bd4", "#ffe84a", "#8dff5a"]),
        life: random(.5, 1.5),
        vy: random(-50, 50),
        vx: random(-50, 50),
        shape: "spark"
      }
    ));
  }
  updateHud();
}

function togglePause() {
  if (game.state === "playing") {
    game.state = "paused";
    eyebrowEl.textContent = "System suspended";
    titleEl.innerHTML = "Pause<br><span class=\"accent\">Field</span>";
    subtitleEl.textContent = "Take a breath. The ghosts are pretending not to watch.";
    statLine.textContent = `Score ${formatScore(game.score)} · Level ${game.level}`;
    primaryButton.textContent = "Resume";
    overlay.classList.remove("hidden");
  } else if (game.state === "paused") {
    game.state = "playing";
    overlay.classList.add("hidden");
    audio.ensure();
  }
  updateHud();
}

function addScore(amount) {
  game.score += amount;
  if (game.score > game.high) {
    game.high = game.score;
  }
  updateHud();
}

function updateHud() {
  scoreText.textContent = formatScore(game.score);
  highText.textContent = formatScore(game.high);
  levelText.textContent = `Level ${String(game.level).padStart(2, "0")}`;
  livesEl.innerHTML = "";
  for (let i = 0; i < Math.max(0, game.lives); i += 1) {
    const life = document.createElement("span");
    life.className = "life";
    livesEl.appendChild(life);
  }
  if (game.state === "paused") {
    modeBadge.textContent = "Paused";
  } else if (game.overdrive > 0) {
    modeBadge.textContent = `Overdrive ${Math.ceil(game.overdrive)}`;
  } else if (game.frightened > 0) {
    modeBadge.textContent = `Power ${Math.ceil(game.frightened)}`;
  } else {
    modeBadge.textContent = game.state === "playing" ? game.mode : game.state;
  }
}

// ---------------------------------------------------------------------------
// Movement and collisions
// ---------------------------------------------------------------------------

function directionOpen(actor, direction) {
  const col = toTile(actor.x);
  const row = toTile(actor.y);
  return canEnter(col + direction.x, row + direction.y, actor);
}

function moveActor(actor, dt, speed) {
  if (atCenter(actor)) {
    snapCenter(actor);
  }
  actor.x += actor.dir.x * speed * dt;
  actor.y += actor.dir.y * speed * dt;
  if (actor.x < -TILE / 2) {
    actor.x = BOARD_W + TILE / 2;
  }
  if (actor.x > BOARD_W + TILE / 2) {
    actor.x = -TILE / 2;
  }
}

function updatePlayer(dt) {
  const baseSpeed = 99 + Math.min(18, game.level * 2);
  const speed = baseSpeed * (game.overdrive > 0 ? 1.17 : 1);
  if (atCenter(player, 3.5)) {
    snapCenter(player);
    if (directionOpen(player, player.wanted)) {
      player.dir = player.wanted;
    }
    if (!directionOpen(player, player.dir)) {
      player.dir = DIR.none;
    }
  } else if (opposite(player.wanted, player.dir)) {
    player.dir = player.wanted;
  }
  moveActor(player, dt, speed);
  player.mouth += dt * (game.overdrive > 0 ? 19 : 13);
  if (player.dir !== DIR.none && Math.random() < dt * (game.overdrive > 0 ? 38 : 16)) {
    trail(player, game.overdrive > 0 ? "#ff3bd4" : "#ffe84a", game.overdrive > 0 ? 2 : 1);
  }
  eatCell();
}

function eatCell() {
  const col = toTile(player.x);
  const row = toTile(player.y);
  if (!atCenter(player, 5)) {
    return;
  }
  const cell = cellAt(col, row);
  if (cell === ".") {
    maze[row][col] = " ";
    game.pellets -= 1;
    game.pelletBeat += 1;
    game.overdriveMeter = Math.min(100, game.overdriveMeter + 1.2);
    addScore(game.overdrive > 0 ? 20 : 10);
    audio.pellet();
    particles.push(new Particle(player.x, player.y, {
      color: "#fff4b0",
      life: .18,
      size: 1.5,
      vx: random(-20, 20),
      vy: random(-20, 20)
    }));
  } else if (cell === "o") {
    // Power-up: power pellets invert the hunt and charge the overdrive reactor.
    maze[row][col] = " ";
    game.pellets -= 1;
    game.frightened = Math.max(3.7, 7.5 - game.level * .32);
    game.ghostChain = 0;
    game.overdriveMeter = Math.min(100, game.overdriveMeter + 30);
    ghosts.forEach(ghost => {
      if (!ghost.eyes) {
        ghost.frightened = true;
        ghost.reversePending = true;
      }
    });
    addScore(50);
    addShake(5);
    addShockwave(player.x, player.y, "#42f5ff", 110);
    burst(player.x, player.y, "#42f5ff", 28, 125);
    audio.power();
    showTip("Power grid breached · hunt the ghosts");
  }
  if (game.overdriveMeter >= 100 && game.overdrive <= 0) {
    activateOverdrive();
  }
  const eaten = game.totalPellets - game.pellets;
  if (!game.fruitShown[0] && eaten > game.totalPellets * .32) {
    spawnFruit(0);
  }
  if (!game.fruitShown[1] && eaten > game.totalPellets * .68) {
    spawnFruit(1);
  }
  if (game.pellets <= 0) {
    clearLevel();
  }
}

function activateOverdrive() {
  game.overdrive = 6;
  game.overdriveMeter = 0;
  game.frightened = Math.max(game.frightened, 6);
  game.ghostChain = 0;
  ghosts.forEach(ghost => {
    if (!ghost.eyes) {
      ghost.frightened = true;
      ghost.reversePending = true;
    }
  });
  addShake(10);
  addShockwave(player.x, player.y, "#ff3bd4", 180);
  burst(player.x, player.y, "#ff3bd4", 45, 180);
  audio.power();
  floatingTexts.push(new FloatingText(player.x, player.y - 20, "OVERDRIVE", "#ff3bd4", 17));
  showTip("OVERDRIVE · chain every ghost for massive score");
}

function spawnFruit(index) {
  game.fruitShown[index] = true;
  game.fruit = {
    x: tileCenter(13.5),
    y: tileCenter(17),
    life: 10,
    spin: 0,
    value: 250 + game.level * 100
  };
  showTip("Bonus core detected");
}

function updateFruit(dt) {
  if (!game.fruit) {
    return;
  }
  game.fruit.life -= dt;
  game.fruit.spin += dt * 4;
  if (game.fruit.life <= 0) {
    game.fruit = null;
    return;
  }
  if (distanceSq(player, game.fruit) < 16 * 16) {
    const value = game.fruit.value;
    addScore(value);
    audio.fruit();
    burst(game.fruit.x, game.fruit.y, "#8dff5a", 28, 130);
    addShockwave(game.fruit.x, game.fruit.y, "#8dff5a", 85);
    floatingTexts.push(new FloatingText(game.fruit.x, game.fruit.y - 10, String(value), "#8dff5a", 16));
    game.fruit = null;
  }
}

// ---------------------------------------------------------------------------
// Ghost intelligence
// ---------------------------------------------------------------------------

const SCATTER_TARGETS = [
  { x: 26, y: 1 },
  { x: 1, y: 1 },
  { x: 26, y: 29 },
  { x: 1, y: 29 }
];

function getGhostTarget(ghost, index) {
  if (ghost.eyes) {
    return { x: 13, y: 14 };
  }
  if (game.mode === "scatter") {
    return SCATTER_TARGETS[index];
  }
  const px = toTile(player.x);
  const py = toTile(player.y);
  if (ghost.personality === "hunter") {
    return { x: px, y: py };
  }
  if (ghost.personality === "ambush") {
    return {
      x: px + player.dir.x * 4,
      y: py + player.dir.y * 4
    };
  }
  if (ghost.personality === "vector") {
    const leadX = px + player.dir.x * 2;
    const leadY = py + player.dir.y * 2;
    const blitz = ghosts[0];
    return {
      x: leadX + (leadX - toTile(blitz.x)),
      y: leadY + (leadY - toTile(blitz.y))
    };
  }
  const dx = toTile(ghost.x) - px;
  const dy = toTile(ghost.y) - py;
  if (dx * dx + dy * dy < 64) {
    return SCATTER_TARGETS[index];
  }
  return { x: px, y: py };
}

function possibleGhostDirections(ghost) {
  const col = toTile(ghost.x);
  const row = toTile(ghost.y);
  return DIRECTIONS.filter(direction => {
    if (!canEnter(col + direction.x, row + direction.y, ghost)) {
      return false;
    }
    if (opposite(direction, ghost.dir) && !ghost.reversePending) {
      return false;
    }
    return true;
  });
}

function selectGhostDirection(ghost, index) {
  let options = possibleGhostDirections(ghost);
  if (ghost.reversePending) {
    ghost.reversePending = false;
    const reverse = options.find(direction => opposite(direction, ghost.dir));
    if (reverse) {
      return reverse;
    }
  }
  if (!options.length) {
    return {
      x: -ghost.dir.x,
      y: -ghost.dir.y,
      name: "reverse"
    };
  }
  if (ghost.frightened && !ghost.eyes) {
    return choose(options);
  }
  const target = getGhostTarget(ghost, index);
  options.sort((a, b) => {
    const col = toTile(ghost.x);
    const row = toTile(ghost.y);
    const adx = col + a.x - target.x;
    const ady = row + a.y - target.y;
    const bdx = col + b.x - target.x;
    const bdy = row + b.y - target.y;
    return adx * adx + ady * ady - (bdx * bdx + bdy * bdy);
  });
  return options[0];
}

function updateGhost(ghost, index, dt) {
  ghost.phase += dt * 5;
  if (ghost.house) {
    ghost.release -= dt;
    ghost.y += Math.sin(ghost.phase * 2) * dt * 9;
    if (ghost.release <= 0) {
      ghost.house = false;
      ghost.x = tileCenter(13);
      ghost.y = tileCenter(11);
      ghost.dir = DIR.left;
    }
    return;
  }
  const col = toTile(ghost.x);
  const row = toTile(ghost.y);
  if (atCenter(ghost, 3.2) && (col !== ghost.lastTile.x || row !== ghost.lastTile.y)) {
    snapCenter(ghost);
    ghost.lastTile.x = col;
    ghost.lastTile.y = row;
    ghost.dir = selectGhostDirection(ghost, index);
  }
  let speed = 85 + Math.min(24, game.level * 2.5);
  if (ghost.frightened) {
    speed *= .67;
  }
  if (ghost.eyes) {
    speed *= 1.75;
  }
  moveActor(ghost, dt, speed);
  if (ghost.eyes && toTile(ghost.x) === 13 && toTile(ghost.y) === 14) {
    ghost.eyes = false;
    ghost.frightened = false;
    ghost.house = true;
    ghost.release = 1.25;
    ghost.x = tileCenter(13);
    ghost.y = tileCenter(14);
  }
  if ((ghost.frightened || ghost.eyes) && Math.random() < dt * 18) {
    trail(ghost, ghost.eyes ? "#b8f7ff" : "#465cff");
  }
}

function updateGhostModes(dt) {
  if (game.frightened > 0) {
    game.frightened -= dt;
    ghosts.forEach(ghost => {
      if (!ghost.eyes) {
        ghost.frightened = true;
      }
    });
    if (game.frightened <= 0) {
      game.frightened = 0;
      game.ghostChain = 0;
      ghosts.forEach(ghost => {
        ghost.frightened = false;
      });
    }
  } else {
    game.modeTimer -= dt;
    if (game.modeTimer <= 0 && game.modeIndex < MODE_SEQUENCE.length - 1) {
      game.modeIndex += 1;
      game.mode = MODE_SEQUENCE[game.modeIndex][0];
      game.modeTimer = MODE_SEQUENCE[game.modeIndex][1];
      ghosts.forEach(ghost => {
        if (!ghost.eyes) {
          ghost.reversePending = true;
        }
      });
      showTip(`${game.mode.toUpperCase()} MODE`);
    }
  }
  if (game.overdrive > 0) {
    game.overdrive -= dt;
    if (game.overdrive <= 0) {
      game.overdrive = 0;
    }
  }
}

function checkGhostCollisions() {
  for (const ghost of ghosts) {
    if (ghost.eyes || ghost.house) {
      continue;
    }
    if (distanceSq(player, ghost) < 13 * 13) {
      if (ghost.frightened) {
        eatGhost(ghost);
      } else {
        loseLife();
      }
      return;
    }
  }
}

function eatGhost(ghost) {
  ghost.eyes = true;
  ghost.frightened = false;
  ghost.reversePending = false;
  game.ghostChain += 1;
  const base = 200 * Math.pow(2, Math.min(4, game.ghostChain - 1));
  const value = game.overdrive > 0 ? base * 2 : base;
  addScore(value);
  addShake(7 + game.ghostChain * 1.5);
  burst(ghost.x, ghost.y, ghost.color, 30 + game.ghostChain * 5, 140);
  addShockwave(ghost.x, ghost.y, ghost.color, 80 + game.ghostChain * 10);
  floatingTexts.push(new FloatingText(ghost.x, ghost.y - 12, `${value} ×${game.ghostChain}`, ghost.color, 16));
  audio.ghost(game.ghostChain);
}

// ---------------------------------------------------------------------------
// Main simulation
// ---------------------------------------------------------------------------

function update(dt) {
  game.elapsed += dt;
  if (game.flash > 0) {
    game.flash = Math.max(0, game.flash - dt * 1.7);
  }
  if (game.shake > 0) {
    game.shake = Math.max(0, game.shake - dt * 28);
  }
  if (game.state === "ready") {
    game.readyTimer -= dt;
    if (game.readyTimer <= 0) {
      game.state = "playing";
      showTip("Clear the maze · power pellets turn the hunt");
      updateHud();
    }
  } else if (game.state === "playing") {
    updateGhostModes(dt);
    updatePlayer(dt);
    ghosts.forEach((ghost, index) => updateGhost(ghost, index, dt));
    updateFruit(dt);
    checkGhostCollisions();
    audio.tickMusic();
  } else if (game.state === "dying") {
    player.deathTime -= dt;
    if (player.deathTime <= 0) {
      finishDeath();
    }
  } else if (game.state === "clear") {
    game.clearTimer -= dt;
    if (game.clearTimer <= 0) {
      nextLevel();
    }
  }
  updateEffects(dt);
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i -= 1) {
    particles[i].update(dt);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }
  for (let i = floatingTexts.length - 1; i >= 0; i -= 1) {
    floatingTexts[i].update(dt);
    if (floatingTexts[i].life <= 0) {
      floatingTexts.splice(i, 1);
    }
  }
  for (let i = shockwaves.length - 1; i >= 0; i -= 1) {
    const wave = shockwaves[i];
    wave.life -= dt;
    wave.radius = lerp(wave.radius, wave.max, dt * 5);
    if (wave.life <= 0) {
      shockwaves.splice(i, 1);
    }
  }
  if (Math.random() < dt * 4) {
    particles.push(new Particle(
      random(0, BOARD_W),
      random(0, BOARD_H),
      {
        vx: random(-3, 3),
        vy: random(-8, -2),
        color: choose(["#133d7d", "#28105e", "#0b5b68"]),
        size: random(.5, 1.5),
        life: random(1.5, 3),
        glow: 3
      }
    ));
  }
}

function frame(time) {
  const dt = Math.min(.033, Math.max(0, (time - game.lastTime) / 1000 || 0));
  game.lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const topRoom = Math.min(50, height * .085);
  const bottomRoom = Math.min(42, height * .075);
  boardScale = Math.min(
    (width - 12) / BOARD_W,
    (height - topRoom - bottomRoom) / BOARD_H
  );
  boardX = (width - BOARD_W * boardScale) / 2;
  boardY = topRoom + (height - topRoom - bottomRoom - BOARD_H * boardScale) / 2;
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  drawBackdrop();
  shakeX = game.shake > 0 ? random(-game.shake, game.shake) : 0;
  shakeY = game.shake > 0 ? random(-game.shake, game.shake) : 0;
  ctx.save();
  ctx.translate(boardX + shakeX, boardY + shakeY);
  ctx.scale(boardScale, boardScale);
  drawMaze();
  drawPellets();
  drawFruit();
  drawShockwaves();
  drawActors();
  particles.forEach(particle => particle.draw());
  floatingTexts.forEach(text => text.draw());
  drawCenterMessage();
  ctx.restore();
  drawVignette();
  if (game.flash > 0) {
    ctx.fillStyle = `rgba(120,245,255,${game.flash * .22})`;
    ctx.fillRect(0, 0, width, height);
  }
}

function drawBackdrop() {
  const gradient = ctx.createRadialGradient(width / 2, height * .45, 10, width / 2, height * .45, Math.max(width, height) * .75);
  gradient.addColorStop(0, game.overdrive > 0 ? "#240938" : "#071027");
  gradient.addColorStop(.55, "#030612");
  gradient.addColorStop(1, "#010207");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  ctx.globalAlpha = .08;
  ctx.strokeStyle = game.overdrive > 0 ? "#ff3bd4" : "#42f5ff";
  ctx.lineWidth = 1;
  const spacing = 38;
  const drift = (game.elapsed * 8) % spacing;
  for (let x = -spacing + drift; x < width + spacing; x += spacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for (let y = -spacing + drift; y < height + spacing; y += spacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function wallConnections(col, row) {
  return {
    left: isWall(col - 1, row),
    right: isWall(col + 1, row),
    up: isWall(col, row - 1),
    down: isWall(col, row + 1)
  };
}

function drawMaze() {
  ctx.save();
  const pulse = .65 + Math.sin(game.elapsed * 2.2) * .18;
  for (let row = 0; row < ROWS; row += 1) {
    for (let col = 0; col < COLS; col += 1) {
      if (!isWall(col, row)) {
        continue;
      }
      const x = col * TILE;
      const y = row * TILE;
      const links = wallConnections(col, row);
      ctx.fillStyle = "rgba(6,12,37,.92)";
      ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
      ctx.strokeStyle = game.overdrive > 0
        ? `rgba(255,59,212,${pulse})`
        : `rgba(61,118,255,${pulse})`;
      ctx.shadowColor = game.overdrive > 0 ? "#ff3bd4" : "#245cff";
      ctx.shadowBlur = 5;
      ctx.lineWidth = 1.45;
      ctx.beginPath();
      if (!links.up) {
        ctx.moveTo(x + 3, y + 3);
        ctx.lineTo(x + TILE - 3, y + 3);
      }
      if (!links.right) {
        ctx.moveTo(x + TILE - 3, y + 3);
        ctx.lineTo(x + TILE - 3, y + TILE - 3);
      }
      if (!links.down) {
        ctx.moveTo(x + TILE - 3, y + TILE - 3);
        ctx.lineTo(x + 3, y + TILE - 3);
      }
      if (!links.left) {
        ctx.moveTo(x + 3, y + TILE - 3);
        ctx.lineTo(x + 3, y + 3);
      }
      ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#ff3bd4";
  ctx.shadowColor = "#ff3bd4";
  ctx.shadowBlur = 8;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(13 * TILE, 13 * TILE);
  ctx.lineTo(15 * TILE, 13 * TILE);
  ctx.stroke();
  ctx.restore();
}

function drawPellets() {
  const pulse = 1 + Math.sin(game.elapsed * 6) * .18;
  for (let row = 0; row < ROWS; row += 1) {
    for (let col = 0; col < COLS; col += 1) {
      const cell = maze[row][col];
      if (cell !== "." && cell !== "o") {
        continue;
      }
      const x = tileCenter(col);
      const y = tileCenter(row);
      if (cell === ".") {
        ctx.fillStyle = "#fff1b1";
        ctx.shadowColor = "#ffe84a";
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(x, y, 1.55, 0, TAU);
        ctx.fill();
      } else {
        ctx.fillStyle = "#f5ffff";
        ctx.shadowColor = "#42f5ff";
        ctx.shadowBlur = 13;
        ctx.beginPath();
        ctx.arc(x, y, 4.3 * pulse, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(66,245,255,.45)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 7.5 * pulse, 0, TAU);
        ctx.stroke();
      }
    }
  }
  ctx.shadowBlur = 0;
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  let angle = directionAngle(player.dir);
  if (player.dir === DIR.none) {
    angle = 0;
  }
  ctx.rotate(angle);
  const open = player.dead
    ? clamp((1.45 - player.deathTime) * 2.2, 0, Math.PI)
    : .13 + Math.abs(Math.sin(player.mouth)) * .34;
  const color = game.overdrive > 0 ? "#ffec52" : "#ffe84a";
  ctx.fillStyle = color;
  ctx.shadowColor = game.overdrive > 0 ? "#ff3bd4" : "#ffe84a";
  ctx.shadowBlur = game.overdrive > 0 ? 22 : 12;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, player.radius, open, TAU - open);
  ctx.closePath();
  ctx.fill();
  if (game.overdrive > 0) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    ctx.globalAlpha = .7;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius + 3 + Math.sin(game.elapsed * 12), 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGhost(ghost) {
  ctx.save();
  ctx.translate(ghost.x, ghost.y);
  const bob = Math.sin(ghost.phase) * .6;
  ctx.translate(0, bob);
  if (ghost.eyes) {
    drawGhostEyes(ghost, 0);
    ctx.restore();
    return;
  }
  const flashing = ghost.frightened && game.frightened < 2 && Math.sin(game.elapsed * 18) > 0;
  const color = ghost.frightened
    ? (flashing ? "#f6f6ff" : "#3349ff")
    : ghost.color;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = ghost.frightened ? 14 : 12;
  ctx.beginPath();
  ctx.arc(0, -1, ghost.radius, Math.PI, 0);
  ctx.lineTo(ghost.radius, ghost.radius);
  for (let i = 0; i < 4; i += 1) {
    const x = ghost.radius - (i + 1) * (ghost.radius * 2 / 4);
    const y = i % 2 === 0 ? ghost.radius - 3 : ghost.radius;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(-ghost.radius, ghost.radius);
  ctx.closePath();
  ctx.fill();
  if (ghost.frightened) {
    ctx.strokeStyle = flashing ? "#ff375f" : "#9cc8ff";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-4, 3);
    ctx.lineTo(-2, 1);
    ctx.lineTo(0, 3);
    ctx.lineTo(2, 1);
    ctx.lineTo(4, 3);
    ctx.stroke();
  } else {
    drawGhostEyes(ghost, 0);
  }
  ctx.restore();
}

function drawGhostEyes(ghost, offsetY) {
  const lookX = ghost.dir.x * 1.5;
  const lookY = ghost.dir.y * 1.5;
  for (const offset of [-3.2, 3.2]) {
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.ellipse(offset, offsetY - 2, 2.7, 3.5, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#1647c9";
    ctx.shadowBlur = 2;
    ctx.beginPath();
    ctx.arc(offset + lookX, offsetY - 2 + lookY, 1.45, 0, TAU);
    ctx.fill();
  }
}

function drawActors() {
  ghosts.forEach(drawGhost);
  drawPlayer();
}

function drawFruit() {
  if (!game.fruit) {
    return;
  }
  const fruit = game.fruit;
  ctx.save();
  ctx.translate(fruit.x, fruit.y);
  ctx.rotate(Math.sin(fruit.spin) * .15);
  const pulse = 1 + Math.sin(fruit.spin * 2) * .08;
  ctx.scale(pulse, pulse);
  ctx.fillStyle = "#8dff5a";
  ctx.shadowColor = "#8dff5a";
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.lineTo(7, -4);
  ctx.lineTo(7, 5);
  ctx.lineTo(0, 9);
  ctx.lineTo(-7, 5);
  ctx.lineTo(-7, -4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = "#081518";
  ctx.font = "900 7px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("N", 0, 1);
  ctx.restore();
}

function drawShockwaves() {
  shockwaves.forEach(wave => {
    ctx.globalAlpha = clamp(wave.life / wave.maxLife, 0, 1);
    ctx.strokeStyle = wave.color;
    ctx.shadowColor = wave.color;
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(wave.x, wave.y, wave.radius, 0, TAU);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawCenterMessage() {
  let message = "";
  let color = "#ffe84a";
  if (game.state === "ready") {
    message = game.level === 1 ? "READY" : `LEVEL ${game.level}`;
  } else if (game.state === "clear") {
    message = "GRID CLEARED";
    color = "#42f5ff";
  }
  if (!message) {
    return;
  }
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.font = "1000 18px monospace";
  ctx.textAlign = "center";
  ctx.fillText(message, BOARD_W / 2, BOARD_H / 2 + 75);
  ctx.shadowBlur = 0;
}

function drawVignette() {
  const gradient = ctx.createRadialGradient(width / 2, height / 2, Math.min(width, height) * .2, width / 2, height / 2, Math.max(width, height) * .7);
  gradient.addColorStop(0, "rgba(0,0,0,0)");
  gradient.addColorStop(1, "rgba(0,0,8,.72)");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  ctx.globalAlpha = .05;
  ctx.fillStyle = "#ffffff";
  for (let y = 0; y < height; y += 4) {
    ctx.fillRect(0, y, width, 1);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------

function setDirection(direction) {
  if (game.state === "title" || game.state === "gameover") {
    beginGame();
  }
  player.wanted = direction;
}

const KEY_DIRECTIONS = {
  ArrowLeft: DIR.left,
  KeyA: DIR.left,
  ArrowRight: DIR.right,
  KeyD: DIR.right,
  ArrowUp: DIR.up,
  KeyW: DIR.up,
  ArrowDown: DIR.down,
  KeyS: DIR.down
};

window.addEventListener("keydown", event => {
  if (KEY_DIRECTIONS[event.code]) {
    event.preventDefault();
    setDirection(KEY_DIRECTIONS[event.code]);
    return;
  }
  if (event.code === "KeyP" || event.code === "Escape") {
    event.preventDefault();
    togglePause();
  } else if (event.code === "KeyR") {
    event.preventDefault();
    restartGame();
  } else if (event.code === "KeyM") {
    event.preventDefault();
    audio.toggle();
  } else if (event.code === "Space" || event.code === "Enter") {
    event.preventDefault();
    if (game.state === "title" || game.state === "gameover") {
      beginGame();
    } else if (game.state === "paused") {
      togglePause();
    }
  }
});

let touchStart = null;
let touchCount = 0;

canvas.addEventListener("pointerdown", event => {
  audio.ensure();
  touchStart = {
    x: event.clientX,
    y: event.clientY,
    time: performance.now()
  };
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", event => {
  if (!touchStart) {
    return;
  }
  const dx = event.clientX - touchStart.x;
  const dy = event.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 16) {
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection(dx > 0 ? DIR.right : DIR.left);
  } else {
    setDirection(dy > 0 ? DIR.down : DIR.up);
  }
  touchStart.x = event.clientX;
  touchStart.y = event.clientY;
});

canvas.addEventListener("pointerup", event => {
  if (!touchStart) {
    return;
  }
  const dx = event.clientX - touchStart.x;
  const dy = event.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 10 && game.state === "title") {
    beginGame();
  }
  touchStart = null;
});

canvas.addEventListener("touchstart", event => {
  touchCount = event.touches.length;
  if (touchCount >= 2) {
    event.preventDefault();
    togglePause();
  }
}, { passive: false });

primaryButton.addEventListener("click", () => {
  if (game.state === "paused") {
    togglePause();
  } else {
    beginGame();
  }
});

audioToggle.addEventListener("click", event => {
  event.stopPropagation();
  audio.toggle();
});

window.addEventListener("resize", resize);
window.addEventListener("blur", () => {
  if (game.state === "playing") {
    togglePause();
  }
});
window.addEventListener("pagehide", saveHighScore);

// ---------------------------------------------------------------------------
// Startup
// ---------------------------------------------------------------------------

game.high = loadHighScore();
resetMaze();
resetActors();
resize();
updateHud();
statLine.textContent = `High score ${formatScore(game.high)}`;
requestAnimationFrame(frame);

</script>
</body>
</html>
