   6. WORLD
   Authored forms on brass armatures. Nothing here is a bare sphere.
   ========================================================================== */

const COLOR = {
  void: 0x080d1a,
  brass: 0xc9a15a,
  brassBright: 0xf0d5a0,
  brassDim: 0x6f5a30,
  ivory: 0xefe6d2,
  patina: 0x7fd7c4,
  patinaDeep: 0x2c7b70,
  lamp: 0xffd9a0,
  alarm: 0xe2603f,
  copper: 0xb4714a,
};

/** A radial-gradient sprite, generated in code. Stands in for a bloom pass. */
function glowTexture(inner, outer, power = 2.4) {
  const size = 128;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const img = g.createImageData(size, size);
  const ir = ((inner >> 16) & 255), ig = ((inner >> 8) & 255), ib = inner & 255;
  const or = ((outer >> 16) & 255), og = ((outer >> 8) & 255), ob = outer & 255;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const dx = (x - size / 2) / (size / 2);
      const dy = (y - size / 2) / (size / 2);
      const d = clamp(1 - Math.hypot(dx, dy), 0, 1);
      const a = Math.pow(d, power);
      const o = (y * size + x) * 4;
      img.data[o] = lerp(or, ir, a);
      img.data[o + 1] = lerp(og, ig, a);
      img.data[o + 2] = lerp(ob, ib, a);
      img.data[o + 3] = Math.round(a * 255);
    }
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/** The ecliptic plate: engraved graduations, drawn once into a texture. */
function eclipticTexture() {
  const size = 1024;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const mid = size / 2;
  g.clearRect(0, 0, size, size);

  // Two graduated circles, not one. The rim ring belongs to the whole-orrery
  // view; the inner ring is what you actually read when zoomed to a route.
  g.strokeStyle = "rgba(201,161,90,0.30)";
  g.lineWidth = 1.2;
  for (const band of [{ r: mid - 8, scale: 1 }, { r: (mid - 8) * 0.54, scale: 0.62 }]) {
    for (let i = 0; i < 360; i += 1) {
      const major = i % 30 === 0;
      const medium = i % 10 === 0;
      if (!major && !medium && i % 2 !== 0) continue;
      const len = (major ? 34 : medium ? 18 : 7) * band.scale;
      const a = (i / 360) * TAU;
      g.globalAlpha = (major ? 0.85 : medium ? 0.5 : 0.22) * (band.scale === 1 ? 1 : 0.8);
      g.beginPath();
      g.moveTo(mid + Math.cos(a) * band.r, mid + Math.sin(a) * band.r);
      g.lineTo(mid + Math.cos(a) * (band.r - len), mid + Math.sin(a) * (band.r - len));
      g.stroke();
    }
    g.globalAlpha = 0.5;
    g.beginPath();
    g.arc(mid, mid, band.r, 0, TAU);
    g.stroke();
  }
  g.globalAlpha = 1;

  // Concentric engraved rules; faint, so orbit lines stay dominant.
  for (let r = 0.16; r < 0.98; r += 0.082) {
    g.strokeStyle = `rgba(201,161,90,${r < 0.3 ? 0.16 : 0.1})`;
    g.lineWidth = 1;
    g.beginPath();
    g.arc(mid, mid, r * (mid - 10), 0, TAU);
    g.stroke();
  }

  g.strokeStyle = "rgba(239,230,210,0.16)";
  g.lineWidth = 2;
  g.beginPath();
  g.arc(mid, mid, mid - 9, 0, TAU);
  g.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* -- Authored geometry ---------------------------------------------------- */

/** A cratered rock: an icosphere pushed around by a handful of impact basins. */
function rockGeometry(radius, seed, detail = 2) {
  const geo = new THREE.IcosahedronGeometry(radius, detail);
  const pos = geo.attributes.position;
  const rng = makeRng(seed);
  const craters = [];
  const count = 5 + Math.floor(rng.next() * 4);
  for (let i = 0; i < count; i += 1) {
    const th = rng.range(0, TAU), ph = Math.acos(rng.range(-1, 1));
    craters.push({
      x: Math.sin(ph) * Math.cos(th), y: Math.cos(ph), z: Math.sin(ph) * Math.sin(th),
      w: rng.range(0.22, 0.55), d: rng.range(0.05, 0.13),
    });
  }
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i += 1) {
    v.fromBufferAttribute(pos, i);
    const n = v.clone().normalize();
    let push = (rng.next() - 0.5) * 0.035;
    for (const cr of craters) {
      const dot = n.x * cr.x + n.y * cr.y + n.z * cr.z;
      const ang = Math.acos(clamp(dot, -1, 1));
      if (ang < cr.w) {
        const f = 1 - ang / cr.w;
        push -= cr.d * smoothstep(f) - cr.d * 0.28 * smoothstep(clamp((ang / cr.w - 0.72) / 0.28, 0, 1));
      }
    }
    v.addScaledVector(n, push * radius);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

/** A gas giant: oblate, with latitude banding baked into vertex colours. */
function gasGeometry(radius, seed) {
  const geo = new THREE.SphereGeometry(radius, 40, 24);
  geo.scale(1, 0.88, 1);
  const pos = geo.attributes.position;
  const rng = makeRng(seed);
  const colors = new Float32Array(pos.count * 3);
  const bands = [];
  for (let i = 0; i < 7; i += 1) {
    bands.push({ c: rng.range(-1, 1), w: rng.range(0.09, 0.26), v: rng.range(-0.18, 0.2) });
  }
  const base = new THREE.Color();
  for (let i = 0; i < pos.count; i += 1) {
    const lat = pos.getY(i) / (radius * 0.88);
    let shade = 0;
    for (const b of bands) {
      const d = Math.abs(lat - b.c);
      if (d < b.w) shade += b.v * smoothstep(1 - d / b.w);
    }
    shade += Math.sin(lat * 22) * 0.03;
    base.setRGB(1 + shade, 1 + shade * 0.86, 1 + shade * 0.62);
    colors[i * 3] = base.r; colors[i * 3 + 1] = base.g; colors[i * 3 + 2] = base.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  return geo;
}

/** The mail probe: a brass hull, a satchel drum, vanes, and a nozzle. */
function buildProbe() {
  const group = new THREE.Group();
  const hull = new THREE.MeshStandardMaterial({ color: 0xd7b477, metalness: 0.85, roughness: 0.34 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2c3346, metalness: 0.5, roughness: 0.6 });
  const flag = new THREE.MeshStandardMaterial({
    color: COLOR.patina, emissive: COLOR.patinaDeep, emissiveIntensity: 0.7,
    metalness: 0.2, roughness: 0.5, side: THREE.DoubleSide,
  });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 0.44, 10), hull);
  body.rotation.z = Math.PI / 2;
  group.add(body);

  const satchel = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.2, 12), dark);
  satchel.rotation.z = Math.PI / 2;
  satchel.position.x = -0.06;
  group.add(satchel);

  for (let i = 0; i < 3; i += 1) {
    const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.175, 0.014, 6, 16), hull);
    hoop.rotation.y = Math.PI / 2;
    hoop.position.x = -0.14 + i * 0.08;
    group.add(hoop);
  }

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.2, 10), hull);
  nose.rotation.z = -Math.PI / 2;
  nose.position.x = 0.31;
  group.add(nose);

  const nozzle = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.16, 10, 1, true), dark);
  nozzle.rotation.z = Math.PI / 2;
  nozzle.position.x = -0.28;
  group.add(nozzle);

  for (const s of [-1, 1]) {
    const vane = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.012, 0.1), flag);
    vane.position.set(0.02, 0, s * 0.19);
    vane.rotation.x = s * 0.32;
    group.add(vane);
    const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 6), hull);
    strut.rotation.x = Math.PI / 2;
    strut.position.set(0.02, 0, s * 0.1);
    group.add(strut);
  }

  return group;
}

/** A mail buoy: a lantern in a brass cage, on a stalk, with a pennant. */
function buildBeaconMesh() {
  const group = new THREE.Group();
  const cage = new THREE.MeshStandardMaterial({ color: 0xc9a15a, metalness: 0.9, roughness: 0.3 });
  const lamp = new THREE.MeshStandardMaterial({
    color: COLOR.patina, emissive: COLOR.patina, emissiveIntensity: 1.5,
    metalness: 0.1, roughness: 0.4,
  });

  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 0), lamp);
  core.name = "core";
  group.add(core);

  for (let i = 0; i < 3; i += 1) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.018, 6, 20), cage);
    ring.rotation.x = i === 0 ? Math.PI / 2 : 0;
    ring.rotation.y = i === 1 ? Math.PI / 2 : 0;
    group.add(ring);
  }

  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.5, 6), cage);
  stalk.position.y = -0.36;
  group.add(stalk);

  const foot = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.12, 8), cage);
  foot.position.y = -0.62;
  foot.rotation.x = Math.PI;
  group.add(foot);

  const pennant = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.14), new THREE.MeshStandardMaterial({
    color: COLOR.copper, metalness: 0.2, roughness: 0.7, side: THREE.DoubleSide,
  }));
  pennant.position.set(0.15, 0.3, 0);
  group.add(pennant);

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 5), cage);
  stem.position.y = 0.32;
  group.add(stem);

  return group;
}
const AIM_UP = new THREE.Vector3(0, 1, 0);
const RIBBON_MAX = 760;
const PLOT_MAX = 900;
const PREDICT_HORIZON = 42;
const PREDICT_SAMPLE = 4;

class Orrery {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, powerPreference: "high-performance",
    });
    this.renderer.setClearColor(COLOR.void, 1);
    this.renderer.shadowMap.enabled = false;   // one point light already models
    this.dprCap = 1.75;                        // every form; shadow maps across
    this.postPasses = 0;                       // a 0.3–45 unit range would mush.

    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x060a14, 0.0042);

    this.camera = new THREE.PerspectiveCamera(46, 1, 0.4, 620);
    this.azimuth = -0.62;
    this.elevation = 0.95;
    this.zoom = 1;
    this.target = new THREE.Vector3();
    this.focus = new THREE.Vector3();

    this.textures = {
      glowWarm: glowTexture(0xfff0cf, 0xff9a3c, 2.2),
      glowPatina: glowTexture(0xdcfff6, 0x2c7b70, 2.6),
      dot: glowTexture(0xffffff, 0x000000, 1.5),
      plate: eclipticTexture(),
    };
    this.disposables = [this.textures.glowWarm, this.textures.glowPatina, this.textures.dot, this.textures.plate];

    this.buildStaticScene();
    this.contractRoot = null;
    this.bodyNodes = [];
    this.beaconNodes = [];
    this.extent = 40;

    this.buildProbe();
    this.buildRibbon();
    this.buildPlot();
    this.buildAim();

    this.resize();
  }

  track(obj) { this.disposables.push(obj); return obj; }

  buildStaticScene() {
    const { scene } = this;

    scene.add(new THREE.AmbientLight(0x2a3550, 0.65));
    const rim = new THREE.DirectionalLight(0x8fb6d8, 0.42);
    rim.position.set(-1, 0.55, -0.8);
    scene.add(rim);
    // Decay 0: an orrery is lit like an instrument on a bench. The lamp still
    // sets the direction that models every world, but a body four orbits out
    // must not fall to a silhouette.
    this.starLight = new THREE.PointLight(0xffe3b4, 2.4, 0, 0);
    scene.add(this.starLight);

    // Ecliptic plate: the instrument's face.
    const plateMat = this.track(new THREE.MeshBasicMaterial({
      map: this.textures.plate, transparent: true, opacity: 0.7,
      depthWrite: false, side: THREE.DoubleSide,
    }));
    const plateGeo = this.track(new THREE.PlaneGeometry(1, 1));
    this.plate = new THREE.Mesh(plateGeo, plateMat);
    this.plate.rotation.x = -Math.PI / 2;
    this.plate.position.y = -0.02;
    this.plate.renderOrder = -2;
    scene.add(this.plate);

    // A far, dim field. Depth cue only — the orrery is the subject.
    const count = 620;
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    const rng = makeRng(90210);
    for (let i = 0; i < count; i += 1) {
      const th = rng.range(0, TAU);
      const ph = Math.acos(rng.range(-1, 1));
      const r = rng.range(250, 400);
      pos[i * 3] = Math.sin(ph) * Math.cos(th) * r;
      pos[i * 3 + 1] = Math.cos(ph) * r * 0.75;
      pos[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * r;
      const w = rng.range(0.28, 0.85);
      col[i * 3] = w; col[i * 3 + 1] = w * 0.97; col[i * 3 + 2] = w * 0.86;
    }
    const starGeo = this.track(new THREE.BufferGeometry());
    starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    starGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const starMat = this.track(new THREE.PointsMaterial({
      size: 1.5, sizeAttenuation: true, vertexColors: true,
      transparent: true, opacity: 0.7, depthWrite: false, fog: false,
    }));
    scene.add(new THREE.Points(starGeo, starMat));
  }

  buildProbe() {
    this.probe = buildProbe();
    this.probe.visible = false;
    this.scene.add(this.probe);

    const flameMat = this.track(new THREE.SpriteMaterial({
      map: this.textures.glowWarm, color: 0xffcf8a,
      transparent: true, opacity: 0, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false,
    }));
    this.flame = new THREE.Sprite(flameMat);
    this.flame.scale.setScalar(1.5);
    this.probe.add(this.flame);
    this.flame.position.x = -0.4;

    const markMat = this.track(new THREE.SpriteMaterial({
      map: this.textures.glowPatina, color: 0x9ff0dc,
      transparent: true, opacity: 0.78, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false,
    }));
    this.probeHalo = new THREE.Sprite(markMat);
    this.probeHalo.scale.setScalar(3.6);
    this.scene.add(this.probeHalo);
    this.probeHalo.visible = false;
  }

  /** The plotted course: a pencil line with the navigator's dots along it. */
  buildRibbon() {
    const geo = this.track(new THREE.BufferGeometry());
    this.ribbonPos = new Float32Array(RIBBON_MAX * 3);
    this.ribbonCol = new Float32Array(RIBBON_MAX * 3);
    geo.setAttribute("position", new THREE.BufferAttribute(this.ribbonPos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute("color", new THREE.BufferAttribute(this.ribbonCol, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setDrawRange(0, 0);
    this.ribbonGeo = geo;

    const lineMat = this.track(new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false, fog: false,
    }));
    this.ribbonLine = new THREE.Line(geo, lineMat);
    this.ribbonLine.frustumCulled = false;
    this.scene.add(this.ribbonLine);

    // Screen-space dots: the navigator's pencil marks stay legible whether you
    // are looking at the whole orrery or one moon.
    const dotMat = this.track(new THREE.PointsMaterial({
      map: this.textures.dot, size: 5, sizeAttenuation: false, vertexColors: true,
      transparent: true, opacity: 0.95, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false,
    }));
    this.ribbonDots = new THREE.Points(geo, dotMat);
    this.ribbonDots.frustumCulled = false;
    this.scene.add(this.ribbonDots);

    // Where the plotted course ends: impact, capture or the edge of the dark.
    const endMat = this.track(new THREE.SpriteMaterial({
      map: this.textures.glowPatina, transparent: true, opacity: 0,
      depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    }));
    this.ribbonEnd = new THREE.Sprite(endMat);
    this.ribbonEnd.scale.setScalar(2.4);
    this.scene.add(this.ribbonEnd);
  }

  /**
   * The postmaster's plot: the launch the generator flew itself before the
   * contract shipped. Drawn dashed and dim so it never competes with the live
   * course — it is a route on paper, not a promise about where you are going.
   */
  buildPlot() {
    const geo = this.track(new THREE.BufferGeometry());
    this.plotPos = new Float32Array(PLOT_MAX * 3);
    geo.setAttribute("position", new THREE.BufferAttribute(this.plotPos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setDrawRange(0, 0);
    this.plotGeo = geo;

    const mat = this.track(new THREE.LineDashedMaterial({
      color: COLOR.brass, transparent: true, opacity: 0.42,
      depthWrite: false, fog: false, dashSize: 0.7, gapSize: 0.5,
    }));
    this.plotLine = new THREE.Line(geo, mat);
    this.plotLine.frustumCulled = false;
    this.plotLine.visible = false;
    this.scene.add(this.plotLine);
  }

  /** `path` is the witness sample list: [x, y, z, t] per entry. */
  setPlot(path, visible) {
    const on = Boolean(visible) && Array.isArray(path) && path.length > 1;
    this.plotLine.visible = on;
    if (!on) {
      this.plotGeo.setDrawRange(0, 0);
      return 0;
    }
    const n = Math.min(path.length, PLOT_MAX);
    for (let i = 0; i < n; i += 1) {
      const p = path[i];
      this.plotPos[i * 3] = p[0];
      this.plotPos[i * 3 + 1] = p[1];
      this.plotPos[i * 3 + 2] = p[2];
    }
    this.plotGeo.setDrawRange(0, n);
    this.plotGeo.attributes.position.needsUpdate = true;
    this.plotGeo.computeBoundingSphere();
    this.plotLine.computeLineDistances();
    return n;
  }

  /** The burn vector, drawn off the probe like a set square. */
  buildAim() {
    const geo = this.track(new THREE.BufferGeometry());
    this.aimPos = new Float32Array(6);
    geo.setAttribute("position", new THREE.BufferAttribute(this.aimPos, 3).setUsage(THREE.DynamicDrawUsage));
    const mat = this.track(new THREE.LineBasicMaterial({
      color: COLOR.brass, transparent: true, opacity: 0.95, depthWrite: false, fog: false,
    }));
    this.aimLine = new THREE.Line(geo, mat);
    this.aimLine.frustumCulled = false;
    this.aimLine.visible = false;
    this.scene.add(this.aimLine);

    const headGeo = this.track(new THREE.ConeGeometry(0.17, 0.5, 10));
    const headMat = this.track(new THREE.MeshBasicMaterial({ color: COLOR.brassBright, fog: false }));
    this.aimHead = new THREE.Mesh(headGeo, headMat);
    this.aimHead.visible = false;
    this.scene.add(this.aimHead);
  }

  /* -- Per-contract construction ---------------------------------------- */

  loadContract(contract) {
    this.unloadContract();
    const root = new THREE.Group();
    this.contractRoot = root;
    this.scene.add(root);
    this.contract = contract;

    const sys = contract.sys;
    this.bodyNodes = [];
    let extent = 12;

    for (let i = 0; i < sys.count; i += 1) {
      const b = sys.bodies[i];
      const node = { body: b, group: new THREE.Group(), orbitAnchor: null };
      root.add(node.group);

      if (b.kind === "star") {
        const geo = new THREE.IcosahedronGeometry(b.radius, 3);
        const mat = new THREE.MeshBasicMaterial({ color: b.color, fog: false });
        node.mesh = new THREE.Mesh(geo, mat);
        node.group.add(node.mesh);
        node.disposables = [geo, mat];

        // A filament lamp in a cage of brass meridians.
        // The cage sits around the light source, so without a little emissive
        // of its own every meridian reads as a black wire across the lamp.
        const cageMat = new THREE.MeshStandardMaterial({
          color: 0xb98c45, metalness: 0.95, roughness: 0.32,
          emissive: 0x6b4d1c, emissiveIntensity: 0.9,
        });
        node.disposables.push(cageMat);
        for (let m = 0; m < 4; m += 1) {
          const ringGeo = new THREE.TorusGeometry(b.radius * 1.22, b.radius * 0.026, 6, 40);
          node.disposables.push(ringGeo);
          const ring = new THREE.Mesh(ringGeo, cageMat);
          ring.rotation.y = (m / 4) * Math.PI;
          ring.rotation.x = Math.PI / 2;
          node.group.add(ring);
        }
        const equatorGeo = new THREE.TorusGeometry(b.radius * 1.3, b.radius * 0.034, 6, 48);
        node.disposables.push(equatorGeo);
        node.group.add(new THREE.Mesh(equatorGeo, cageMat));

        const glowMat = new THREE.SpriteMaterial({
          map: this.textures.glowWarm, color: 0xffe0aa, transparent: true,
          opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
        });
        node.disposables.push(glowMat);
        const glow = new THREE.Sprite(glowMat);
        glow.scale.setScalar(b.radius * 9);
        node.group.add(glow);
        node.glow = glow;
      } else if (b.kind === "gas") {
        const geo = gasGeometry(b.radius, 1000 + i * 37);
        const mat = new THREE.MeshStandardMaterial({
          color: b.color, vertexColors: true, metalness: 0.05, roughness: 0.82,
        });
        node.mesh = new THREE.Mesh(geo, mat);
        node.group.add(node.mesh);
        node.disposables = [geo, mat];

        if (b.hasRing) {
          const inner = b.radius * 1.5, outer = b.radius * 2.35;
          const ringGeo = new THREE.RingGeometry(inner, outer, 72, 3);
          // Carve a Cassini-style gap straight into the vertex colours.
          const rpos = ringGeo.attributes.position;
          const rcol = new Float32Array(rpos.count * 3);
          for (let k = 0; k < rpos.count; k += 1) {
            const rr = Math.hypot(rpos.getX(k), rpos.getY(k));
            const f = (rr - inner) / (outer - inner);
            const gap = Math.abs(f - 0.52) < 0.075 ? 0.12 : 1;
            const band = 0.62 + 0.38 * Math.sin(f * 17);
            const v = band * gap;
            rcol[k * 3] = v; rcol[k * 3 + 1] = v * 0.93; rcol[k * 3 + 2] = v * 0.78;
          }
          ringGeo.setAttribute("color", new THREE.BufferAttribute(rcol, 3));
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0xd9be8e, vertexColors: true, transparent: true, opacity: 0.55,
            side: THREE.DoubleSide, depthWrite: false,
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = -Math.PI / 2 + 0.14;
          node.group.add(ring);
          node.disposables.push(ringGeo, ringMat);
        }
      } else {
        const geo = rockGeometry(b.radius, 2000 + i * 53, b.kind === "moon" ? 1 : 2);
        const mat = new THREE.MeshStandardMaterial({
          color: b.color, metalness: 0.12, roughness: 0.92, flatShading: true,
        });
        node.mesh = new THREE.Mesh(geo, mat);
        node.group.add(node.mesh);
        node.disposables = [geo, mat];
      }

      // The engraved orbit: this is the armature the world rides on.
      if (b.orbit) {
        const anchor = new THREE.Group();
        root.add(anchor);
        node.orbitAnchor = anchor;
        const segs = 220;
        const pts = new Float32Array((segs + 1) * 3);
        const tmp = new Float64Array(3);
        for (let k = 0; k <= segs; k += 1) {
          const fake = { ...b.orbit, M0: (k / segs) * TAU, n: 0 };
          orbitPosition(fake, 0, tmp, 0);
          pts[k * 3] = tmp[0]; pts[k * 3 + 1] = tmp[1]; pts[k * 3 + 2] = tmp[2];
        }
        const og = new THREE.BufferGeometry();
        og.setAttribute("position", new THREE.BufferAttribute(pts, 3));
        const isMoon = b.kind === "moon";
        const om = new THREE.LineBasicMaterial({
          color: isMoon ? 0x8f9fb0 : COLOR.ivory,
          transparent: true, opacity: isMoon ? 0.22 : 0.3, depthWrite: false, fog: false,
        });
        anchor.add(new THREE.Line(og, om));
        node.disposables.push(og, om);
        extent = Math.max(extent, b.orbit.a * (1 + b.orbit.e) + (b.parent >= 0 ? 20 : 0));
      }

      this.bodyNodes.push(node);
    }

    // Brass arms from the primary out to each world — the orrery's linkage.
    const armCount = sys.count;
    const armPos = new Float32Array(armCount * 6);
    const armGeo = new THREE.BufferGeometry();
    armGeo.setAttribute("position", new THREE.BufferAttribute(armPos, 3).setUsage(THREE.DynamicDrawUsage));
    const armMat = new THREE.LineBasicMaterial({
      color: COLOR.brassDim, transparent: true, opacity: 0.34, depthWrite: false, fog: false,
    });
    this.arms = new THREE.LineSegments(armGeo, armMat);
    this.arms.frustumCulled = false;
    this.armPos = armPos;
    root.add(this.arms);
    this.armDisposables = [armGeo, armMat];

    // Mail buoys.
    this.beaconNodes = contract.beacons.map((b) => {
      const mesh = buildBeaconMesh();
      mesh.position.set(b.x, b.y, b.z);
      root.add(mesh);
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: this.textures.glowPatina, color: 0x8fe8d6, transparent: true,
        opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      }));
      halo.scale.setScalar(3.1);
      mesh.add(halo);
      return { mesh, halo, data: b };
    });

    // The approach sphere at the destination: two engraved hoops.
    const capGroup = new THREE.Group();
    const capMat = new THREE.MeshBasicMaterial({
      color: COLOR.patina, transparent: true, opacity: 0.34, depthWrite: false, fog: false,
    });
    for (let i = 0; i < 2; i += 1) {
      const g = new THREE.TorusGeometry(contract.capRadius, contract.capRadius * 0.012, 5, 90);
      const m = new THREE.Mesh(g, capMat);
      m.rotation.x = i === 0 ? Math.PI / 2 : 0;
      capGroup.add(m);
      this.armDisposables.push(g);
    }
    this.armDisposables.push(capMat);
    root.add(capGroup);
    this.captureRing = capGroup;

    // The mail mast at the departure world.
    const mastMat = new THREE.MeshStandardMaterial({ color: 0xd7b477, metalness: 0.9, roughness: 0.3 });
    const mastGeo = new THREE.CylinderGeometry(0.02, 0.05, 1, 6);
    const mast = new THREE.Mesh(mastGeo, mastMat);
    root.add(mast);
    this.mast = mast;
    this.armDisposables.push(mastGeo, mastMat);

    // Frame the route, not the whole orrery. An outer world nobody is visiting
    // should not push the destination down to a speck.
    const depOrbit = sys.bodies[contract.departure].orbit;
    const destBody = sys.bodies[contract.dest];
    const destOrbit = destBody.parent >= 0 ? sys.bodies[destBody.parent].orbit : destBody.orbit;
    const reach = (o) => (o ? o.a * (1 + o.e) : 12);
    this.extent = Math.max(reach(depOrbit), reach(destOrbit)) * 1.3;
    this.systemExtent = extent;
    // Size the plate to the framed route so its graduated rim lands just past
    // the visible edge instead of somewhere out in the dark.
    this.plate.scale.setScalar(this.extent * 2.05);
    this.starLight.distance = 0;
    this.probe.visible = true;
    this.probeHalo.visible = true;

    // How much of its own working the contract is willing to show.
    this.setPlot(contract.witness.path, contract.assist === "full");
  }

  unloadContract() {
    this.setPlot(null, false);
    if (!this.contractRoot) return;
    for (const node of this.bodyNodes) {
      for (const d of node.disposables || []) d.dispose();
    }
    for (const d of this.armDisposables || []) d.dispose();
    for (const b of this.beaconNodes) {
      b.mesh.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
    }
    this.scene.remove(this.contractRoot);
    this.contractRoot = null;
    this.bodyNodes = [];
    this.beaconNodes = [];
    this.armDisposables = [];
  }

  /* -- Per-frame --------------------------------------------------------- */

  syncBodies(t) {
    const sys = this.contract.sys;
    const states = sys.states(t);
    for (let i = 0; i < this.bodyNodes.length; i += 1) {
      const node = this.bodyNodes[i];
      const o = i * 6;
      node.group.position.set(states[o], states[o + 1], states[o + 2]);
      if (node.mesh && node.body.kind !== "star") {
        node.mesh.rotation.y = t * (0.16 + node.body.seedPhase * 0.2);
      }
      if (node.orbitAnchor) {
        const p = node.body.parent;
        if (p >= 0) node.orbitAnchor.position.set(states[p * 6], states[p * 6 + 1], states[p * 6 + 2]);
      }
      if (node.body.kind === "star") this.starLight.position.set(states[o], states[o + 1], states[o + 2]);
      const a = i * 6;
      const p = node.body.parent;
      this.armPos[a] = p >= 0 ? states[p * 6] : 0;
      this.armPos[a + 1] = p >= 0 ? states[p * 6 + 1] : 0;
      this.armPos[a + 2] = p >= 0 ? states[p * 6 + 2] : 0;
      this.armPos[a + 3] = states[o];
      this.armPos[a + 4] = states[o + 1];
      this.armPos[a + 5] = states[o + 2];
    }
    this.arms.geometry.attributes.position.needsUpdate = true;

    const d = this.contract.dest * 6;
    this.captureRing.position.set(states[d], states[d + 1], states[d + 2]);
  }

  setRibbon(points, count, outcome) {
    const tint = outcome === OUTCOME.CAPTURED ? [0.50, 0.84, 0.77]
      : outcome === OUTCOME.IMPACT || outcome === OUTCOME.STAR ? [0.89, 0.38, 0.25]
        : outcome === OUTCOME.ESCAPED ? [0.62, 0.66, 0.78]
          : outcome === OUTCOME.TIMEOUT ? [0.88, 0.50, 0.24]
            : [0.79, 0.63, 0.35];
    const n = Math.min(count, RIBBON_MAX);
    for (let i = 0; i < n; i += 1) {
      this.ribbonPos[i * 3] = points[i * 3];
      this.ribbonPos[i * 3 + 1] = points[i * 3 + 1];
      this.ribbonPos[i * 3 + 2] = points[i * 3 + 2];
      const f = 1 - i / Math.max(1, n - 1);
      const w = 0.18 + 0.82 * f * f;
      this.ribbonCol[i * 3] = tint[0] * w;
      this.ribbonCol[i * 3 + 1] = tint[1] * w;
      this.ribbonCol[i * 3 + 2] = tint[2] * w;
    }
    this.ribbonGeo.setDrawRange(0, n);
    this.ribbonGeo.attributes.position.needsUpdate = true;
    this.ribbonGeo.attributes.color.needsUpdate = true;
    this.ribbonGeo.computeBoundingSphere();

    if (n > 1) {
      this.ribbonEnd.position.set(points[(n - 1) * 3], points[(n - 1) * 3 + 1], points[(n - 1) * 3 + 2]);
      this.ribbonEnd.material.color.setRGB(tint[0], tint[1], tint[2]);
      this.ribbonEnd.material.opacity = outcome === OUTCOME.FLYING ? 0.25 : 0.8;
    } else {
      this.ribbonEnd.material.opacity = 0;
    }
  }

  setAim(origin, dir, magnitude, visible) {
    this.aimLine.visible = visible;
    this.aimHead.visible = visible;
    if (!visible) return;
    const len = 1.2 + magnitude * 0.62;
    this.aimPos[0] = origin.x; this.aimPos[1] = origin.y; this.aimPos[2] = origin.z;
    this.aimPos[3] = origin.x + dir.x * len;
    this.aimPos[4] = origin.y + dir.y * len;
    this.aimPos[5] = origin.z + dir.z * len;
    this.aimLine.geometry.attributes.position.needsUpdate = true;
    this.aimHead.position.set(this.aimPos[3], this.aimPos[4], this.aimPos[5]);
    this.aimHead.quaternion.setFromUnitVectors(AIM_UP, dir);
  }

  updateCamera(probePos, dt) {
    const wide = this.extent * 2.15;
    const dist = clamp(wide / this.zoom, 5, 300);
    const blend = clamp((this.zoom - 1) / 2.6, 0, 0.82);
    this.focus.set(0, 0, 0).lerp(probePos, blend);
    this.target.lerp(this.focus, reducedMotion ? 1 : clamp(dt * 4.5, 0, 1));

    // Worlds are drawn true to their collision radius, so the probe and the
    // buoys — which are metres, not megametres — get a floor on screen size.
    // Without it the thing you are actually flying is a single pixel.
    this.readableGain = clamp(dist / 26, 2.8, 6.5);

    const ce = Math.cos(this.elevation), se = Math.sin(this.elevation);
    this.camera.position.set(
      this.target.x + Math.cos(this.azimuth) * ce * dist,
      this.target.y + se * dist,
      this.target.z + Math.sin(this.azimuth) * ce * dist,
    );
    this.camera.lookAt(this.target);
    this.camera.far = Math.max(620, dist * 3.5);
    this.camera.updateProjectionMatrix();
  }

  resize() {
    const w = this.canvas.clientWidth || window.innerWidth;
    const h = this.canvas.clientHeight || window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, this.dprCap);
    this.renderer.setPixelRatio(dpr);
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / Math.max(1, h);
    this.camera.updateProjectionMatrix();
    this.dpr = dpr;
  }

  render() { this.renderer.render(this.scene, this.camera); }

  diagnostics() {
    const info = this.renderer.info;
    let meshes = 0, instanced = 0;
    const materials = new Set();
    this.scene.traverse((o) => {
      if (o.isInstancedMesh) instanced += 1;
      if (o.isMesh || o.isLine || o.isPoints || o.isSprite) meshes += 1;
      if (o.material) materials.add(o.material.uuid);
    });
    return {
      renderer: {
        calls: info.render.calls,
        triangles: info.render.triangles,
        geometries: info.memory.geometries,
        textures: info.memory.textures,
      },
      scene: { meshes, materials: materials.size, instancedMeshes: instanced },
      settings: { dpr: this.dpr, shadows: this.renderer.shadowMap.enabled, postPasses: this.postPasses },
    };
  }
}
/* ============================================================================
   7. SOUND
   An instrument room, not a warning panel. The bed is a slow chord progression
   in the contract's own key, voiced in fifths so it stays modal whatever the
   orrery hands it, floating in a procedurally built reverb. Every voice is
   struck and released with an envelope: nothing here holds a continuous tone or
   slides in pitch, because that is what turns a soundtrack into interference.
   ========================================================================== */

const BASE_HZ = 196;   // the untuned root, before a contract supplies its own

// Root, fifth, octave, twelfth. No thirds, so a chord cannot be the wrong
// quality for whatever mode the orrery's periods happen to imply.
const PAD_VOICING = [0, 7, 12, 19];
// i · VI · III · VII, the natural-minor loop ambient music has always run on.
const PROGRESSION = [0, 8, 3, 10];

class PostAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    // Major pentatonic on the untuned root, until a contract supplies its own.
    this.degrees = [0, 2, 4, 7, 9, 12];
    this.root = BASE_HZ;
    this.scale = this.degrees.map((d) => BASE_HZ * Math.pow(2, d / 12));
    this.started = false;
    this.musicOn = false;
    this.ambience = 0;
  }

  ensure() {
    if (this.ctx) {
      if (this.ctx.state === "suspended") this.ctx.resume();
      return this.ctx;
    }
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    const ctx = new Ctor();
    this.ctx = ctx;

    this.master = ctx.createGain();
    this.master.gain.value = 0.9;
    // A gentle limiter, so a burn landing on top of a chord change cannot stack
    // into the clipping that made the old mix sound broken.
    this.limiter = ctx.createDynamicsCompressor();
    this.limiter.threshold.value = -12;
    this.limiter.knee.value = 18;
    this.limiter.ratio.value = 6;
    this.limiter.attack.value = 0.006;
    this.limiter.release.value = 0.22;
    this.master.connect(this.limiter);
    this.limiter.connect(ctx.destination);

    this.bus = ctx.createGain();
    this.bus.gain.value = this.muted ? 0 : 1;
    this.bus.connect(this.master);

    this.buildReverb();
    this.buildNoise();
    this.buildBeds();
    return ctx;
  }

  /**
   * A reverb, built rather than loaded: decaying noise is a perfectly good
   * impulse response, and it is the single thing that makes a handful of
   * oscillators sound like a room instead of a test tone.
   */
  buildReverb() {
    const ctx = this.ctx;
    const seconds = 3.4;
    const len = Math.floor(ctx.sampleRate * seconds);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c += 1) {
      const data = ir.getChannelData(c);
      for (let i = 0; i < len; i += 1) {
        const t = i / len;
        // Squared-ish decay, with the first few milliseconds pulled down so the
        // tail blooms instead of slapping.
        const bloom = Math.min(1, i / (ctx.sampleRate * 0.02));
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * bloom;
      }
    }
    const convolver = ctx.createConvolver();
    convolver.buffer = ir;
    const wet = ctx.createGain();
    wet.gain.value = 0.9;
    convolver.connect(wet);
    wet.connect(this.bus);

    // Everything that wants space sends here instead of connecting dry.
    this.send = ctx.createGain();
    this.send.gain.value = 1;
    this.send.connect(convolver);
    this.reverb = convolver;
  }

  buildNoise() {
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * 2.5);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i += 1) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.028 * white) / 1.028;   // gently browned
      data[i] = last * 3.2;
    }
    this.noise = buf;
  }

  /**
   * The two continuous layers. Both are noise through a filter rather than an
   * oscillator, so when they move they sound like air moving, not like a tone
   * drifting out of tune.
   */
  buildBeds() {
    const ctx = this.ctx;

    // Pad bus: where the chord progression lands.
    this.padGain = ctx.createGain();
    this.padGain.gain.value = 0;
    this.padFilter = ctx.createBiquadFilter();
    this.padFilter.type = "lowpass";
    this.padFilter.frequency.value = 900;
    this.padFilter.Q.value = 0.6;
    this.padGain.connect(this.padFilter);
    this.padFilter.connect(this.bus);
    const padSend = ctx.createGain();
    padSend.gain.value = 0.5;
    this.padFilter.connect(padSend);
    padSend.connect(this.send);

    // Proximity: the well the probe is falling through, as moving air. The old
    // voice was a sine sliding through two octaves, which is the definition of
    // a hum.
    const wind = ctx.createBufferSource();
    wind.buffer = this.noise;
    wind.loop = true;
    const windFilter = ctx.createBiquadFilter();
    windFilter.type = "lowpass";
    windFilter.frequency.value = 220;
    windFilter.Q.value = 0.8;
    const windGain = ctx.createGain();
    windGain.gain.value = 0;
    wind.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(this.bus);
    wind.start();
    this.windGain = windGain;
    this.windFilter = windFilter;

    this.warnLevel = 0;
    this.warnRate = 0;
    this.nextWarn = 0;
    this.nextChord = 0;
    this.chordIndex = 0;
  }

  /**
   * Fold orbital period ratios into one octave. That is the contract's key.
   *
   * The ratios themselves are irrational, so taking them literally gives a set
   * of arbitrary microtones and the figure played over it is not a melody. Each
   * ratio is therefore snapped to the nearest equal-tempered semitone: a system
   * near 3:2 still sings a fifth, which was always the point, but nothing lands
   * forty cents flat of anything. Degrees that collide are pushed outward so a
   * system with clustered periods still gets distinct notes to play.
   */
  tuneTo(contract) {
    const periods = contract.sys.bodies
      .filter((b) => b.orbit && b.kind !== "moon" && b.kind !== "star")
      .map((b) => b.orbit.period)
      .sort((a, b) => a - b);
    if (periods.length === 0) return;
    const base = BASE_HZ;
    const degrees = [0];
    for (let i = 1; i < periods.length; i += 1) {
      let r = periods[i] / periods[0];
      while (r >= 2) r /= 2;
      while (r < 1) r *= 2;
      let d = clamp(Math.round(Math.log2(r) * 12), 1, 11);
      while (degrees.includes(d) && d < 11) d += 1;
      while (degrees.includes(d) && d > 1) d -= 1;
      if (!degrees.includes(d)) degrees.push(d);
    }
    degrees.push(12);
    this.degrees = degrees.slice().sort((a, b) => a - b);
    this.scale = this.degrees.map((d) => base * Math.pow(2, d / 12));
    this.root = base * (periods[0] > 26 ? 0.5 : 1);
  }

  setMuted(muted) {
    this.muted = muted;
    if (this.bus) this.bus.gain.setTargetAtTime(muted ? 0 : 1, this.ctx.currentTime, 0.04);
  }

  setAmbience(level) {
    if (!this.ctx) return;
    this.ambience = level;
    this.padGain.gain.setTargetAtTime(level * 0.5, this.ctx.currentTime, 1.4);
  }

  /** |a| of the probe, as air rather than as a tone. Deep wells breathe harder. */
  setProximity(accel) {
    if (!this.ctx) return;
    const f = clamp(Math.log10(1 + accel * 6) / 1.5, 0, 1);
    const now = this.ctx.currentTime;
    this.windGain.gain.setTargetAtTime(f * f * 0.16, now, 0.25);
    this.windFilter.frequency.setTargetAtTime(180 + f * 520, now, 0.3);
  }

  /** Struck, not gated. The clock running down should read as a bell, not a fault. */
  setWarning(level, rate) {
    this.warnLevel = level;
    this.warnRate = rate;
  }

  /* -- Voices ------------------------------------------------------------- */

  burst({ freq = 180, dur = 0.4, gain = 0.4, bp = 700, q = 1.1, sweep = 0.4 }) {
    const ctx = this.ensure();
    if (!ctx) return;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = 0.8 + Math.random() * 0.4;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = bp;
    filter.Q.value = q;
    const g = ctx.createGain();
    const now = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    filter.frequency.exponentialRampToValueAtTime(Math.max(60, bp * sweep), now + dur);
    src.connect(filter); filter.connect(g); g.connect(this.bus);
    g.connect(this.send);
    src.start(now);
    src.stop(now + dur + 0.05);

    const thump = ctx.createOscillator();
    thump.type = "sine";
    thump.frequency.setValueAtTime(freq, now);
    thump.frequency.exponentialRampToValueAtTime(freq * 0.42, now + dur * 0.8);
    const tg = ctx.createGain();
    tg.gain.setValueAtTime(0.0001, now);
    tg.gain.exponentialRampToValueAtTime(gain * 0.7, now + 0.02);
    tg.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    thump.connect(tg); tg.connect(this.bus);
    thump.start(now); thump.stop(now + dur + 0.05);
  }

  tone(freq, { dur = 0.5, gain = 0.16, type = "triangle", delay = 0, detune = 0, decay = 0.7, attack = 0.014, space = 0.5 } = {}) {
    const ctx = this.ensure();
    if (!ctx) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur * decay + 0.05);
    osc.connect(g);
    g.connect(this.bus);
    if (space > 0) {
      const s = ctx.createGain();
      s.gain.value = space;
      g.connect(s);
      s.connect(this.send);
    }
    osc.start(now); osc.stop(now + dur + 0.08);
  }

  /** A struck bell, tuned to the contract's own scale. */
  bell(index, gain = 0.2) {
    const f = this.scale[index % this.scale.length] * (index >= this.scale.length ? 2 : 1);
    this.tone(f, { dur: 2.2, gain, type: "sine", decay: 0.85, space: 0.8 });
    this.tone(f * 2, { dur: 1.2, gain: gain * 0.45, type: "sine", space: 0.7 });
    this.tone(f * 3.01, { dur: 0.6, gain: gain * 0.18, type: "sine", space: 0.6 });
  }

  /**
   * One chord of the bed. Each note is a pair four cents apart — the standard
   * way to make a pad breathe — struck with a two-second swell and released
   * into the tail, so chords overlap rather than switch.
   */
  voiceChord(rootHz, at, dur) {
    const ctx = this.ensure();
    if (!ctx) return;
    for (let v = 0; v < PAD_VOICING.length; v += 1) {
      const f = rootHz * Math.pow(2, PAD_VOICING[v] / 12);
      if (f > 2200) continue;
      const level = 0.16 / (1 + v * 0.55);
      for (const cents of [-4, 4]) {
        const osc = ctx.createOscillator();
        osc.type = v === 0 ? "sine" : "triangle";
        osc.frequency.value = f;
        osc.detune.value = cents;
        // Swell in, hold most of the way, release into the next chord's swell.
        // The hold has to outlast the following attack or the bed breathes out
        // to silence between chords.
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(level, at + 1.4);
        g.gain.setValueAtTime(level, at + dur * 0.74);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(g);
        g.connect(this.padGain);
        osc.start(at);
        osc.stop(at + dur + 0.1);
      }
    }
  }

  /**
   * The bed. Its key is the contract's orbital ratios and its pace is the
   * destination's year, so every orrery drifts through a progression only it
   * could play.
   */
  startMusic(periodSeconds) {
    const ctx = this.ensure();
    if (!ctx) return;
    this.musicOn = true;
    this.beat = clamp(periodSeconds / 10, 1.1, 3.4);
    this.nextChord = ctx.currentTime + 0.2;
    this.nextNote = ctx.currentTime + 2.4;
    this.chordIndex = 0;
    this.noteIndex = 0;
  }

  stopMusic() { this.musicOn = false; }

  /** Called every frame; schedules a little ahead of the clock. */
  playMusic() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    this.serviceWarning(now);
    if (!this.musicOn) return;

    const chordDur = this.beat * 3;
    let guard = 0;
    while (this.nextChord < now + 0.5 && guard < 4) {
      const step = PROGRESSION[this.chordIndex % PROGRESSION.length];
      this.voiceChord(this.root * Math.pow(2, (step - 12) / 12), this.nextChord, chordDur * 1.5);
      this.nextChord += chordDur;
      this.chordIndex += 1;
      guard += 1;
    }

    // A sparse line over the top, from the orrery's own degrees.
    const figure = [4, 2, 5, 3, 6, 2, 4, 1];
    guard = 0;
    while (this.nextNote < now + 0.5 && guard < 4) {
      const i = this.noteIndex;
      if (i % 3 !== 2) {
        const step = figure[i % figure.length] % this.scale.length;
        const octave = i % 8 >= 4 ? 2 : 1;
        this.tone(this.scale[step] * octave, {
          dur: this.beat * 2.4, gain: 0.07, type: "sine",
          delay: Math.max(0, this.nextNote - now), decay: 0.8, attack: 0.09, space: 0.9,
        });
      }
      this.nextNote += this.beat;
      this.noteIndex += 1;
      guard += 1;
    }
  }

  /** Discrete strikes whose spacing tightens as the contract runs out. */
  serviceWarning(now) {
    if (this.warnLevel <= 0.001) { this.nextWarn = 0; return; }
    if (this.nextWarn === 0) this.nextWarn = now;
    const gap = clamp(1.9 - this.warnRate * 0.055, 0.42, 1.9);
    let guard = 0;
    while (this.nextWarn < now + 0.25 && guard < 4) {
      this.tone(this.root * 1.5, {
        dur: 0.55, gain: 0.055 + this.warnLevel * 0.05, type: "triangle",
        delay: Math.max(0, this.nextWarn - now), decay: 0.5, space: 0.5,
      });
      this.nextWarn += gap;
      guard += 1;
    }
  }

  thrust(magnitude) {
    const m = clamp(magnitude / 5, 0.15, 1.4);
    this.burst({ freq: 90 + m * 40, dur: 0.28 + m * 0.4, gain: 0.2 + m * 0.32, bp: 420 + m * 620, q: 0.9, sweep: 0.3 });
  }

  click(up = true) {
    this.burst({ freq: up ? 640 : 480, dur: 0.05, gain: 0.09, bp: up ? 2400 : 1500, q: 4, sweep: 0.8 });
  }

  captured() {
    const s = this.scale;
    for (let i = 0; i < 5; i += 1) {
      const f = s[i % s.length] * (i >= s.length ? 2 : 1);
      this.tone(f, { dur: 2.4, gain: 0.15, type: "sine", delay: i * 0.16, decay: 0.9, space: 0.9 });
      this.tone(f * 2, { dur: 1.1, gain: 0.055, type: "sine", delay: i * 0.16, space: 0.8 });
    }
    this.voiceChord(this.root, this.ctx.currentTime, 6);
  }

  lost(kind) {
    const root = kind === "star" ? this.root : kind === "escape" ? this.root * 0.5 : this.root * 0.75;
    for (let i = 0; i < 3; i += 1) {
      this.tone(root * Math.pow(2, -i / 12), {
        dur: 2.6, gain: 0.1, type: "triangle", delay: i * 0.18, decay: 0.9, space: 0.9,
      });
    }
    this.burst({ freq: root * 0.5, dur: 1.4, gain: 0.16, bp: 380, q: 0.7, sweep: 0.2 });
  }

  dispose() {
    if (!this.ctx) return;
    try { this.ctx.close(); } catch { /* already gone */ }
    this.ctx = null;
  }
}

// The basin a contract is graded on is a couple of degrees wide. Aim has to be
// able to resolve it: coarse for getting there, fine for landing inside it.
const AIM_RATE = 0.7;   // rad/s of heading under a held key
// Measured: the set of launches that deliver is tens of degrees wide in heading
// but only about a quarter of a Δv wide in magnitude. At 1.2/s that was a fifth
// of a second of keypress for the whole window, which is not a control.
const DV_RATE = 0.6;    // Δv/s of burn magnitude under a held key

/** Heading as the dial reads it: prograde at 0, the brake at either end. */
function signedDeg(heading) {
  return ((((heading * 180) / Math.PI + 180) % 360) + 360) % 360 - 180;
}

/**
 * Two of the 360 degrees actually matter, and nothing in the game said so:
 * heading 0 is the accelerator and 180 is the brake. Everything else is a
 * cross-track nudge.
 */
function headingWord(deg) {
  const a = Math.abs(deg);
  if (a <= 25) return "prograde — adds speed";
  if (a >= 155) return "retrograde — the brake";
  return "across the track";
}

    this.flashUntil = 0;
    this.keys = new Set();
    this.pointer = { aiming: false, orbiting: false, x: 0, y: 0 };
    this.result = null;
    this.lastFrame = performance.now();

    this.bindInput();
    this.showTitle();
    this.setHudVisible(false);
    requestAnimationFrame(this.frame);
  }

  /* -- Input ------------------------------------------------------------- */

  bindInput() {
    const canvas = dom.canvas;
    addEventListener("resize", () => this.orrery.resize());

    addEventListener("keydown", (ev) => {
      if (ev.repeat && !["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d", "w", "s", "A", "D", "W", "S"].includes(ev.key)) return;
      const handled = this.onKey(ev.key, ev.shiftKey, true);
      if (handled) ev.preventDefault();
      this.keys.add(ev.key.toLowerCase());
      this.audio.ensure();
    });
    addEventListener("keyup", (ev) => this.keys.delete(ev.key.toLowerCase()));

    canvas.addEventListener("pointerdown", (ev) => {
      this.audio.ensure();
      canvas.setPointerCapture(ev.pointerId);
      if (ev.button === 2 || ev.altKey) {
        this.pointer.orbiting = true;
      } else if (this.canAim()) {
        this.pointer.aiming = true;
        this.aimFromPointer(ev);
      }
      this.pointer.x = ev.clientX; this.pointer.y = ev.clientY;
    });
    canvas.addEventListener("pointermove", (ev) => {
      if (this.pointer.orbiting) {
        // Drag carries the orrery with the pointer, the way every other orbit
        // control in the world behaves.
        this.orrery.azimuth += (ev.clientX - this.pointer.x) * 0.006;
        this.orrery.elevation = clamp(this.orrery.elevation + (ev.clientY - this.pointer.y) * 0.005, 0.22, 1.45);
      } else if (this.pointer.aiming) {
        this.aimFromPointer(ev);
      }
      this.pointer.x = ev.clientX; this.pointer.y = ev.clientY;
    });
    const release = (ev) => {
      this.pointer.aiming = false;
      this.pointer.orbiting = false;
      if (ev.pointerId !== undefined && canvas.hasPointerCapture?.(ev.pointerId)) {
        canvas.releasePointerCapture(ev.pointerId);
      }
    };
    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", release);
    canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
    canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      this.orrery.zoom = clamp(this.orrery.zoom * (ev.deltaY > 0 ? 0.9 : 1.11), 0.55, 9);
    }, { passive: false });

    dom.muteBtn.addEventListener("click", () => this.toggleMute());
  }

  onKey(rawKey, shift, down) {
    const key = rawKey.length === 1 ? rawKey.toLowerCase() : rawKey;
    if (key === "m") { this.toggleMute(); return true; }

    if (this.state === "flight" || this.state === "ready") {
      switch (key) {
        case " ": this.commitBurn(); return true;
        case "h": this.setWarp(this.warpIndex === 0 ? 2 : 0); return true;
        case "g": this.jumpToWindow(); return true;
        case "1": case "2": case "3": case "4": case "5": case "6":
          this.setWarp(Number(key) - 1); return true;
        case "r": this.restartContract(); return true;
        case "p": case "Escape": this.pause(); return true;
        case "q": this.orrery.azimuth += 0.12; return true;
        case "e": this.orrery.azimuth -= 0.12; return true;
        case "z": this.orrery.zoom = clamp(this.orrery.zoom * 0.88, 0.55, 9); return true;
        case "x": this.orrery.zoom = clamp(this.orrery.zoom * 1.14, 0.55, 9); return true;
        default: break;
      }
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d", "w", "s"].includes(key)) return true;
    } else if (key === "Escape" && this.state === "paused") {
      this.resume(); return true;
    }
    return false;
  }

  /**
   * Heading grows anticlockwise on screen — `burnDirection` rotates about +y and
   * the camera looks down on the ecliptic — so "right" has to *decrease* it or
   * the marker swings away from the key you pressed. The pointer never had this
   * problem; it reads the heading back off the world, and it is the reference
   * the keyboard now matches.
   */
  pollHeldKeys(dt) {
    if (!this.canAim()) return;
    const k = this.keys;
    const fine = k.has("shift") ? AIM_FINE : 1;
    let dh = 0, dd = 0;
    if (k.has("arrowleft") || k.has("a")) dh += 1;
    if (k.has("arrowright") || k.has("d")) dh -= 1;
    if (k.has("arrowup") || k.has("w")) dd += 1;
    if (k.has("arrowdown") || k.has("s")) dd -= 1;
    if (dh === 0 && dd === 0) return;
    this.aimHeading = (this.aimHeading + dh * AIM_RATE * fine * dt + TAU) % TAU;
    this.aimDv = clamp(this.aimDv + dd * DV_RATE * fine * dt, 0, this.maxBurn());
    this.ribbonDirty = true;
  }

  aimFromPointer(ev) {
    const rect = dom.canvas.getBoundingClientRect();
    _ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    _ray.setFromCamera(_ndc, this.orrery.camera);
    const origin = this.probePosition(_v3a);
    _plane.setFromNormalAndCoplanarPoint(_UP, origin);
    const hit = _ray.ray.intersectPlane(_plane, _v3b);
    if (!hit) return;
    const dx = hit.x - origin.x, dy = hit.y - origin.y, dz = hit.z - origin.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist < 0.05) return;
    const basis = this.burnBasis();
    const ux = dx / dist, uy = dy / dist, uz = dz / dist;
    const along = ux * basis.u[0] + uy * basis.u[1] + uz * basis.u[2];
    const side = ux * basis.w[0] + uy * basis.w[1] + uz * basis.w[2];
    this.aimHeading = (Math.atan2(side, along) + TAU) % TAU;
    this.aimDv = clamp((dist - 1.2) / 0.62, 0, this.maxBurn());
    this.ribbonDirty = true;
  }

  /* -- Screens ----------------------------------------------------------- */

  setScreen(html) {
    dom.screen.innerHTML = html;
    dom.screen.classList.toggle("on", html !== "");
    dom.screen.querySelectorAll("[data-action]").forEach((node) => {
      node.addEventListener("click", () => {
        this.audio.ensure();
        this.audio.click();
        this.action(node.dataset.action, node.dataset.arg);
      });
    });
  }

  setHudVisible(on) {
    for (const node of dom.hud) node.classList.toggle("hidden", !on);
    if (!on) dom.destTag.classList.remove("on");
  }

  showTitle() {

          mass you spend; Space spends all of it at once; holding Space does nothing.
          The plotted course is not an estimate — it runs the same propagator as live
          flight. If the line says you burn up, you burn up.
        </p>
        <div class="rule"></div>
        <div class="keys">
          <div><span>Aim the burn</span><b>A / D · ← →</b></div>

  showSelect() {
    this.state = "select";
    this.setHudVisible(false);
    const rows = CAMPAIGN.map((spec, i) => {
      const rec = this.records.get(spec.key);
      const grade = rec ? rec.grade : "—";
      return `<button class="contract" data-action="contract" data-arg="${i}" data-done="${rec && rec.done ? 1 : 0}">
        <span class="num">${spec.numeral}</span>

        <span class="grade">${grade}</span>

      <div class="card">

        <div class="actions">
          <button class="act ghost" data-action="title">Back</button>
          <button class="act ghost" data-action="route">Postal route</button>
        </div>
      </div>`);
  }

  showBriefing() {
    const spec = this.currentSpec();
    this.setScreen(`
      <div class="card">
        <p class="eyebrow">Contract ${spec.numeral}</p>
        <h2 class="display">${spec.name}</h2>
        <p class="lede">${spec.brief}</p>
        <div class="plot">
          <div class="msg" id="plotMsg">Casting the orrery</div>
          <div class="bar"><i id="plotBar"></i></div>
        </div>
        <div id="briefBody"></div>
      </div>`);
  }

  showBriefingReady() {
    const c = this.contract;
    const body = document.getElementById("briefBody");

    if (plot) plot.remove();

        <div class="spec"><span class="label">Mail buoys</span><span class="value small">${c.beacons.length}</span></div>
        <div class="spec"><span class="label">From</span><span class="value small display">${c.departName}</span></div>
        <div class="spec"><span class="label">Window</span><span class="value small">${c.grade.name}</span></div>

          : c.assist === "window"
            ? "The route is yours to find. The clock is held at the mast, and <b>G</b> puts it on the launch window."
            : "No line is drawn for this one. The clock is held at the mast until you fire."
      }</p>

        <button class="act" data-action="launch">Take the mast</button>
        <button class="act ghost" data-action="back">Back</button>

    dom.screen.querySelectorAll("[data-action]").forEach((node) => {

      });
