  }

  showResult(win, reason) {
    this.state = win ? "won" : "lost";
    this.setHudVisible(false);
    const c = this.contract;
    const flight = this.launched ? this.simT - this.launchT : 0;
    const nextLabel = this.mode === "route"
      ? "Next route"
      : this.contractIndex < CAMPAIGN.length - 1 ? "Next contract" : "Back to the round";
    const stats = `
      <div class="specs">
        <div class="spec"><span class="label">Flight</span><span class="value small">${flight.toFixed(1)}s</span></div>
        <div class="spec"><span class="label">Mass left</span><span class="value small">${this.fuel.toFixed(2)} Δv</span></div>
        <div class="spec"><span class="label">Buoys</span><span class="value small">${this.collected} / ${c.beacons.length}</span></div>
      </div>`;
    this.setScreen(`
      <div class="card">
        <p class="eyebrow">${win ? "Delivered" : "Contract lost"}</p>
        <h2 class="display">${win ? `The sack reaches ${c.destName}` : reason.title}</h2>
        <p class="lede">${win ? reason.body : reason.body}</p>
        ${stats}
        <div class="actions">
          ${win ? `<button class="act" data-action="next">${nextLabel}</button>` : `<button class="act" data-action="retry">Fly it again</button>`}
          <button class="act ghost" data-action="retry">${win ? "Fly it again" : "Retry"}</button>
          <button class="act ghost" data-action="back">Change contract</button>
        </div>
      </div>`);
  }

  pause() {
    if (this.state !== "flight" && this.state !== "ready") return;
    this.resumeState = this.state;
    this.state = "paused";
    this.setScreen(`
      <div class="card">
        <p class="eyebrow">Held</p>
        <h2 class="display">The clock waits</h2>
        <p class="lede">The orrery keeps its own time, but it will wait for a postman.</p>
        <div class="actions">
          <button class="act" data-action="resume">Resume</button>
          <button class="act ghost" data-action="retry">Restart contract</button>
          <button class="act ghost" data-action="back">Abandon</button>
        </div>
      </div>`);
  }

  resume() {
    this.state = this.resumeState || "flight";
    this.setScreen("");
    this.lastFrame = performance.now();
  }

  /** Leaving a run for any reason silences everything that belonged to it. */
  endRun() {
    this.audio.stopMusic();
    this.audio.setProximity(0);
    this.audio.setWarning(0, 0);
    this.audio.setAmbience(0.25);
  }

  action(name, arg) {
    switch (name) {
      case "campaign": this.endRun(); this.mode = "campaign"; this.showSelect(); break;
      case "route": this.endRun(); this.mode = "route"; this.routeTier = 1; this.startContract(); break;
      case "title": this.endRun(); this.showTitle(); break;
      case "contract": this.mode = "campaign"; this.contractIndex = Number(arg); this.startContract(); break;
      case "launch": this.beginFlight(); break;
      case "back": this.endRun(); this.mode === "route" ? this.showTitle() : this.showSelect(); break;
      case "retry": this.startContract(); break;
      case "resume": this.resume(); break;
      case "next":
        if (this.mode === "route") { this.routeTier += 1; this.routeSeed = (this.routeSeed * 1664525 + 1013904223) >>> 0; this.startContract(); }
        else if (this.contractIndex < CAMPAIGN.length - 1) { this.contractIndex += 1; this.startContract(); }
        else this.showSelect();
        break;
      default: break;
    }
  }

  /* -- Contract lifecycle ------------------------------------------------ */

  currentSpec() {
    return this.mode === "route" ? routeSpec(this.routeTier, this.routeSeed) : CAMPAIGN[this.contractIndex];
  }

  startContract() {
    this.endRun();
    this.state = "briefing";
    this.setHudVisible(false);
    this.showBriefing();
    this.buildAttempt = 0;
    this.builder = buildContract(this.currentSpec(), 0);
    this.buildProgress = 0;
    this.buildMessage = "Casting the orrery";
  }

  pumpBuilder() {
    if (!this.builder) return;
    const budget = performance.now() + 11;
    let step;
    do {
      step = this.builder.next();
      if (step.done) {
        this.builder = null;
        const value = step.value;
        if (!value || value.failed) {
          this.buildAttempt += 1;
          if (this.buildAttempt > 5) {
            this.buildMessage = "No route found — reshuffling";
            this.startContract();
            return;
          }
          this.builder = buildContract(this.currentSpec(), this.buildAttempt);
          return;
        }
        this.onContractReady(value);
        return;
      }
      this.buildProgress = step.value.p;
      this.buildMessage = step.value.msg;
    } while (performance.now() < budget);

    const bar = document.getElementById("plotBar");
    const msg = document.getElementById("plotMsg");
    if (bar) bar.style.width = `${Math.round(this.buildProgress * 100)}%`;
    if (msg) msg.textContent = this.buildMessage;
  }

  onContractReady(contract) {
    this.contract = contract;
    this.orrery.loadContract(contract);
    this.audio.tuneTo(contract);
    const rec = this.records.get(contract.spec.key) || { done: false };
    rec.grade = contract.grade.name;
    rec.basin = contract.basin;
    this.records.set(contract.spec.key, rec);
    this.state = "ready-brief";
    this.showBriefingReady();
    this.resetRun();
    this.audio.bell(0, 0.12);
  }

  resetRun() {
    const c = this.contract;
    this.simT = 0;
    this.accum = 0;
    this.launched = false;
    this.launchT = 0;
    this.fuel = c.fuel;
    this.collected = 0;
    // The clock is held at the mast. The departure world used to orbit away
    // while a new player was still working out what W and S did, which made the
    // first burn a panic instead of a decision.
    this.warpIndex = 0;
    this.adjudicated = false;
    this.coached = 0;
    this.aimHeading = 0;
    this.aimDv = clamp(c.witness.dv * 0.75, 0, this.maxBurn());
    for (const b of c.beacons) b.taken = false;
    for (const node of this.orrery.beaconNodes) {
      node.mesh.visible = true;
      node.data.taken = false;
    }
    this.probeState = null;
    this.ribbonDirty = true;
    this.result = null;
    this.orrery.zoom = 1;
    this.orrery.azimuth = -0.62;
    this.orrery.elevation = 0.95;
  }

  beginFlight() {
    this.state = "ready";
    this.setScreen("");
    this.setHudVisible(true);
    this.lastFrame = performance.now();
    this.ribbonDirty = true;
    this.audio.setAmbience(1);
    const destOrbit = this.contract.sys.bodies[this.contract.dest].orbit;
    this.audio.startMusic(destOrbit ? destOrbit.period : 24);
    if (this.contract.assist === "full") {
      this.coach(1, "The clock is held", "W and S set the burn, Space spends it. Or press G to load the plot.");
    } else {
      this.banner(this.contract.destName, `Capture under ${this.contract.capSpeed.toFixed(2)} Δv`);
    }
  }

  restartContract() {
    this.resetRun();
    this.state = "ready";
    this.setScreen("");
    this.setHudVisible(true);
    this.audio.click(false);
  }

  /* -- Flight ------------------------------------------------------------ */

  /** Aiming is only honest while a burn is still committable. */
  canAim() {
    return (this.state === "ready" || this.state === "flight") && this.fuel > MIN_BURN;
  }

  /**
   * The mast will not release a sack with nothing held back for arrival. A
   * launch could previously spend the whole tank in one press, which strands
   * the probe before it has learnt anything — the reserve is a fraction of what
   * you carry, not a hint at what the route costs.
   */
  maxBurn() {
    if (!this.launched) return launchCap(this.fuel);
    return Math.min(this.fuel, 6);
  }

  /**
   * Put the clock on the plotted launch window. Before launch the simulation
   * time is only a parameter — every body is solved analytically from it — so
   * this is scrubbing a dial, not fast-forwarding a simulation. Without it a
   * missed window would mean rebuilding the whole contract to try again.
   */
  jumpToWindow() {
    const c = this.contract;
    if (!c || this.launched || c.assist === "none") return false;
    this.simT = c.witness.t0;
    this.accum = 0;
    this.warpIndex = 0;
    // With the whole route drawn for you, withholding the two numbers that
    // drew it is not difficulty, it is a guessing game. Load the plotted burn
    // and let the gauges show what it looks like; Space is still yours.
    if (c.assist === "full") {
      this.aimHeading = (c.witness.heading + TAU) % TAU;
      this.aimDv = clamp(c.witness.dv, 0, this.maxBurn());
    }
    this.ribbonDirty = true;
    this.audio.click(true);
    this.banner(
      c.assist === "full" ? "Plot loaded" : "Window",
      c.assist === "full" ? "Aim and burn set. Space fires it." : "The clock is on the plotted launch",
    );
    return true;
  }

  /** Prograde basis at the probe (or at the mast, before launch). */
  burnBasis() {
    const c = this.contract;
    const u = _basisU, w = _basisW;
    let vx, vy, vz;
    if (this.launched && this.probeState) {
      vx = this.probeState.vx; vy = this.probeState.vy; vz = this.probeState.vz;
      if (Math.hypot(vx, vy, vz) < 1e-6) { vx = 1; vy = 0; vz = 0; }
    } else {
      c.sys.bodyState(c.departure, this.simT, _bs);
      vx = _bs[3]; vy = _bs[4]; vz = _bs[5];
    }
    burnDirection(vx, vy, vz, 0, u);
    burnDirection(vx, vy, vz, Math.PI / 2, w);
    return { u, w };
  }

  aimDirection(out) {
    const c = this.contract;
    let vx, vy, vz;
    if (this.launched && this.probeState) {
      vx = this.probeState.vx; vy = this.probeState.vy; vz = this.probeState.vz;
    } else {
      c.sys.bodyState(c.departure, this.simT, _bs);
      vx = _bs[3]; vy = _bs[4]; vz = _bs[5];
    }
    return burnDirection(vx, vy, vz, this.aimHeading, out);
  }

  probePosition(out) {
    if (this.launched && this.probeState) {
      return out.set(this.probeState.x, this.probeState.y, this.probeState.z);
    }
    mastPosition(this.contract.sys, this.contract.departure, this.simT, _mast);
    return out.set(_mast[0], _mast[1], _mast[2]);
  }

  currentProbeState() {
    if (this.launched && this.probeState) return this.probeState;
    const c = this.contract;
    return launchState(c.sys, c.departure, this.simT, 0, 0);
  }

  commitBurn() {
    if (!this.canAim() || this.aimDv <= MIN_BURN) return;
    const c = this.contract;
    const dv = Math.min(this.aimDv, this.fuel);
    const dir = this.aimDirection(_burnDir);

    if (!this.launched) {
      this.probeState = launchState(c.sys, c.departure, this.simT, this.aimHeading, dv);
      this.launched = true;
      this.launchT = this.simT;
      this.state = "flight";
      // The mast holds the clock; leaving it starts it again.
      if (WARPS[this.warpIndex] === 0) this.warpIndex = 2;
      this.banner("Away", `${dv.toFixed(2)} Δv spent`);
      this.coach(2, "That was the whole burn", "Instant. The teal line is where you now go.");
    } else {
      this.probeState.vx += dir[0] * dv;
      this.probeState.vy += dir[1] * dv;
      this.probeState.vz += dir[2] * dv;
      primeState(c.sys, this.probeState);
      this.banner("Correction", `${dv.toFixed(2)} Δv spent`);
    }

    this.fuel = Math.max(0, this.fuel - dv);
    // Spending the charge empties it. Carrying it over left the plotted course
    // showing a correction the player had not asked for and could not see they
    // were still holding — the line stopped being where they were going.
    this.aimDv = 0;
    this.burnFlash = 0.32;
    this.audio.thrust(dv);
    this.ribbonDirty = true;
  }

  setWarp(index) {
    this.warpIndex = clamp(index, 0, WARPS.length - 1);
    this.audio.click(this.warpIndex > 2);
  }

  stepSimulation(dt) {
    const c = this.contract;
    const warp = WARPS[this.warpIndex];
    this.accum += dt * warp;
    let steps = Math.floor(this.accum / SIM_DT);
    if (steps <= 0) return;
    this.accum -= steps * SIM_DT;
    steps = Math.min(steps, 48);
    this.advanceBy(steps * SIM_DT);
  }

  /** Advance simulation time by an exact span, handling every outcome. */
  advanceBy(duration) {
    if (duration <= 0) return;
    const c = this.contract;

    if (!this.launched) {
      this.simT += duration;
      this.ribbonDirty = true;
      return;
    }

    const before = this.collected;
    const run = propagate(c.sys, this.probeState, {
      duration,
      dest: c.dest,
      capture: { radius: c.capRadius, speed: c.capSpeed },
      beacons: c.beacons,
      collectedStart: this.collected,
      stopOnEvent: true,
      onBeacon: (index) => this.onBeacon(index),
    });
    this.collected = run.collected;
    this.simT = this.probeState.t;
    if (this.collected !== before) this.ribbonDirty = true;

    if (run.outcome === OUTCOME.CAPTURED) {
      if (this.collected >= c.beacons.length) this.win();
      else this.lose({ title: "Short sack", body: `You reached ${c.destName} without the whole round. The postmaster counts before signing.` }, "short");
      return;
    }
    if (run.outcome === OUTCOME.STAR) {
      this.lose({ title: "Into the lamp", body: "The post went into the light. Nothing came out." }, "star");
      return;
    }
    if (run.outcome === OUTCOME.IMPACT) {
      const name = c.sys.bodies[run.body].name;
      this.lose({ title: `Down on ${name}`, body: `Arrival is not the same as capture. You met ${name} at speed.` }, "impact");
      return;
    }
    if (run.outcome === OUTCOME.ESCAPED) {
      this.lose({ title: "Out past the rules", body: "The orrery ends somewhere. You are past it, and still accelerating away." }, "escape");
      return;
    }
    if (this.simT - this.launchT > c.timeLimit) {
      this.lose({ title: "The chime went", body: "The contract expired while you were still in transit. Mail has a schedule." }, "time");
      return;
    }

    // `aimDv` is clamped to at most the fuel, and `commitBurn` rejects anything
    // at or under MIN_BURN, so this is exactly the point where no legal burn
    // remains — not merely the point where one stops being worth much.
    if (this.fuel <= MIN_BURN && !this.adjudicated) this.adjudicate();
  }

  /**
   * With the tank dry the run is already decided — nothing the player can do
   * changes where the probe goes. Rather than make them watch a ballistic arc
   * crawl out to the escape radius, settle it now: the same propagator, run to
   * the deadline, is the same answer they would have got by waiting.
   *
   * A course that still delivers is left alone. Watching it land is the point.
   */
  adjudicate() {
    const c = this.contract;
    this.adjudicated = true;
    const remaining = c.timeLimit - (this.simT - this.launchT);
    if (remaining <= 0) return;

    const s = cloneProbe(this.probeState);
    const trial = c.beacons.filter((b) => !b.taken).map((b) => ({ x: b.x, y: b.y, z: b.z, r: b.r, taken: false }));
    const run = propagate(c.sys, s, {
      duration: remaining,
      dest: c.dest,
      capture: { radius: c.capRadius, speed: c.capSpeed },
      beacons: trial,
      stopOnEvent: true,
    });
    const buoys = this.collected + trial.filter((b) => b.taken).length;
    if (run.outcome === OUTCOME.CAPTURED && buoys >= c.beacons.length) return;

    const dry = "Nothing left to burn — ";
    if (run.outcome === OUTCOME.CAPTURED) {
      this.lose({
        title: "Short sack",
        body: `${dry}this course reaches ${c.destName} with ${buoys} of ${c.beacons.length} buoys aboard. The postmaster counts before signing.`,
      }, "short");
    } else if (run.outcome === OUTCOME.STAR) {
      this.lose({ title: "Into the lamp", body: `${dry}and this course ends in the light.` }, "star");
    } else if (run.outcome === OUTCOME.IMPACT) {
      const name = c.sys.bodies[run.body].name;
      this.lose({ title: `Down on ${name}`, body: `${dry}and ${name} is where this course finishes, at speed.` }, "impact");
    } else if (run.outcome === OUTCOME.ESCAPED) {
      this.lose({ title: "Out past the rules", body: `${dry}and this course leaves the orrery for good.` }, "escape");
    } else {
      this.lose({
        title: "The chime will go",
        body: `${dry}and this course is still in transit when the contract expires.`,
      }, "time");
    }
  }

  onBeacon(index) {
    const node = this.orrery.beaconNodes[index];
    if (node) node.mesh.visible = false;
    this.audio.bell(index + 1, 0.24);
    this.banner("Buoy", `${this.collected + 1} of ${this.contract.beacons.length}`);
    this.flashUntil = performance.now() + 220;
    if (this.collected + 1 >= this.contract.beacons.length) {
      this.coach(4, "Sack complete", `Get inside the hoops under ${this.contract.capSpeed.toFixed(2)} Δv. Aim 180° to slow down.`);
    } else {
      this.coach(3, "Buoy aboard", "Small corrections only — every burn is mass you cannot brake with.");
    }
  }

  /**
   * Coaching, once each and only where the contract admits to being a lesson.
   * `step` is monotonic so a banner never replays after a mid-course burn or a
   * second buoy, and never fires at all once the plot is withdrawn.
   */
  coach(step, big, small) {
    if (!this.contract || this.contract.assist !== "full") return;
    if (this.coached >= step) return;
    this.coached = step;
    this.banner(big, small);
  }

  win() {
    this.result = "won";
    const rec = this.records.get(this.contract.spec.key) || {};
    rec.done = true;
    rec.grade = this.contract.grade.name;
    rec.bestFuel = Math.max(rec.bestFuel || 0, this.fuel);
    this.records.set(this.contract.spec.key, rec);
    this.audio.stopMusic();
    this.audio.captured();
    this.audio.setAmbience(0.3);
    this.showResult(true, {
      body: `Captured inside the approach sphere with ${this.fuel.toFixed(2)} Δv still in the tank. The confirmed route wanted ${this.contract.witness.total.toFixed(2)}.`,
    });
  }

  lose(reason, kind) {
    this.result = "lost";
    this.audio.stopMusic();
    this.audio.lost(kind);
    this.audio.setAmbience(0.25);
    this.audio.setProximity(0);
    this.audio.setWarning(0, 0);
    this.showResult(false, reason);
  }

  /** Where the destination is, and how far off, relative to the probe. */
  destState(out) {
    const c = this.contract;
    c.sys.bodyState(c.dest, this.simT, _bs);
    const p = this.probePosition(_v3c);
    const s = this.launched && this.probeState ? this.probeState : null;
    out.x = _bs[0]; out.y = _bs[1]; out.z = _bs[2];
    out.range = Math.hypot(_bs[0] - p.x, _bs[1] - p.y, _bs[2] - p.z);
    out.rel = s ? Math.hypot(s.vx - _bs[3], s.vy - _bs[4], s.vz - _bs[5]) : Infinity;
    return out;
  }

  /**
   * Tag the destination in the field. The approach hoops move with a world that
   * is often a speck at the far side of the orrery, so without a label there is
   * nothing on screen that says which of five worlds the sack is addressed to.
   */
  updateDestTag(dest) {
    const c = this.contract;
    const cam = this.orrery.camera;
    _v3d.set(dest.x, dest.y, dest.z).project(cam);
    const w = dom.canvas.clientWidth, h = dom.canvas.clientHeight;
    const behind = _v3d.z > 1;
    let x = (_v3d.x * 0.5 + 0.5) * w;
    let y = (-_v3d.y * 0.5 + 0.5) * h;
    if (behind) { x = w - x; y = h - y; }

    // The label hangs above its anchor, and the prediction plate owns the
    // bottom centre, so the keep-out box is not symmetric.
    const padX = 72, padTop = 84, padBottom = 124;
    const cx = clamp(x, padX, Math.max(padX, w - padX));
    const cy = clamp(y, padTop, Math.max(padTop, h - padBottom));
    if (behind || cx !== x || cy !== y) {
      const dx = x - w / 2, dy = y - h / 2;
      const ang = Math.atan2(dy, dx);
      const idx = Math.round((ang + Math.PI) / (Math.PI / 4)) % 8;
      dom.destArrow.textContent = ["←", "↖", "↑", "↗", "→", "↘", "↓", "↙"][idx];
    } else {
      dom.destArrow.textContent = "";
    }
    x = cx; y = cy;

    dom.destTag.style.left = `${x}px`;
    dom.destTag.style.top = `${y}px`;
    dom.destName.textContent = c.destName;
    // The speed limit is the thing that loses runs, so it is quoted the whole
    // way in rather than first appearing once you are already inside the
    // sphere and out of room to do anything about it.
    dom.destRange.textContent = this.launched
      ? dest.range <= c.capRadius
        ? `${dest.rel.toFixed(2)} / ${c.capSpeed.toFixed(2)} Δv`
        : `${dest.range.toFixed(1)} out · sign under ${c.capSpeed.toFixed(2)}`
      : `${dest.range.toFixed(1)} out`;
    dom.destTag.classList.toggle("near", dest.range <= c.capRadius);
    dom.destTag.classList.add("on");
  }

  banner(big, small) {
    dom.banner.querySelector(".big").textContent = big;
    dom.banner.querySelector(".sm").textContent = small;
    dom.banner.classList.add("on");
    clearTimeout(this._bannerTimer);
    this._bannerTimer = setTimeout(() => dom.banner.classList.remove("on"), 1500);
  }

  /* -- Prediction -------------------------------------------------------- */

  recomputeRibbon() {
    const c = this.contract;
    if (!c) return;
    const s = cloneProbe(this.currentProbeState());
    if (this.aimDv > MIN_BURN && this.canAim()) {
      const dir = this.aimDirection(_burnDir);
      const dv = Math.min(this.aimDv, this.fuel);
      s.vx += dir[0] * dv; s.vy += dir[1] * dv; s.vz += dir[2] * dv;
      s.primed = false;
    }
    const trial = c.beacons.filter((b) => !b.taken).map((b) => ({ x: b.x, y: b.y, z: b.z, r: b.r, taken: false }));
    const startT = s.t;   // propagate advances `s` in place, so bank this first

    // The plotted course only means anything if it stops where live flight
    // stops. Past the contract deadline the run is over, so predicting a
    // capture beyond it would promise something the player cannot be given.
    let horizon = PREDICT_HORIZON;
    let cutByDeadline = false;
    if (this.launched) {
      const remaining = c.timeLimit - (this.simT - this.launchT);
      if (remaining < horizon) {
        horizon = Math.max(0, remaining);
        cutByDeadline = true;
      }
    }

    let n = 0;
    const pts = this.ribbonPoints;
    const run = propagate(c.sys, s, {
      duration: horizon,
      dest: c.dest,
      capture: { radius: c.capRadius, speed: c.capSpeed },
      beacons: trial,
      stopOnEvent: true,
      sampleEvery: PREDICT_SAMPLE,
      onSample: (st) => {
        if (n >= RIBBON_MAX) return;
        pts[n * 3] = st.x; pts[n * 3 + 1] = st.y; pts[n * 3 + 2] = st.z;
        n += 1;
      },
    });
    this.ribbonCount = n;
    const outcome = run.outcome === OUTCOME.FLYING && cutByDeadline ? OUTCOME.TIMEOUT : run.outcome;
    this.predicted = {
      outcome,
      body: run.body,
      buoys: this.collected + trial.filter((b) => b.taken).length,
      t: run.t - startT,
      closest: run.closest,
      closestSpeed: run.closestSpeed,
    };
    this.orrery.setRibbon(pts, n, outcome);
    this.ribbonDirty = false;
  }

  /* -- HUD --------------------------------------------------------------- */

  /**
   * What the player is supposed to be doing, in one line, at every moment of a
   * run. The prediction plate says what *will* happen; without this it never
   * says what to *do*, which is the question a first contract raises hardest.
   */
  objectiveLine(dest) {
    const c = this.contract;
    const left = c.beacons.length - this.collected;
    if (!this.launched) {
      // Only a full-assist contract has a brass plot on screen to match. A
      // window contract is given its launch time and nothing else, and telling
      // it to match a line that was never drawn is worse than saying nothing.
      if (c.assist === "full") return "Objective — match the brass plot, then fire";
      if (c.assist === "window") return "Objective — find a launch, then fire in the window";
      return "Objective — plot a launch, then fire";
    }
    if (left > 0) {
      return `Objective — reach buoy ${this.collected + 1} of ${c.beacons.length}`;
    }
    if (dest && dest.range <= c.capRadius) {
      return `Objective — slow to ${c.capSpeed.toFixed(2)}, you are at ${dest.rel.toFixed(2)}`;
    }
    // A course that already arrives slowly enough needs leaving alone, and
    // saying "brake" at a player who is on a winning line is worse than
    // saying nothing.
    if (this.predicted && this.predicted.outcome === OUTCOME.CAPTURED) {
      return `Objective — hold this course into ${c.destName}`;
    }
    return `Objective — brake into ${c.destName} under ${c.capSpeed.toFixed(2)} Δv`;
  }

  /**
   * The launch window. The basin a contract is graded on is measured within
   * BASIN_BOX.t0 of the plotted launch time, so that is exactly the span worth
   * counting down to — and `G` puts the clock there rather than making a missed
   * window mean rebuilding the contract.
   */
  updateWindowCue() {
    const c = this.contract;
    if (!c || c.assist === "none" || this.launched) {
      dom.windowValue.textContent = "";
      dom.windowValue.classList.remove("open");
      return;
    }
    const delta = c.witness.t0 - this.simT;
    const open = Math.abs(delta) <= BASIN_BOX.t0;
    dom.windowValue.textContent = open
      ? "Window open — fire"
      : delta > 0
        ? c.assist === "full"
          ? `Window in ${delta.toFixed(1)}s · G takes the plot`
          : `Window in ${delta.toFixed(1)}s · G jumps to it`
        : c.assist === "full"
          ? "Window passed · G takes the plot"
          : "Window passed · G returns to it";
    dom.windowValue.classList.toggle("open", open);
  }

  /**
   * The charge plate. The burn is one instant impulse whose size W and S set
   * and Space spends — press duration does nothing — so the plate has to read
   * as a trigger being loaded, not as telemetry about a throttle.
   */
  updateBurnPlate() {
    const c = this.contract;
    const canAim = this.canAim();
    const cap = Math.max(this.maxBurn(), 1e-6);
    const charged = canAim && this.aimDv > MIN_BURN;

    dom.burnGauge.firstElementChild.style.width = `${clamp(this.aimDv / cap, 0, 1) * 100}%`;
    dom.burnValue.textContent = !canAim
      ? "Nothing left to burn"
      : charged
        ? `Space fires ${this.aimDv.toFixed(2)} Δv`
        : "Hold W to charge";
    dom.burnValue.classList.toggle("idle", !charged);

    const deg = signedDeg(this.aimHeading);
    dom.aimNeedle.style.left = `${(deg + 180) / 360 * 100}%`;
    dom.aimValue.textContent = canAim ? `Aim ${deg.toFixed(0)}° · ${headingWord(deg)}` : "Aim —";

    // The plot's own launch, ghosted onto both gauges: A/D and W/S now have
    // somewhere to aim at instead of a blind two-dimensional search.
    const ghost = c.assist === "full" && !this.launched && canAim;
    dom.burnTick.classList.toggle("hidden", !ghost);
    dom.aimTick.classList.toggle("hidden", !ghost);
    if (ghost) {
      dom.burnTick.style.left = `${clamp(c.witness.dv / cap, 0, 1) * 100}%`;
      dom.aimTick.style.left = `${(signedDeg(c.witness.heading) + 180) / 360 * 100}%`;
    }
  }

  updateHud(dest) {
    const c = this.contract;
    if (!c) return;
    dom.contractName.textContent = c.spec.name;
    dom.contractLine.textContent = `${c.departName} → ${c.destName} · ${c.grade.name}`;

    const flight = this.launched ? this.simT - this.launchT : 0;
    dom.clockValue.innerHTML = this.launched
      ? `${flight.toFixed(1)}<span style="font-size:11px;color:var(--ivory-dim)">s</span>`
      : `—`;
    const left = clamp(1 - flight / c.timeLimit, 0, 1);
    dom.clockGauge.firstElementChild.style.width = `${left * 100}%`;
    dom.clockGauge.classList.toggle("warn", left < 0.25);
    dom.warpValue.textContent = WARPS[this.warpIndex] === 0 ? "Held" : `×${WARPS[this.warpIndex]}`;
    this.updateWindowCue();

    dom.fuelValue.textContent = this.fuel.toFixed(2);
    const fuelFrac = clamp(this.fuel / c.fuel, 0, 1);
    dom.fuelGauge.firstElementChild.style.width = `${fuelFrac * 100}%`;
    dom.fuelGauge.classList.toggle("warn", fuelFrac < 0.22);
    this.updateBurnPlate();

    dom.cargoValue.textContent = `${this.collected} / ${c.beacons.length}`;
    if (dom.cargoBeads.childElementCount !== c.beacons.length) {
      dom.cargoBeads.innerHTML = c.beacons.map(() => `<span class="bead"></span>`).join("");
    }
    const beads = dom.cargoBeads.children;
    for (let i = 0; i < beads.length; i += 1) beads[i].classList.toggle("on", c.beacons[i].taken);

    dom.objective.textContent = this.objectiveLine(dest);

    const p = this.predicted;
    if (!p) return;

    // The whole job, in one number: what this course costs to stop against
    // what is left to stop with. It used to be printed only while coasting,
    // which is precisely not the state a player is stuck in on approach —
    // there it read "Deadline", in red, one small burn away from a win.
    const cost = Number.isFinite(p.closestSpeed) ? p.closestSpeed : null;
    const affordable = cost !== null && cost <= this.fuel;
    const stopLine = cost === null
      ? `No approach to ${c.destName} inside ${PREDICT_HORIZON}s.`
      : `Closest pass: ${cost.toFixed(2)} Δv to match ${c.destName}, ${this.fuel.toFixed(2)} left.`;

    let text = "Coasting", tone = "warn", sub = "";
    if (p.outcome === OUTCOME.CAPTURED) {
      const full = p.buoys >= c.beacons.length;
      text = full ? `Capture · ${c.destName}` : `Capture · ${p.buoys}/${c.beacons.length} buoys`;
      tone = full ? "ok" : "bad";
      sub = full ? `In ${p.t.toFixed(1)}s. Sack complete.` : "Short sack — the postmaster counts.";
    } else if (p.outcome === OUTCOME.IMPACT) {
      text = `Impact · ${c.sys.bodies[p.body].name}`;
      tone = "bad";
      sub = `In ${p.t.toFixed(1)}s at speed.`;
    } else if (p.outcome === OUTCOME.STAR) {
      text = "Into the lamp"; tone = "bad"; sub = `In ${p.t.toFixed(1)}s.`;
    } else if (p.outcome === OUTCOME.ESCAPED) {
      text = "Escape"; tone = "bad"; sub = "This course leaves the orrery.";
    } else {
      // Coasting and Deadline are the same situation — a course that has not
      // resolved — so they say the same useful thing. Only the clock differs.
      const held = this.collected >= c.beacons.length;
      text = held ? `Sack aboard · brake to ${c.destName}` : `Coasting · ${p.buoys}/${c.beacons.length} buoys`;
      tone = affordable ? "warn" : "bad";
      sub = p.outcome === OUTCOME.TIMEOUT
        ? `${stopLine} Chime in ${p.t.toFixed(1)}s.`
        : stopLine;
    }

    // Inside the sphere, the speed limit is the only thing left to fly.
    if (dest && this.launched && dest.range <= c.capRadius && p.outcome !== OUTCOME.CAPTURED) {
      text = `Inside the sphere · ${c.destName}`;
      tone = dest.rel < c.capSpeed ? "ok" : "warn";
      sub = `Relative speed ${dest.rel.toFixed(2)} — the postmaster signs under ${c.capSpeed.toFixed(2)}.`;
    }

    dom.predictText.textContent = text;
    dom.predictText.className = tone;
    dom.predictSub.textContent = sub;
  }

  toggleMute() {
    this.audio.ensure();
    this.audio.setMuted(!this.audio.muted);
    dom.muteBtn.textContent = this.audio.muted ? "Sound off" : "Sound on";
    dom.muteBtn.setAttribute("aria-pressed", String(this.audio.muted));
  }

  /* -- Frame ------------------------------------------------------------- */

  frame = (now) => {
    requestAnimationFrame(this.frame);
    const dt = Math.min(0.05, (now - this.lastFrame) / 1000);
    this.lastFrame = now;
    this.frameIndex += 1;

    if (this.builder) this.pumpBuilder();
    this.audio.playMusic();

    if (this.state === "ready" || this.state === "flight") {
      this.pollHeldKeys(dt);
      this.stepSimulation(dt);
    }

    if (this.contract) {
      const live = this.state !== "briefing";
      if (live) this.orrery.syncBodies(this.simT);

      const probePos = this.probePosition(_v3a);
      this.orrery.probe.position.copy(probePos);
      this.orrery.probeHalo.position.copy(probePos);

      // Point the hull along motion; before launch, along the pending burn.
      const dir = this.aimDirection(_aimDir);
      if (this.launched && this.probeState) {
        const sp = Math.hypot(this.probeState.vx, this.probeState.vy, this.probeState.vz) || 1;
        _v3b.set(this.probeState.vx / sp, this.probeState.vy / sp, this.probeState.vz / sp);
      } else {
        _v3b.set(dir[0], dir[1], dir[2]);
      }
      this.orrery.probe.quaternion.setFromUnitVectors(_AXIS_X, _v3b);

      // The mast rides the departure world until you leave it.
      mastPosition(this.contract.sys, this.contract.departure, this.simT, _mast);
      this.orrery.mast.position.set(_mast[0], _mast[1], _mast[2]);
      this.orrery.mast.visible = !this.launched;

      const aiming = this.canAim() && this.aimDv > MIN_BURN;
      this.orrery.setAim(probePos, _v3b.set(dir[0], dir[1], dir[2]), this.aimDv, aiming);

      this.burnFlash = Math.max(0, (this.burnFlash || 0) - dt * 2.6);
      this.orrery.flame.material.opacity = this.burnFlash;
      this.orrery.flame.scale.setScalar(1.1 + this.burnFlash * 3.4);

      if (this.ribbonDirty || (this.state === "flight" && this.frameIndex % 6 === 0)) {
        this.recomputeRibbon();
      }

      const gain = this.orrery.readableGain || 2;
      this.orrery.probe.scale.setScalar(gain);
      this.orrery.probeHalo.scale.setScalar(gain * 2.3);
      // The buoy you are actually flying to is bigger and beats faster than the
      // ones behind it, so "what next" has an answer in the field and not only
      // in the prediction plate.
      const nextBuoy = this.contract.beacons.findIndex((b) => !b.taken);
      for (let i = 0; i < this.orrery.beaconNodes.length; i += 1) {
        const node = this.orrery.beaconNodes[i];
        const next = i === nextBuoy;
        node.mesh.scale.setScalar(gain * (next ? 1.25 : 0.85));
        const core = node.mesh.getObjectByName("core");
        if (core) core.rotation.y += dt * (next ? 2.1 : 0.9);
        node.halo.material.opacity = next
          ? 0.62 + Math.sin(now * 0.006 + node.data.x) * 0.24
          : 0.28 + Math.sin(now * 0.0025 + node.data.x) * 0.1;
      }
      // The approach sphere is the target, so it pulses like one — brighter,
      // and brighter still once the probe is inside it.
      const dest = this.destState(_destState);
      const inside = dest.range <= this.contract.capRadius;
      const pulse = (inside ? 0.62 : 0.42) + Math.sin(now * 0.0022) * 0.16;
      for (const child of this.orrery.captureRing.children) child.material.opacity = pulse;

      this.orrery.updateCamera(probePos, dt);

      // Flight voices belong to a flight. Pausing, abandoning or finishing a
      // run must not leave the probe still growling under a menu.
      const flying = this.state === "ready" || this.state === "flight";
      if (flying && this.launched && this.probeState) {
        this.audio.setProximity(Math.hypot(this.probeState.ax, this.probeState.ay, this.probeState.az));
        const left = clamp(1 - (this.simT - this.launchT) / this.contract.timeLimit, 0, 1);
        this.audio.setWarning(left < 0.22 ? (0.22 - left) * 4 : 0, (1 - left) * 26);
      } else {
        this.audio.setProximity(0);
        this.audio.setWarning(0, 0);
      }

      if (flying) {
        this.updateDestTag(dest);
        this.updateHud(dest);
      }
    }

    this.orrery.render();
  };
}
const game = new Game();

/* ============================================================================
   9. TEST SURFACE
   Present only under ?test=1. Normal play exposes nothing.
   ========================================================================== */

if (isTest) {
  const specFor = (index) => CAMPAIGN[clamp(index, 0, CAMPAIGN.length - 1)];

  function loadCampaign(index) {
    game.mode = "campaign";
    game.contractIndex = clamp(index, 0, CAMPAIGN.length - 1);
    const contract = buildContractSync(specFor(index));
    if (!contract) throw new Error(`no witness for campaign contract ${index}`);
    game.builder = null;
    game.contract = contract;
    game.orrery.loadContract(contract);
    game.audio.tuneTo(contract);
    game.resetRun();
    game.state = "ready";
    game.setScreen("");
    game.setHudVisible(true);
    game.recomputeRibbon();
    game.updateHud();
    return contract;
  }

  function loadRoute(tier, seed) {
    game.mode = "route";
    game.routeTier = tier;
    game.routeSeed = seed >>> 0;
    const contract = buildContractSync(routeSpec(tier, seed >>> 0));
    if (!contract) throw new Error(`no witness for route tier ${tier} seed ${seed}`);
    game.builder = null;
    game.contract = contract;
    game.orrery.loadContract(contract);
    game.resetRun();
    game.state = "ready";
    game.setScreen("");
    game.setHudVisible(true);
    game.recomputeRibbon();
    game.updateHud();
    return contract;
  }

  /** Null relative motion against the destination, charged to the tank. */
  function brakeOntoDestination() {
    const c = game.contract;
    const s = game.probeState;
    if (!s) return 0;
    c.sys.bodyState(c.dest, s.t, _bs);
    const rvx = s.vx - _bs[3], rvy = s.vy - _bs[4], rvz = s.vz - _bs[5];
    const rel = Math.hypot(rvx, rvy, rvz);
    if (rel <= 1e-6) return 0;
    const dv = Math.min(rel, game.fuel);
    s.vx -= (rvx / rel) * dv; s.vy -= (rvy / rel) * dv; s.vz -= (rvz / rel) * dv;
    game.fuel = Math.max(0, game.fuel - dv);
    primeState(c.sys, s);
    return dv;
  }

  function runReport() {
    return {
      state: game.state,
      result: game.result,
      collected: game.collected,
      buoys: game.contract.beacons.length,
      fuelLeft: game.fuel,
      flight: game.simT - game.launchT,
    };
  }

  /** Fly the generator's own witness. This is the solvability proof, executed. */
  function replayWitness(stopFraction = 1) {
    const w = game.contract.witness;
    game.resetRun();
    game.simT = w.t0;
    game.aimHeading = w.heading;
    game.aimDv = w.dv;
    game.commitBurn();

    const target = w.t0 + w.flight * stopFraction;
    let guard = 0;
    while (game.simT < target && game.state === "flight" && guard < 4000) {
      game.advanceBy(Math.min(0.25, target - game.simT));
      guard += 1;
    }

    if (stopFraction >= 1 && game.state === "flight") {
      brakeOntoDestination();
      game.advanceBy(SIM_DT * 2);
    }
    game.ribbonDirty = true;
    return runReport();
  }

  /**
   * A guided but imprecise player: launch off the plot by the given heading,
   * magnitude and clock errors, fly the route, and brake the moment the
   * approach sphere is entered. This is the question the graded basin does not
   * answer — the basin box is ±3° wide, and a person reading a dial off a HUD
   * is not that accurate. What survives here is what the contract really costs.
   */
  function flySloppy(dHeadingDeg = 0, dDv = 0, dT = 0) {
    const c = game.contract;
    const w = c.witness;
    game.resetRun();
    // A previous run may have settled into won/lost, and `canAim` refuses to
    // commit a burn from there. Put the probe back on the mast properly.
    game.state = "ready";
    game.setScreen("");
    game.simT = Math.max(0, w.t0 + dT);
    game.aimHeading = (w.heading + (dHeadingDeg * Math.PI) / 180 + TAU) % TAU;
    game.aimDv = clamp(w.dv + dDv, 0, game.maxBurn());
    game.commitBurn();

    let guard = 0;
    let braked = false;
    while (game.state === "flight" && guard < 8000) {
      game.advanceBy(SIM_DT * 4);
      guard += 1;
      if (braked) continue;
      const d = game.destState(_destState);
      if (d.range <= c.capRadius) {
        brakeOntoDestination();
        braked = true;
      }
    }
    return { ...runReport(), braked, dHeadingDeg, dDv, dT };
  }

  function advance(seconds) {
    let left = seconds;
    let guard = 0;
    while (left > 1e-9 && guard < 20000) {
      if (game.state !== "flight" && game.state !== "ready") break;
      const chunk = Math.min(0.5, left);
      game.advanceBy(chunk);
      left -= chunk;
      guard += 1;
    }
    if (game.contract) {
      game.orrery.syncBodies(game.simT);
      game.recomputeRibbon();
      game.updateHud();
    }
    return snapshot();
  }

  /**
   * Two independent questions about the propagator:
   *  selfConsistency — does the ribbon match live flight? (it is the same code)
   *  refinementError — does the propagator match itself at four times the
   *                    resolution? This is the honest accuracy figure.
   *  energyDrift     — specific orbital energy over a long two-body coast.
   */
  function integrationAudit(seconds = 24) {
    const c = game.contract;
    const start = cloneProbe(game.currentProbeState());

    const whole = cloneProbe(start);
    propagate(c.sys, whole, { duration: seconds, stopOnEvent: false });

    const chunked = cloneProbe(start);
    for (let i = 0; i < 12; i += 1) {
      propagate(c.sys, chunked, { duration: seconds / 12, stopOnEvent: false });
    }
    const selfConsistency = Math.hypot(whole.x - chunked.x, whole.y - chunked.y, whole.z - chunked.z);

    const fine = cloneProbe(start);
    propagate(c.sys, fine, { duration: seconds, dt: SIM_DT / 4, stopOnEvent: false });
    const refinementError = Math.hypot(whole.x - fine.x, whole.y - fine.y, whole.z - fine.z);
    const arc = Math.hypot(whole.x - start.x, whole.y - start.y, whole.z - start.z);

    // Isolated two-body coast: one fixed primary, one probe, no perturbers.
    const solo = new System([{
      name: "Test", kind: "star", mu: G_STAR, radius: 1.0,
      parent: -1, orbit: null, fixed: [0, 0, 0], color: 0xffffff, seedPhase: 0,
    }]);
    const r0 = 18;
    const v0 = Math.sqrt(G_STAR / r0) * 1.18;      // a healthy ellipse, not a circle
    const p = makeProbeState(r0, 0, 0, 0, 0, v0, 0);
    const energy = (st) => {
      const r = Math.hypot(st.x, st.y, st.z);
      return (st.vx * st.vx + st.vy * st.vy + st.vz * st.vz) / 2 - G_STAR / r;
    };
    const e0 = energy(p);
    propagate(solo, p, { duration: 320, stopOnEvent: false });
    const e1 = energy(p);

    return {
      seconds,
      arcLength: arc,
      selfConsistency,
      refinementError,
      refinementRelative: arc > 0 ? refinementError / arc : 0,
      energyDrift: Math.abs((e1 - e0) / e0),
      orbits: 320 / (TAU * Math.sqrt(Math.pow(1 / (2 / r0 - (v0 * v0) / G_STAR), 3) / G_STAR)),
    };
  }

  function difficultyTable() {
    return CAMPAIGN.map((spec) => {
      const c = buildContractSync(spec);
      if (!c) return { key: spec.key, failed: true };
      return {
        key: spec.key,
        name: spec.name,
        seed: c.seed,
        basin: c.basin,
        grade: c.grade.name,
        fuel: c.fuel,
        witnessTotal: c.witness.total,
        flight: c.witness.flight,
        buoys: c.beacons.length,
        dest: c.destName,
        destKind: c.sys.bodies[c.dest].kind,
        bodies: c.sys.count,
        timeLimit: c.timeLimit,
        capSpeed: c.capSpeed,
        capRadius: c.capRadius,
        beaconRadius: c.beacons.length ? c.beacons[0].r : 0,
        assist: c.assist,
      };
    });
  }

  /**
   * Where the burn marker points *on screen*, in degrees anticlockwise from
   * screen-right. This is the thing the player actually sees, so it is the
   * thing the control-sense test has to assert against.
   */
  function aimScreenAngle() {
    if (!game.contract) return null;
    // Place the camera the way the next frame would. Loading a contract and
    // reading back in the same turn otherwise samples an unplaced camera, and
    // every heading projects onto a screen axis that does not exist yet.
    const probe = game.probePosition(new THREE.Vector3());
    game.orrery.updateCamera(probe, 0);
    const cam = game.orrery.camera;
    cam.updateMatrixWorld(true);
    const dir = game.aimDirection(new Float64Array(3));
    const v = new THREE.Vector3(dir[0], dir[1], dir[2]);
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    return Math.atan2(v.dot(up), v.dot(right)) * 180 / Math.PI;
  }

  function snapshot() {
    const c = game.contract;
    const s = game.launched ? game.probeState : null;
    const bodies = [];
    if (c) {
      const st = c.sys.states(game.simT);
      for (let i = 0; i < c.sys.count; i += 1) {
        const b = c.sys.bodies[i];
        bodies.push({
          name: b.name, kind: b.kind, radius: b.radius, mu: b.mu,
          x: st[i * 6], y: st[i * 6 + 1], z: st[i * 6 + 2],
          period: b.orbit ? b.orbit.period : 0,
          eccentricity: b.orbit ? b.orbit.e : 0,
        });
      }
    }
    return {
      screen: game.state,
      mode: game.mode,
      simT: game.simT,
      launchT: game.launchT,
      launched: game.launched,
      warp: WARPS[game.warpIndex],
      fuel: game.fuel,
      maxBurn: c ? game.maxBurn() : 0,
      adjudicated: game.adjudicated,
      collected: game.collected,
      result: game.result,
      aim: { heading: game.aimHeading, dv: game.aimDv, screenAngle: aimScreenAngle() },
      contract: c ? {
        key: c.spec.key, name: c.spec.name, seed: c.seed,
        fuel: c.fuel, basin: c.basin, grade: c.grade.name,
        timeLimit: c.timeLimit, capRadius: c.capRadius, capSpeed: c.capSpeed,
        assist: c.assist,
        departName: c.departName, destName: c.destName,
        destKind: c.sys.bodies[c.dest].kind,
        buoys: c.beacons.length,
      } : null,
      witness: c ? {
        t0: c.witness.t0, heading: c.witness.heading, dv: c.witness.dv,
        retro: c.witness.retro, total: c.witness.total, flight: c.witness.flight,
        dest: c.witness.dest,
      } : null,
      probe: s ? {
        x: s.x, y: s.y, z: s.z, vx: s.vx, vy: s.vy, vz: s.vz, t: s.t,
        speed: Math.hypot(s.vx, s.vy, s.vz),
        accel: Math.hypot(s.ax, s.ay, s.az),
      } : null,
      beacons: c ? c.beacons.map((b) => ({ x: b.x, y: b.y, z: b.z, r: b.r, taken: !!b.taken })) : [],
      bodies,
      predicted: game.predicted ? { ...game.predicted } : null,
      ribbonPoints: game.ribbonCount,
      plotPoints: game.orrery.plotLine.visible ? game.orrery.plotGeo.drawRange.count : 0,
      hud: {
        objective: dom.objective.textContent,
        burn: dom.burnValue.textContent,
        aim: dom.aimValue.textContent,
        window: dom.windowValue.textContent,
      },
      environment: {
        artDirection: "antique brass orrery: machined armatures, engraved ivory orbit traces, filament lamp, deep indigo",
        bodyForms: ["cratered icosphere", "banded oblate giant with carved ring gap", "shepherd moon", "caged filament lamp"],
        plottedCourse: "same propagator, same steps as live flight",
        hudPlacement: "edge plates only; the field is never covered",
      },
      audioLayers: game.audio.ctx ? 6 : 0,
      musicOn: Boolean(game.audio.musicOn),
      scale: game.audio.scale.slice(),
      scaleDegrees: game.audio.degrees.slice(),
    };
  }

  window.__PERIHELION_TEST__ = {
    loadCampaign, loadRoute, replayWitness, flySloppy, advance, snapshot,
    integrationAudit, difficultyTable,
    campaign: () => CAMPAIGN.map((s) => ({ key: s.key, name: s.name, seed: s.seed })),
    /** Run the whole pipeline on an arbitrary spec without loading it. */
    buildSpec: (index, overrides = {}) => {
      const base = specFor(index);
      const c = buildContractSync({ ...base, ...overrides, params: { ...base.params, ...(overrides.params || {}) } });
      if (!c) return { failed: true };
      return {
        seed: c.seed, basin: c.basin, grade: c.grade.name, fuel: c.fuel,
        witnessTotal: c.witness.total, flight: c.witness.flight,
        dest: c.destName, destKind: c.sys.bodies[c.dest].kind,
        buoys: c.beacons.length, bodies: c.sys.count, candidates: c.candidates,
        timeLimit: c.timeLimit,
      };
    },
    witness: () => (game.contract ? { ...game.contract.witness, path: undefined } : null),
    basin: () => (game.contract ? game.contract.basin : null),
    aim: (heading, dv) => {
      game.aimHeading = ((heading % TAU) + TAU) % TAU;
      game.aimDv = clamp(dv, 0, game.maxBurn());
      game.ribbonDirty = true;
      game.recomputeRibbon();
      game.updateHud();
      return snapshot();
    },
    burn: () => { game.commitBurn(); game.recomputeRibbon(); game.updateHud(); return snapshot(); },
    jumpToWindow: () => { game.jumpToWindow(); game.recomputeRibbon(); game.updateHud(); return snapshot(); },
    setWarp: (index) => { game.setWarp(index); return snapshot(); },
    /** Shorten the contract deadline so the prediction clamp is reachable. */
    setDeadline: (seconds) => {
      game.contract.timeLimit = seconds;
      game.ribbonDirty = true;
      game.recomputeRibbon();
      return snapshot();
    },
    setZoom: (z) => { game.orrery.zoom = clamp(z, 0.55, 9); return z; },
    predicted: () => game.predicted,
    diagnostics: () => game.orrery.diagnostics(),
  };

  window.__THREE_GAME_TEST_HOOKS__ = {
    seed(seed) {
      game.routeSeed = seed >>> 0;
      game.routeTier = 1;
    },
    setState(state) {
      switch (state) {
        case "title":
          game.showTitle();
          break;
        case "active-play":
          loadCampaign(2);
          replayWitness(0.42);
          game.orrery.zoom = 1.8;
          game.setWarp(2);
          break;
        case "win":
          loadCampaign(0);
          replayWitness(1);
          break;
        case "fail":
          loadCampaign(0);
          game.resetRun();
          game.simT = game.contract.witness.t0;
          game.aimHeading = game.contract.witness.heading + Math.PI;
          game.aimDv = Math.min(game.contract.fuel, 2.6);
          game.commitBurn();
          advance(90);
          if (game.state === "flight") {
            game.lose({ title: "Adrift", body: "Test-forced failure state." }, "time");
          }
          break;
        case "stress":
          loadCampaign(5);
          replayWitness(0.5);
          game.orrery.zoom = 0.6;
          game.setWarp(4);
          break;
        default:
          break;
      }
      if (game.contract) {
        game.orrery.syncBodies(game.simT);
        game.recomputeRibbon();
        game.updateHud();
      }
      game.orrery.render();
      return snapshot();
    },
    advance(seconds) { return advance(seconds); },
    snapshot() { return snapshot(); },
  };

  window.__THREE_GAME_DIAGNOSTICS__ = {
    snapshot() { return game.orrery.diagnostics(); },
  };
}

</script>
