<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perihelion Post — Mail Across the Orrery</title>
<style>
  :root {
    /* Material roles. An antique machined instrument, not a nebula. */
    --void:        #080d1a;   /* atmosphere / background            */
    --void-deep:   #04060e;
    --plate:       #131a2c;   /* world base: instrument plate       */
    --plate-lit:   #1c2438;
    --brass:       #c9a15a;   /* structural secondary: armatures    */
    --brass-bright:#f0d5a0;
    --brass-dim:   #6f5a30;
    --copper:      #b4714a;   /* interactive neutral                */
    --patina:      #7fd7c4;   /* objective / reward: verdigris      */
    --patina-deep: #2c7b70;
    --ivory:       #efe6d2;   /* engraved line work, primary text   */
    --ivory-dim:   #948d7d;
    --lamp:        #ffd9a0;   /* the star: warm filament            */
    --alarm:       #e2603f;   /* hazard / damage                    */
    --rule:        rgba(201,161,90,.22);
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: var(--void-deep);
  }
  body {
    font: 400 14px/1.5 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    color: var(--ivory);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }

  /* ---- Engraved instrument plates. Same material language as the world. ---- */
  .plate {
    position: absolute;
    background:
      linear-gradient(160deg, rgba(28,36,56,.90), rgba(10,14,26,.86));
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 7px 11px;
    box-shadow: 0 1px 0 rgba(240,213,160,.09) inset, 0 6px 18px rgba(0,0,0,.45);
  }
  .label {
    font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--brass); opacity: .82;
  }
  .value { font-size: 17px; letter-spacing: .04em; color: var(--ivory); font-variant-numeric: tabular-nums; }
  .value.small { font-size: 13px; }

  .display {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 400; letter-spacing: .012em;
  }

  /* ---- HUD: hugs the edges, never crosses the field ---- */
  #hudTop    { top: 14px; left: 14px; min-width: 210px; }
  #hudClock  { top: 14px; right: 14px; text-align: right; min-width: 132px; }
  #hudFuel   { bottom: 14px; left: 14px; width: 214px; }
  #hudCargo  { bottom: 14px; right: 14px; text-align: right; min-width: 150px; }
  #hudPredict{ bottom: 14px; left: 50%; transform: translateX(-50%); min-width: 320px; text-align: center; }

  #contractName { margin-top: 1px; }
  #contractLine { font-size: 10px; color: var(--ivory-dim); letter-spacing: .06em; margin-top: 3px; }

  .gauge {
    position: relative; height: 7px; margin: 6px 0 4px;
    background: rgba(4,6,14,.8);
    border: 1px solid rgba(201,161,90,.3);
  }
  .gauge > i {
    position: absolute; inset: 1px auto 1px 1px; display: block;
    background: linear-gradient(90deg, var(--patina-deep), var(--patina));
    transition: width .12s linear;
  }
  .gauge.warn > i { background: linear-gradient(90deg, #8a4527, var(--alarm)); }
  .gauge .tick { position: absolute; top: -3px; bottom: -3px; width: 1px; background: rgba(201,161,90,.45); }

  #predictText { letter-spacing: .1em; text-transform: uppercase; font-size: 12px; }
  #predictText.ok    { color: var(--patina); }
  #predictText.warn  { color: var(--brass-bright); }
  #predictText.bad   { color: var(--alarm); }
  #predictSub { font-size: 10px; color: var(--ivory-dim); letter-spacing: .05em; margin-top: 3px; }

  .beads { display: flex; gap: 5px; justify-content: flex-end; margin-top: 5px; }
  .bead {
    width: 9px; height: 9px; transform: rotate(45deg);
    border: 1px solid var(--patina-deep); background: transparent;
  }
  .bead.on { background: var(--patina); box-shadow: 0 0 7px rgba(127,215,196,.7); border-color: var(--patina); }

  /* ---- Full screens ---- */
  #screen {
    position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none;
  }
  #screen.on { pointer-events: auto; }
  .card {
    /* The play page gives the iframe roughly 544px at a 720px viewport, so
       every screen has to land inside that without a scrollbar. */
    width: min(680px, calc(100vw - 48px));
    max-height: calc(100vh - 26px);
    overflow: auto;
    padding: 20px 30px 18px;
    background: linear-gradient(155deg, rgba(22,29,47,.97), rgba(8,11,22,.97));
    border: 1px solid rgba(201,161,90,.42);
    box-shadow: 0 0 0 1px rgba(4,6,14,.9), 0 26px 70px rgba(0,0,0,.7);
    position: relative;
  }
  /* engraved corner brackets */
  .card::before, .card::after {
    content: ""; position: absolute; width: 22px; height: 22px;
    border-color: var(--brass); border-style: solid; opacity: .75;
  }
  .card::before { left: 7px; top: 7px; border-width: 1px 0 0 1px; }
  .card::after  { right: 7px; bottom: 7px; border-width: 0 1px 1px 0; }

  .eyebrow { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--patina); margin: 0 0 10px; }
  h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: .95; color: var(--brass-bright); font-weight: 400; }
  h1 small { display: block; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--ivory-dim); margin-top: 8px; font-family: ui-monospace, Consolas, monospace; }
  h2 { margin: 0 0 3px; font-size: 23px; font-weight: 400; color: var(--brass-bright); }
  .lede { color: var(--ivory-dim); font-size: 12.5px; line-height: 1.55; margin: 11px 0 0; }
  .rule { height: 1px; margin: 13px 0; background: linear-gradient(90deg, transparent, var(--brass-dim) 18%, var(--brass-dim) 82%, transparent); }

  .specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 0; }
  .spec { border-left: 1px solid var(--rule); padding-left: 9px; }
  .spec .label { display: block; margin-bottom: 2px; }

  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px 18px; margin: 11px 0 0; font-size: 10px; color: var(--ivory-dim); }
  .keys div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted rgba(201,161,90,.16); padding-bottom: 3px; }
  .keys b { color: var(--brass); font-weight: 400; letter-spacing: .06em; }

  .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
  button.act {
    background: linear-gradient(180deg, #e5c88c, #b98d3f);
    border: 1px solid #f0d5a0; color: #1b1405;
    padding: 9px 20px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    transition: filter .12s, transform .12s;
  }
  button.act.ghost { background: transparent; color: var(--brass); border-color: var(--brass-dim); }
  button.act:hover { filter: brightness(1.12); transform: translateY(-1px); }
  button.act:active { transform: translateY(1px); }
  button.act:disabled { filter: saturate(.15) brightness(.7); cursor: default; transform: none; }

  .contracts { display: grid; gap: 4px; margin-top: 10px; }
  .contract {
    display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px;
    padding: 5px 10px; border: 1px solid var(--rule); background: rgba(8,12,22,.55);
    cursor: pointer; text-align: left; color: var(--ivory); font: inherit;
  }
  .contract:hover, .contract:focus-visible { border-color: var(--brass); background: rgba(28,36,56,.7); outline: none; }
  .contract .num { color: var(--brass); font-size: 12px; letter-spacing: .1em; }
  .contract .nm { font-size: 13px; line-height: 1.15; }
  .contract .sub { font-size: 9.5px; line-height: 1.25; color: var(--ivory-dim); letter-spacing: .04em; }
  .contract .grade { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--patina); }
  .contract[data-done="1"] .num::after { content: " ✦"; color: var(--patina); }

  .plot { margin-top: 18px; }
  .plot .bar { height: 3px; background: rgba(4,6,14,.8); border: 1px solid var(--rule); position: relative; }
  .plot .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--patina); width: 0; transition: width .1s linear; }
  .plot .msg { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); margin-bottom: 6px; }

  #muteBtn {
    position: absolute; top: 14px; right: 160px; pointer-events: auto;
    background: rgba(10,14,26,.85); border: 1px solid var(--rule); color: var(--brass);
    padding: 6px 10px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  }
  #muteBtn:hover { border-color: var(--brass); color: var(--brass-bright); }

  #banner {
    position: absolute; left: 50%; top: 13%; transform: translate(-50%, -50%);
    text-align: center; opacity: 0; transition: opacity .3s;
  }
  #banner.on { opacity: 1; }
  #banner .big { font-size: 21px; letter-spacing: .1em; color: var(--brass-bright); }
  #banner .sm  { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--patina); margin-top: 5px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>

<script type="module">
import * as THREE from "three";

/* ============================================================================
   PERIHELION POST
   A mail run through a brass orrery.

   The physics is the game, so it is the part that has to be right:
     - Every world rides a closed Kepler orbit, solved analytically. Position at
       any time t is exact and cheap, which makes the whole simulation seekable
       and bit-for-bit reproducible from a seed.
     - The probe integrates with kick-drift-kick leapfrog at fixed step with
       adaptive substepping near periapsis, where acceleration spikes.
     - The predicted ribbon runs the *same* propagator over the *same* steps as
       live flight, so what you are shown is not an approximation of where you
       will go. It is where you will go.
     - No contract ships without a witness: a launch the generator has actually
       flown to a successful capture. Difficulty is measured, not asserted —
       it is the width of the basin of launches around that witness that still
       deliver the mail.
   ========================================================================== */

const TAU = Math.PI * 2;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isTest = new URLSearchParams(location.search).get("test") === "1";

/* -- Seeded RNG. Same seed, same orrery, forever. ------------------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const next = mulberry32(seed);
  return {
    next,
    range: (lo, hi) => lo + next() * (hi - lo),
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    sign: () => (next() < 0.5 ? -1 : 1),
  };
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (t) => t * t * (3 - 2 * t);

/* ============================================================================
   1. KEPLER
   Bodies never integrate. They are solved.
   ========================================================================== */

/** Solve M = E - e·sin E for the eccentric anomaly. Newton from a warm start. */
function eccentricAnomaly(M, e) {
  if (e < 1e-9) return M;
  let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));
  for (let i = 0; i < 5; i += 1) {
    const s = Math.sin(E);
    const f = E - e * s - M;
    if (Math.abs(f) < 1e-12) break;
    E -= f / (1 - e * Math.cos(E));
  }
  return E;
}

/**
 * Body state in its own orbital frame, lifted into world space by argument of
 * periapsis and inclination. Writes 6 floats: position then velocity.
 */
function orbitState(orbit, t, out, o) {
  const M = orbit.M0 + orbit.n * t;
  const e = orbit.e;
  const E = eccentricAnomaly(M, e);
  const cosE = Math.cos(E);
  const sinE = Math.sin(E);
  const a = orbit.a;
  const r = a * (1 - e * cosE);
  const sq = Math.sqrt(1 - e * e);

  // In-plane position (x forward through periapsis, z along +90°).
  const px = a * (cosE - e);
  const pz = a * sq * sinE;

  // In-plane velocity: derivative of the above through Ė = n·a/r.
  const edot = (orbit.n * a) / r;
  const vx = -edot * sinE;
  const vz = edot * sq * cosE;

  // Tilt the orbital plane about X, then swing periapsis about Y.
  const ci = orbit.cosI, si = orbit.sinI;
  const cw = orbit.cosW, sw = orbit.sinW;

  const x1 = px, y1 = -pz * si, z1 = pz * ci;
  out[o]     = x1 * cw + z1 * sw;
  out[o + 1] = y1;
  out[o + 2] = -x1 * sw + z1 * cw;

  const x2 = vx, y2 = -vz * si, z2 = vz * ci;
  out[o + 3] = x2 * cw + z2 * sw;
  out[o + 4] = y2;
  out[o + 5] = -x2 * sw + z2 * cw;
}

/** Same as orbitState but position only — the hot path inside the integrator. */
function orbitPosition(orbit, t, out, o) {
  const E = eccentricAnomaly(orbit.M0 + orbit.n * t, orbit.e);
  const a = orbit.a;
  const px = a * (Math.cos(E) - orbit.e);
  const pz = a * Math.sqrt(1 - orbit.e * orbit.e) * Math.sin(E);
  const y1 = -pz * orbit.sinI, z1 = pz * orbit.cosI;
  out[o]     = px * orbit.cosW + z1 * orbit.sinW;
  out[o + 1] = y1;
  out[o + 2] = -px * orbit.sinW + z1 * orbit.cosW;
}

function makeOrbit(a, e, omega, M0, mu, inclination = 0, retrograde = false) {
  const n = (retrograde ? -1 : 1) * Math.sqrt(mu / (a * a * a));
  return {
    a, e, omega, M0, n, inclination,
    cosI: Math.cos(inclination), sinI: Math.sin(inclination),
    cosW: Math.cos(omega), sinW: Math.sin(omega),
    period: TAU / Math.abs(n),
  };
}

/* ============================================================================
   2. SYSTEM
   A star (or two), worlds, moons. Parents always precede children so one
   forward pass resolves the whole ephemeris.
   ========================================================================== */

const G_STAR = 460;         // gravitational parameter of a nominal primary
const ESCAPE_RADIUS = 118;  // past here, the post is lost to the dark

class System {
  constructor(bodies) {
    this.bodies = bodies;
    this.count = bodies.length;
    this.pos = new Float64Array(bodies.length * 3);
    this.state = new Float64Array(bodies.length * 6);
    this.mu = new Float64Array(bodies.length);
    this.softR2 = new Float64Array(bodies.length);
    this.hitR2 = new Float64Array(bodies.length);
    for (let i = 0; i < bodies.length; i += 1) {
      this.mu[i] = bodies[i].mu;
      // Soften only strictly inside the surface; impacts are caught separately,
      // so this exists purely to keep the search stable when a candidate clips.
      this.softR2[i] = (bodies[i].radius * 0.75) ** 2;
      this.hitR2[i] = bodies[i].radius ** 2;
    }
    this._posT = NaN;
    this._stateT = NaN;
  }

  /** Positions of every body at time t. Cached on t — callers hammer this. */
  positions(t) {
    if (t === this._posT) return this.pos;
    const { bodies, pos } = this;
    for (let i = 0; i < bodies.length; i += 1) {
      const b = bodies[i];
      const o = i * 3;
      if (!b.orbit) {
        pos[o] = b.fixed[0]; pos[o + 1] = b.fixed[1]; pos[o + 2] = b.fixed[2];
      } else {
        orbitPosition(b.orbit, t, pos, o);
        if (b.parent >= 0) {
          const p = b.parent * 3;
          pos[o] += pos[p]; pos[o + 1] += pos[p + 1]; pos[o + 2] += pos[p + 2];
        }
      }
    }
    this._posT = t;
    return pos;
  }

  /** Positions and velocities. Needed for capture checks and rendering. */
  states(t) {
    if (t === this._stateT) return this.state;
    const { bodies, state } = this;
    for (let i = 0; i < bodies.length; i += 1) {
      const b = bodies[i];
      const o = i * 6;
      if (!b.orbit) {
        state[o] = b.fixed[0]; state[o + 1] = b.fixed[1]; state[o + 2] = b.fixed[2];
        state[o + 3] = 0; state[o + 4] = 0; state[o + 5] = 0;
      } else {
        orbitState(b.orbit, t, state, o);
        if (b.parent >= 0) {
          const p = b.parent * 6;
          for (let k = 0; k < 6; k += 1) state[o + k] += state[p + k];
        }
      }
    }
    this._stateT = t;
    return state;
  }

  bodyState(index, t, out) {
    const s = this.states(t);
    const o = index * 6;
    for (let k = 0; k < 6; k += 1) out[k] = s[o + k];
    return out;
  }
}

/* ============================================================================
   3. PROPAGATOR
   One code path. Live flight, the predicted ribbon, the witness search and the
   basin measurement all run through here, which is why the ribbon is exact.
   ========================================================================== */

const SIM_DT = 1 / 60;          // base step, in simulation seconds
const SUBSTEP_ACCEL = 5.5;      // acceleration above which we subdivide
const MAX_SUBSTEPS = 8;

const _acc = new Float64Array(3);

function accelerationAt(sys, pos, x, y, z, out) {
  let ax = 0, ay = 0, az = 0;
  const { mu, softR2, count } = sys;
  for (let i = 0; i < count; i += 1) {
    const o = i * 3;
    const dx = pos[o] - x, dy = pos[o + 1] - y, dz = pos[o + 2] - z;
    let r2 = dx * dx + dy * dy + dz * dz;
    if (r2 < softR2[i]) r2 = softR2[i];
    const inv = mu[i] / (r2 * Math.sqrt(r2));
    ax += dx * inv; ay += dy * inv; az += dz * inv;
  }
  out[0] = ax; out[1] = ay; out[2] = az;
}

function makeProbeState(x, y, z, vx, vy, vz, t) {
  return { x, y, z, vx, vy, vz, t, ax: 0, ay: 0, az: 0, primed: false };
}

function primeState(sys, s) {
  accelerationAt(sys, sys.positions(s.t), s.x, s.y, s.z, _acc);
  s.ax = _acc[0]; s.ay = _acc[1]; s.az = _acc[2];
  s.primed = true;
}

/** One kick-drift-kick step. Reuses the trailing kick as the next lead kick. */
function integrate(sys, s, dt) {
  const half = dt * 0.5;
  s.vx += half * s.ax; s.vy += half * s.ay; s.vz += half * s.az;
  s.x += dt * s.vx; s.y += dt * s.vy; s.z += dt * s.vz;
  s.t += dt;
  accelerationAt(sys, sys.positions(s.t), s.x, s.y, s.z, _acc);
  s.ax = _acc[0]; s.ay = _acc[1]; s.az = _acc[2];
  s.vx += half * s.ax; s.vy += half * s.ay; s.vz += half * s.az;
}

/** Adaptive step: subdivide where the field is steep, i.e. near periapsis. */
function advanceOne(sys, s, dt) {
  const mag = Math.hypot(s.ax, s.ay, s.az);
  let sub = 1;
  if (mag > SUBSTEP_ACCEL) {
    sub = clamp(Math.ceil(Math.sqrt(mag / SUBSTEP_ACCEL)), 1, MAX_SUBSTEPS);
  }
  const h = dt / sub;
  for (let k = 0; k < sub; k += 1) integrate(sys, s, h);
  return sub;
}

const OUTCOME = {
  FLYING: "flying",
  CAPTURED: "captured",
  IMPACT: "impact",
  STAR: "star",
  ESCAPED: "escaped",
  TIMEOUT: "timeout",
};

const _bs = new Float64Array(6);

/**
 * Fly a probe state forward.
 *
 * opts.duration   simulation seconds to cover
 * opts.dest       destination body index, or -1
 * opts.capture    { radius, speed }
 * opts.beacons    array of { x, y, z, r, taken } — mutated when collected
 * opts.onSample   (state, stepIndex) => void, for ribbon capture
 * opts.sampleEvery
 * opts.stopOnEvent whether capture/impact ends the run
 */
function propagate(sys, s, opts) {
  if (!s.primed) primeState(sys, s);
  const duration = opts.duration;
  const dt = opts.dt || SIM_DT;
  const steps = Math.max(1, Math.round(duration / dt));
  const dest = opts.dest ?? -1;
  const capRadius = opts.capture ? opts.capture.radius : 0;
  const capSpeed = opts.capture ? opts.capture.speed : 0;
  const beacons = opts.beacons;
  const sampleEvery = opts.sampleEvery || 0;
  const onSample = opts.onSample;
  const stopOnEvent = opts.stopOnEvent !== false;

  let collected = opts.collectedStart || 0;
  let closest = Infinity;
  let closestSpeed = Infinity;
  let closestT = s.t;

  if (onSample) onSample(s, 0);

  for (let i = 0; i < steps; i += 1) {
    advanceOne(sys, s, dt);
    const pos = sys.positions(s.t);

    // Contact with any world.
    for (let b = 0; b < sys.count; b += 1) {
      const o = b * 3;
      const dx = s.x - pos[o], dy = s.y - pos[o + 1], dz = s.z - pos[o + 2];
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > sys.hitR2[b]) continue;
      if (stopOnEvent) {
        return finish(sys.bodies[b].kind === "star" ? OUTCOME.STAR : OUTCOME.IMPACT, b);
      }
    }

    // Capture: close enough, and slow enough relative to the world.
    if (dest >= 0) {
      const o = dest * 3;
      const dx = s.x - pos[o], dy = s.y - pos[o + 1], dz = s.z - pos[o + 2];
      const d = Math.hypot(dx, dy, dz);
      if (d < capRadius * 2.4) {
        sys.bodyState(dest, s.t, _bs);
        const rel = Math.hypot(s.vx - _bs[3], s.vy - _bs[4], s.vz - _bs[5]);
        const score = d + rel * 1.15;
        if (score < closest) { closest = score; closestSpeed = rel; closestT = s.t; }
        if (d < capRadius && rel < capSpeed && stopOnEvent) {
          return finish(OUTCOME.CAPTURED, dest);
        }
      }
    }

    // Mail buoys.
    if (beacons) {
      for (let b = 0; b < beacons.length; b += 1) {
        const bc = beacons[b];
        if (bc.taken) continue;
        const dx = s.x - bc.x, dy = s.y - bc.y, dz = s.z - bc.z;
        if (dx * dx + dy * dy + dz * dz <= bc.r * bc.r) {
          bc.taken = true;
          collected += 1;
          if (opts.onBeacon) opts.onBeacon(b);
        }
      }
    }

    if (Math.hypot(s.x, s.y, s.z) > ESCAPE_RADIUS && stopOnEvent) {
      return finish(OUTCOME.ESCAPED, -1);
    }

    if (sampleEvery && onSample && i % sampleEvery === 0) onSample(s, i + 1);
  }

  if (onSample) onSample(s, steps);
  return finish(OUTCOME.FLYING, -1);

  function finish(outcome, body) {
    return { outcome, body, t: s.t, collected, closest, closestSpeed, closestT };
  }
}

/* ============================================================================
   4. GENERATION
   Worlds first, then a witness, then the route, then the difficulty.
   ========================================================================== */

const WORLD_NAMES = [
  "Vesper", "Cinder", "Halcyon", "Marrow", "Tessellate", "Orsolat", "Pell",
  "Quill", "Saltmarch", "Brine", "Ferrant", "Ossuary", "Lantern", "Kettle",
  "Verdigris", "Astrolabe", "Cardamom", "Nocturne", "Fathom", "Reliquary",
];

const PALETTES = {
  rock:  [0x8d6f52, 0x77685c, 0x9a5f43, 0x6d7566, 0xa88356],
  gas:   [0xb98c56, 0x8a7fa8, 0x6f9a91, 0xc08a63, 0x7d8fb5],
  moon:  [0xa9a091, 0x8e9aa0, 0xb0a37f],
};

function buildSystem(rng, params) {
  const bodies = [];
  const nameSource = WORLD_NAMES.slice();
  const takeName = () => nameSource.splice(Math.floor(rng.next() * nameSource.length), 1)[0];

  if (params.binary) {
    // Two lamps about a common barycentre at the origin. Modelled as a pair on
    // mirrored circular orbits, which keeps them exactly Keplerian and exact.
    const sep = rng.range(7.0, 8.6);
    const muEach = G_STAR * 0.5;
    const n = Math.sqrt((2 * muEach) / (sep * sep * sep));
    const phase = rng.range(0, TAU);
    for (let i = 0; i < 2; i += 1) {
      const orbit = makeOrbit(sep * 0.5, 0, 0, phase + i * Math.PI, 1, 0);
      orbit.n = n;
      orbit.period = TAU / n;
      bodies.push({
        name: i === 0 ? "Lamp Major" : "Lamp Minor",
        kind: "star", mu: muEach, radius: 2.15 - i * 0.32,
        parent: -1, orbit, color: i === 0 ? 0xffd9a0 : 0xffc27a, seedPhase: rng.next(),
      });
    }
  } else {
    bodies.push({
      name: "The Lamp", kind: "star", mu: G_STAR, radius: 2.62,
      parent: -1, orbit: null, fixed: [0, 0, 0], color: 0xffd9a0, seedPhase: rng.next(),
    });
  }

  const starMu = params.binary ? G_STAR : G_STAR;
  const planetCount = params.planets;
  const radii = [];
  let radius = params.innerRadius;
  for (let i = 0; i < planetCount; i += 1) {
    radii.push(radius);
    radius *= rng.range(params.spacing[0], params.spacing[1]);
  }

  for (let i = 0; i < planetCount; i += 1) {
    const isGas = params.gasIndex === i || (params.gasIndex === undefined && i === planetCount - 1);
    const bodyRadius = isGas ? rng.range(1.9, 2.35) : rng.range(0.88, 1.22);
    const mu = isGas ? rng.range(9.5, 13.5) : rng.range(3.4, 6.2);
    const inclination = params.flat || i === params.departure || i === params.destHint
      ? 0
      : rng.range(-0.07, 0.07);
    const orbit = makeOrbit(
      radii[i],
      params.circular ? 0 : rng.range(0, 0.11),
      rng.range(0, TAU),
      rng.range(0, TAU),
      starMu,
      inclination,
    );
    bodies.push({
      name: takeName(),
      kind: isGas ? "gas" : "rock",
      mu, radius: bodyRadius, parent: -1, orbit,
      color: rng.pick(isGas ? PALETTES.gas : PALETTES.rock),
      hasRing: isGas,
      seedPhase: rng.next(),
      planetIndex: i,
    });
  }

  // Moons hang off the largest world present.
  if (params.moons > 0) {
    let host = -1;
    let hostMu = 0;
    for (let i = 0; i < bodies.length; i += 1) {
      if (bodies[i].kind === "gas" && bodies[i].mu > hostMu) { host = i; hostMu = bodies[i].mu; }
    }
    if (host >= 0) {
      let ma = bodies[host].radius * rng.range(2.5, 3.1);
      for (let m = 0; m < params.moons; m += 1) {
        const orbit = makeOrbit(ma, 0, rng.range(0, TAU), rng.range(0, TAU), bodies[host].mu, 0);
        bodies.push({
          name: takeName(),
          kind: "moon", mu: rng.range(0.30, 0.55), radius: rng.range(0.46, 0.6),
          parent: host, orbit, color: rng.pick(PALETTES.moon), seedPhase: rng.next(),
        });
        ma *= rng.range(1.55, 1.85);
      }
    }
  }

  return new System(bodies);
}
/* ----------------------------------------------------------------------------
   A tabulated copy of the system. The witness search flies thousands of
   candidate launches; solving Kepler at every step of every one of them is
   waste, because they all walk the same time grid. Solve once, index after.
   -------------------------------------------------------------------------- */
class TabulatedSystem {
  constructor(sys, dt, samples) {
    this.dt = dt;
    this.samples = samples;
    this.count = sys.count;
    this.bodies = sys.bodies;
    this.mu = sys.mu;
    this.softR2 = sys.softR2;
    this.hitR2 = sys.hitR2;
    this.stride = sys.count * 6;
    this.table = new Float64Array((samples + 1) * this.stride);
    for (let k = 0; k <= samples; k += 1) {
      this.table.set(sys.states(k * dt), k * this.stride);
    }
    this.pos = new Float64Array(sys.count * 3);
    this.state = new Float64Array(sys.count * 6);
  }

  _index(t) {
    const k = Math.round(t / this.dt);
    return (k < 0 ? 0 : k > this.samples ? this.samples : k) * this.stride;
  }

  positions(t) {
    const base = this._index(t);
    const { table, pos, count } = this;
    for (let i = 0; i < count; i += 1) {
      const s = base + i * 6, o = i * 3;
      pos[o] = table[s]; pos[o + 1] = table[s + 1]; pos[o + 2] = table[s + 2];
    }
    return pos;
  }

  states(t) {
    const base = this._index(t);
    for (let i = 0; i < this.stride; i += 1) this.state[i] = this.table[base + i];
    return this.state;
  }

  bodyState(index, t, out) {
    const base = this._index(t) + index * 6;
    for (let k = 0; k < 6; k += 1) out[k] = this.table[base + k];
    return out;
  }
}

/* -- Launch geometry ------------------------------------------------------ */

const MAST_FACTOR = 2.6;   // the mail mast stands this many radii above home
const _dir = new Float64Array(3);
const _mast = new Float64Array(3);

/** Prograde-relative burn basis: heading 0 points along the world's motion. */
function burnDirection(vx, vy, vz, heading, out) {
  const sp = Math.hypot(vx, vy, vz) || 1;
  const ux = vx / sp, uy = vy / sp, uz = vz / sp;
  // "left" in the ecliptic: û × ŷ, normalised.
  let wx = uz, wy = 0, wz = -ux;
  const wl = Math.hypot(wx, wy, wz) || 1;
  wx /= wl; wz /= wl;
  const c = Math.cos(heading), s = Math.sin(heading);
  out[0] = ux * c + wx * s;
  out[1] = uy * c + wy * s;
  out[2] = uz * c + wz * s;
  return out;
}

function mastPosition(sys, depIndex, t, out) {
  sys.bodyState(depIndex, t, _bs);
  const r = Math.hypot(_bs[0], _bs[1], _bs[2]) || 1;
  const h = sys.bodies[depIndex].radius * MAST_FACTOR;
  out[0] = _bs[0] + (_bs[0] / r) * h;
  out[1] = _bs[1] + (_bs[1] / r) * h;
  out[2] = _bs[2] + (_bs[2] / r) * h;
  return out;
}

function launchState(sys, depIndex, t0, heading, dv) {
  sys.bodyState(depIndex, t0, _bs);
  const vx = _bs[3], vy = _bs[4], vz = _bs[5];
  burnDirection(vx, vy, vz, heading, _dir);
  mastPosition(sys, depIndex, t0, _mast);
  return makeProbeState(
    _mast[0], _mast[1], _mast[2],
    vx + _dir[0] * dv, vy + _dir[1] * dv, vz + _dir[2] * dv,
    t0,
  );
}

/* -- The search flight ----------------------------------------------------
   Coarse, tabulated, and only interested in one question: does this launch
   ever come near a world it could be captured by, and how much would stopping
   there cost? Beacon coverage rides along for the basin measurement.
   ------------------------------------------------------------------------ */
function searchFlight(sys, s, opts) {
  primeState(sys, s);
  const dt = opts.dt;
  const steps = Math.max(1, Math.round(opts.duration / dt));
  const cands = opts.cands;
  const beacons = opts.beacons;
  const hits = beacons ? new Uint8Array(beacons.length) : null;
  let best = null;

  for (let i = 0; i < steps; i += 1) {
    advanceOne(sys, s, dt);
    const pos = sys.positions(s.t);

    for (let b = 0; b < sys.count; b += 1) {
      const o = b * 3;
      const dx = s.x - pos[o], dy = s.y - pos[o + 1], dz = s.z - pos[o + 2];
      if (dx * dx + dy * dy + dz * dz <= sys.hitR2[b]) {
        return { outcome: sys.bodies[b].kind === "star" ? OUTCOME.STAR : OUTCOME.IMPACT, best, hits, t: s.t };
      }
    }

    for (let c = 0; c < cands.length; c += 1) {
      const idx = cands[c];
      const o = idx * 3;
      const dx = s.x - pos[o], dy = s.y - pos[o + 1], dz = s.z - pos[o + 2];
      const d2 = dx * dx + dy * dy + dz * dz;
      const reach = opts.capRadius[c] * 2.6;
      if (d2 > reach * reach) continue;
      const d = Math.sqrt(d2);
      sys.bodyState(idx, s.t, _bs);
      const rel = Math.hypot(s.vx - _bs[3], s.vy - _bs[4], s.vz - _bs[5]);
      const miss = Math.max(0, d - opts.capRadius[c] * 0.55);
      const score = miss * 2.4 + rel;
      if (!best || score < best.score) {
        best = { body: idx, cand: c, t: s.t, d, rel, score };
      }
    }

    if (hits) {
      for (let b = 0; b < beacons.length; b += 1) {
        if (hits[b]) continue;
        const bc = beacons[b];
        const dx = s.x - bc.x, dy = s.y - bc.y, dz = s.z - bc.z;
        if (dx * dx + dy * dy + dz * dz <= bc.r * bc.r) hits[b] = 1;
      }
    }

    if (Math.hypot(s.x, s.y, s.z) > ESCAPE_RADIUS) {
      return { outcome: OUTCOME.ESCAPED, best, hits, t: s.t };
    }
  }
  return { outcome: OUTCOME.FLYING, best, hits, t: s.t };
}

/* -- Witness search -------------------------------------------------------
   Coarse-to-fine over (launch time, heading, magnitude). No contract ships
   without a launch the generator has flown itself.
   ------------------------------------------------------------------------ */

const SEARCH_DT = 1 / 24;
const DV_RANGE = [2.15, 6.35];
const MIN_FLIGHT = 11;      // below this it is a hop, not a route
const BASIN_FLOOR = 0.02;   // a contract nobody can repeat is not a contract

function* planWitness(sys, plan) {
  const { departure, cands, capRadius, horizon, t0Span } = plan;
  const tsys = new TabulatedSystem(sys, SEARCH_DT, Math.ceil((t0Span + horizon) / SEARCH_DT) + 4);

  const coarse = { nt: 10, nh: 32, nd: 4 };
  const results = [];

  const evaluate = (t0, heading, dv) => {
    const s = launchState(tsys, departure, t0, heading, dv);
    const r = searchFlight(tsys, s, {
      dt: SEARCH_DT, duration: horizon, cands, capRadius,
    });
    if (!r.best) return null;
    if (r.best.t - t0 < MIN_FLIGHT) return null;             // no instant arrivals
    const total = dv + r.best.rel;
    if (total > plan.dvCeiling) return null;
    const entry = {
      t0, heading, dv,
      body: r.best.body, cand: r.best.cand,
      tEnc: r.best.t, d: r.best.d, rel: r.best.rel,
      total,
      score: r.best.score + dv * 0.28 + (r.best.t - t0) * 0.006,
    };
    results.push(entry);
    return entry;
  };

  const totalCoarse = coarse.nt * coarse.nh * coarse.nd;
  let done = 0;
  for (let a = 0; a < coarse.nt; a += 1) {
    const t0 = (a / coarse.nt) * t0Span;
    for (let b = 0; b < coarse.nh; b += 1) {
      const heading = (b / coarse.nh) * TAU;
      for (let c = 0; c < coarse.nd; c += 1) {
        const dv = lerp(DV_RANGE[0], DV_RANGE[1], coarse.nd === 1 ? 0.5 : c / (coarse.nd - 1));
        evaluate(t0, heading, dv);
        done += 1;
      }
    }
    yield (done / totalCoarse) * 0.62;
  }

  if (results.length === 0) return null;
  results.sort((p, q) => p.score - q.score);

  // Refine around the strongest few. Coarse grids find the basin; this finds
  // the floor of it.
  const seeds = results.slice(0, 6);
  const refined = [];
  const dT = t0Span / coarse.nt, dH = TAU / coarse.nh;
  const dD = (DV_RANGE[1] - DV_RANGE[0]) / Math.max(1, coarse.nd - 1);
  for (let i = 0; i < seeds.length; i += 1) {
    const seed = seeds[i];
    for (let a = -1; a <= 1; a += 1) {
      for (let b = -2; b <= 2; b += 1) {
        for (let c = -1; c <= 1; c += 1) {
          const t0 = clamp(seed.t0 + a * dT * 0.5, 0, t0Span);
          const entry = evaluate(t0, seed.heading + b * dH * 0.4, clamp(seed.dv + c * dD * 0.45, DV_RANGE[0], DV_RANGE[1]));
          if (entry) refined.push(entry);
        }
      }
    }
    yield 0.62 + ((i + 1) / seeds.length) * 0.3;
  }

  // Keep the coarse survivors as well as the refined ones. The refined list all
  // sits in one valley; the coarse list is where the *wide* launches live, and
  // a tutorial contract needs a wide launch far more than a cheap one.
  const pool = results.concat(refined);
  pool.sort((p, q) => p.score - q.score);

  // Greedy diversity: a shortlist of launches that are actually different from
  // each other, so the difficulty pass has a real spread to choose between.
  const chosen = [];
  for (const entry of pool) {
    let distinct = true;
    for (const kept of chosen) {
      const dh = Math.abs(((entry.heading - kept.heading + Math.PI * 3) % TAU) - Math.PI);
      if (dh < 0.22 && Math.abs(entry.dv - kept.dv) < 0.45 && Math.abs(entry.t0 - kept.t0) < 1.6) {
        distinct = false;
        break;
      }
    }
    if (distinct) chosen.push(entry);
    if (chosen.length >= 18) break;
  }
  return chosen;
}

/**
 * Confirm a candidate at full fidelity against the real system, with
 * substepping and no tabulation. Returns the confirmed witness or null.
 *
 * The witness is a launch plus a single retro burn taken the instant the probe
 * crosses into the approach sphere. That burn nulls relative motion exactly, so
 * capture is guaranteed rather than hoped for.
 */
function confirmWitness(sys, plan, candidate) {
  const capRadius = plan.capRadius[candidate.cand];
  const s = launchState(sys, plan.departure, candidate.t0, candidate.heading, candidate.dv);
  const path = [];
  const run = propagate(sys, s, {
    duration: plan.horizon,
    dest: candidate.body,
    capture: { radius: capRadius, speed: Infinity },
    stopOnEvent: true,
    sampleEvery: 6,
    onSample: (st) => path.push([st.x, st.y, st.z, st.t]),
  });
  if (run.outcome !== OUTCOME.CAPTURED) return null;
  if (s.t - candidate.t0 < MIN_FLIGHT) return null;

  sys.bodyState(candidate.body, s.t, _bs);
  const retro = Math.hypot(s.vx - _bs[3], s.vy - _bs[4], s.vz - _bs[5]);
  if (retro > plan.capSpeedCeiling) return null;
  const total = candidate.dv + retro;
  if (total > plan.dvCeiling) return null;

  return {
    t0: candidate.t0,
    heading: candidate.heading,
    dv: candidate.dv,
    dest: candidate.body,
    cand: candidate.cand,
    capRadius,
    tEnc: s.t,
    flight: s.t - candidate.t0,
    retro,
    total,
    path,
  };
}

/* -- Route and difficulty ------------------------------------------------- */

/** Mail buoys are hung on the witness path: they *are* the intended route. */
function placeBeacons(witness, count, radius) {
  const path = witness.path;
  const beacons = [];
  if (path.length < 8 || count <= 0) return beacons;
  const lo = 0.14, hi = 0.84;
  for (let i = 0; i < count; i += 1) {
    const f = count === 1 ? 0.5 : lerp(lo, hi, i / (count - 1));
    const p = path[clamp(Math.round(f * (path.length - 1)), 0, path.length - 1)];
    beacons.push({ x: p[0], y: p[1], z: p[2], r: radius, t: p[3], taken: false });
  }
  return beacons;
}

/**
 * Difficulty, measured rather than declared: fly a fixed neighbourhood of
 * launches around the witness and count how many still deliver the mail inside
 * the fuel that ships with the contract. A wide basin is a gentle run. A
 * narrow one is a needle.
 */
const BASIN_BOX = { t0: 0.4, heading: 0.055, dv: 0.14 };
const BASIN_SAMPLES = 132;

function* measureBasin(sys, plan, witness, beacons, fuel) {
  const tsys = new TabulatedSystem(
    sys, SEARCH_DT,
    Math.ceil((witness.t0 + BASIN_BOX.t0 + plan.horizon) / SEARCH_DT) + 4,
  );
  const rng = makeRng(plan.seed ^ 0x5eed1e);
  const cands = [witness.dest];
  const capRadius = [witness.capRadius];
  let ok = 0;

  for (let i = 0; i < BASIN_SAMPLES; i += 1) {
    const t0 = clamp(witness.t0 + rng.range(-BASIN_BOX.t0, BASIN_BOX.t0), 0, plan.t0Span);
    const heading = witness.heading + rng.range(-BASIN_BOX.heading, BASIN_BOX.heading);
    const dv = clamp(witness.dv + rng.range(-BASIN_BOX.dv, BASIN_BOX.dv), DV_RANGE[0], DV_RANGE[1]);
    const probe = launchState(tsys, plan.departure, t0, heading, dv);
    const trial = beacons.map((b) => ({ x: b.x, y: b.y, z: b.z, r: b.r }));
    const r = searchFlight(tsys, probe, {
      dt: SEARCH_DT, duration: plan.horizon, cands, capRadius, beacons: trial,
    });
    if (!r.best || r.best.d > witness.capRadius) continue;
    if (dv + r.best.rel > fuel) continue;
    let all = true;
    for (let b = 0; b < r.hits.length; b += 1) if (!r.hits[b]) { all = false; break; }
    if (all) ok += 1;
    if (i % 22 === 21) yield (i + 1) / BASIN_SAMPLES;
  }
  return ok / BASIN_SAMPLES;
}

const GRADES = [
  { min: 0.30, name: "Gentle", tone: "ok" },

];
const gradeFor = (measure) => GRADES.find((g) => measure >= g.min);

/** Endless mode: the same pipeline, escalating what it is asked to cast. */
function routeSpec(tier, seed) {
  const t = Math.min(tier, 12);
  return {
    key: `route-${tier}`,
    numeral: `R${tier}`,
    name: `Postal Route ${tier}`,
    subtitle: "Standing orders, no rehearsal",
    seed,
    beacons: clamp(2 + Math.floor(t / 2), 2, 5),
    targetBasin: clamp(0.4 - t * 0.032, 0.035, 0.4),
    slack: clamp(1.62 - t * 0.045, 1.16, 1.62),
    horizon: 62 + Math.min(t, 6) * 2,
    destKinds: t >= 5 && t % 3 === 2 ? ["moon"] : undefined,
    brief: "Standing orders from the postmaster. The orrery is new to you; the rules are not.",
    params: {
      planets: clamp(3 + Math.floor(t / 2), 3, 5),
      innerRadius: 13 + (seed % 5) * 0.5,
      spacing: [1.34, 1.54],
      gasIndex: 1 + (t % 3),
      moons: t >= 4 ? clamp(Math.floor(t / 4), 0, 2) : 0,
      binary: t >= 3 && t % 4 === 3,
      flat: t < 3,
      circular: t < 2,
      departure: t >= 4 ? 1 : 0,
    },
  };
}

function planetBodyIndex(sys, planetIndex) {
  for (let i = 0; i < sys.count; i += 1) {
    if (sys.bodies[i].planetIndex === planetIndex) return i;
  }
  return -1;
}

/**
 * The whole build, as a generator so the briefing plate can show it happening
 * instead of the tab freezing while a few million integration steps go by.
 */
function* buildContract(spec, attempt = 0) {
  const seed = (spec.seed + attempt * 7919) >>> 0;
  yield { p: 0.02, msg: "Casting the orrery" };

  const rng = makeRng(seed);
  const params = { ...spec.params, destHint: undefined };
  const sys = buildSystem(rng, params);

  const departure = planetBodyIndex(sys, spec.params.departure) >= 0
    ? planetBodyIndex(sys, spec.params.departure)
    : 1;

  const cands = [];
  for (let i = 0; i < sys.count; i += 1) {
    const b = sys.bodies[i];
    if (i === departure || b.kind === "star") continue;
    if (spec.destKinds && !spec.destKinds.includes(b.kind)) continue;
    cands.push(i);
  }
  if (cands.length === 0) {
    for (let i = 0; i < sys.count; i += 1) {
      if (i !== departure && sys.bodies[i].kind !== "star") cands.push(i);
    }
  }
  const capRadius = cands.map((i) => Math.max(sys.bodies[i].radius * 2.8, 2.4));

  const depPeriod = sys.bodies[departure].orbit ? sys.bodies[departure].orbit.period : 24;
  const plan = {
    seed,
    departure,
    cands,
    capRadius,
    horizon: spec.horizon,
    t0Span: Math.min(depPeriod, 30),
    dvCeiling: DV_CEILING,
    capSpeedCeiling: RETRO_CEILING,
  };

  const search = planWitness(sys, plan);
  let step = search.next();
  while (!step.done) {
    yield { p: 0.04 + step.value * 0.58, msg: "Plotting launch windows" };
    step = search.next();
  }
  const pool = step.value;
  if (!pool || pool.length === 0) return { failed: true, attempt };

  yield { p: 0.6, msg: "Confirming the route" };
  const confirmed = [];
  for (let i = 0; i < pool.length && confirmed.length < 5; i += 1) {
    const w = confirmWitness(sys, plan, pool[i]);
    if (w) confirmed.push(w);
    if (i % 3 === 2) yield { p: 0.6 + (i / pool.length) * 0.08, msg: "Confirming the route" };
  }
  if (confirmed.length === 0) return { failed: true, attempt };

  // Difficulty is chosen, not stumbled into. Every confirmed route gets its
  // basin measured, and the contract ships the one whose margin best matches
  // what this contract is supposed to feel like.
  const target = spec.targetBasin ?? 0.18;
  let best = null;
  for (let i = 0; i < confirmed.length; i += 1) {
    const w = confirmed[i];
    const beacons = placeBeacons(w, spec.beacons, BEACON_RADIUS);
    const fuel = Math.ceil(w.total * spec.slack * 20) / 20;
    const run = measureBasin(sys, plan, w, beacons, fuel);
    let bstep = run.next();
    while (!bstep.done) {
      yield {
        p: 0.68 + ((i + bstep.value) / confirmed.length) * 0.3,
        msg: "Measuring the margin",
      };
      bstep = run.next();
    }
    const basin = bstep.value;
    const penalty = basin < BASIN_FLOOR ? 10 : 0;
    const cost = Math.abs(basin - target) + penalty;
    if (!best || cost < best.cost) best = { witness: w, beacons, fuel, basin, cost };
  }

  yield { p: 1, msg: "Route confirmed" };

  const witness = best.witness;
  return {
    spec, seed, sys, plan, departure,
    dest: witness.dest,
    departName: sys.bodies[departure].name,
    destName: sys.bodies[witness.dest].name,
    capRadius: witness.capRadius,
    capSpeed: CAPTURE_SPEED,
    witness,
    beacons: best.beacons,
    fuel: best.fuel,
    basin: best.basin,
    candidates: confirmed.length,
    grade: gradeFor(best.basin),
    timeLimit: witness.flight * 2.4 + 15,
  };
}

/** Synchronous drive of the same pipeline. Used by tests and by ?test=1 setup. */
function buildContractSync(spec, maxAttempts = 4) {
  for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
    const it = buildContract(spec, attempt);
    let r = it.next();
    while (!r.done) r = it.next();
    if (r.value && !r.value.failed) return r.value;
  }
  return null;
}

/** A radial-gradient sprite, generated in code. Stands in for a bloom pass. */
function glowTexture(inner, outer, power = 2.4) {
  const size = 128;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const img = g.createImageData(size, size);
  const ir = ((inner >> 16) & 255), ig = ((inner >> 8) & 255), ib = inner & 255;
  const or = ((outer >> 16) & 255), og = ((outer >> 8) & 255), ob = outer & 255;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const dx = (x - size / 2) / (size / 2);
      const dy = (y - size / 2) / (size / 2);
      const d = clamp(1 - Math.hypot(dx, dy), 0, 1);
      const a = Math.pow(d, power);
      const o = (y * size + x) * 4;
      img.data[o] = lerp(or, ir, a);
      img.data[o + 1] = lerp(og, ig, a);
      img.data[o + 2] = lerp(ob, ib, a);
      img.data[o + 3] = Math.round(a * 255);
    }
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/** The ecliptic plate: engraved graduations, drawn once into a texture. */
function eclipticTexture() {
  const size = 1024;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const mid = size / 2;
  g.clearRect(0, 0, size, size);

  // Two graduated circles, not one. The rim ring belongs to the whole-orrery
  // view; the inner ring is what you actually read when zoomed to a route.
  g.strokeStyle = "rgba(201,161,90,0.30)";
  g.lineWidth = 1.2;
  for (const band of [{ r: mid - 8, scale: 1 }, { r: (mid - 8) * 0.54, scale: 0.62 }]) {
    for (let i = 0; i < 360; i += 1) {
      const major = i % 30 === 0;
      const medium = i % 10 === 0;
      if (!major && !medium && i % 2 !== 0) continue;
      const len = (major ? 34 : medium ? 18 : 7) * band.scale;
      const a = (i / 360) * TAU;
      g.globalAlpha = (major ? 0.85 : medium ? 0.5 : 0.22) * (band.scale === 1 ? 1 : 0.8);
      g.beginPath();
      g.moveTo(mid + Math.cos(a) * band.r, mid + Math.sin(a) * band.r);
      g.lineTo(mid + Math.cos(a) * (band.r - len), mid + Math.sin(a) * (band.r - len));
      g.stroke();
    }
    g.globalAlpha = 0.5;
    g.beginPath();
    g.arc(mid, mid, band.r, 0, TAU);
    g.stroke();
  }
  g.globalAlpha = 1;

  // Concentric engraved rules; faint, so orbit lines stay dominant.
  for (let r = 0.16; r < 0.98; r += 0.082) {
    g.strokeStyle = `rgba(201,161,90,${r < 0.3 ? 0.16 : 0.1})`;
    g.lineWidth = 1;
    g.beginPath();
    g.arc(mid, mid, r * (mid - 10), 0, TAU);
    g.stroke();
  }

  g.strokeStyle = "rgba(239,230,210,0.16)";
  g.lineWidth = 2;
  g.beginPath();
  g.arc(mid, mid, mid - 9, 0, TAU);
  g.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
